openapi: 3.0.0
info:
  title: NexusLite API
  version: 1.0.0
  description: API for NexusLite Book Source Engine
servers:
  - url: http://localhost:8080/api
    description: Local server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string

  /sources:
    get:
      summary: List all book sources
      responses:
        '200':
          description: List of sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSource'
    post:
      summary: Add a new book source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookSource'
      responses:
        '201':
          description: Source added
        '400':
          description: Invalid source format

  /sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a book source by ID
      responses:
        '200':
          description: Source details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSource'
        '404':
          description: Source not found
    delete:
      summary: Delete a book source
      responses:
        '204':
          description: Source deleted

  /search:
    post:
      summary: Search for books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceId:
                  type: string
                keyword:
                  type: string
              required:
                - sourceId
                - keyword
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookItem'

  /book:
    get:
      summary: Get detailed book information
      parameters:
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookInfo'

  /chapters:
    get:
      summary: Get chapter list
      parameters:
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chapter list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'

  /content:
    get:
      summary: Get chapter content
      parameters:
        - name: sourceId
          in: query
          required: true
          schema:
            type: string
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content text
          content:
            text/plain:
              schema:
                type: string

  /bookshelf:
    get:
      summary: List bookshelf items
      responses:
        '200':
          description: Bookshelf items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookshelfItem'
    post:
      summary: Add book to bookshelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookshelfItem'
      responses:
        '201':
          description: Added

  /bookshelf/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Update reading progress
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                index:
                  type: integer
                position:
                  type: number
      responses:
        '200':
          description: Updated
    delete:
      summary: Remove from bookshelf
      responses:
        '204':
          description: Removed

components:
  schemas:
    BookSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        # ... other properties simplified for now ...

    BookItem:
      type: object
      properties:
        name:
          type: string
        author:
          type: string
        bookUrl:
          type: string
        coverUrl:
          type: string
        latestChapter:
          type: string

    BookInfo:
      type: object
      properties:
        name:
          type: string
        author:
          type: string
        intro:
          type: string
        tocUrl:
          type: string

    Chapter:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
        index:
          type: integer

    BookshelfItem:
      type: object
      properties:
        id:
          type: string
        bookUrl:
          type: string
        name:
          type: string
