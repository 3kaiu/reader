# GitHub Pages Jekyll Configuration
# 免费文档站点

# Site settings
title: "Nexus Reader - 文档"
description: "个人智能阅读系统的完整文档"
url: "https://your-username.github.io"
baseurl: "/nexus-reader"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Collections
collections:
  guides:
    output: true
    permalink: /guides/:name/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# Include files
include:
  - _pages

# Custom variables
author: "Nexus Reader Team"
email: "your-email@example.com"
github_username: "your-username"

# Social links
social:
  github: "your-username/nexus-reader"
  twitter: "your-twitter-handle"

# SEO
logo: /assets/images/logo.png
social_image: /assets/images/social-preview.png