# =============================================================================
# Nexus Reader 飞牛OS Docker Compose配置
# 纯后端模式 - 前端由 Cloudflare Pages 提供
# =============================================================================

services:
  # API 服务 - 纯后端
  nexus-lite:
    image: ghcr.io/${GITHUB_OWNER:-3kaiu}/nexus-lite:${IMAGE_TAG:-latest}
    container_name: nexus-reader-api
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8080}:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - HOST=0.0.0.0
      - PORT=8080
      - TZ=${TZ:-Asia/Shanghai}
      - API_ONLY=true
    volumes:
      - ${DATA_DIR:-./data}/nexus:/app/data
      - ${DATA_DIR:-./data}/cache:/app/cache
      - ${DATA_DIR:-./data}/logs:/app/logs
    networks:
      - nexus-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${NEXUS_MEMORY_LIMIT:-512M}
          cpus: '${NEXUS_CPU_LIMIT:-1.0}'

  # CloudFlare 绕过服务
  cf-bypass:
    image: ghcr.io/${GITHUB_OWNER:-3kaiu}/cf-bypass-service:${IMAGE_TAG:-latest}
    container_name: nexus-cf-bypass
    restart: unless-stopped
    ports:
      - "${CF_BYPASS_PORT:-8001}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/cf-bypass:/app/data
    networks:
      - nexus-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MEMORY:-128mb} --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY:-128M}

networks:
  nexus-network:
    driver: bridge