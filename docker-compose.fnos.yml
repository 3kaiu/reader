services:
  api:
    image: ghcr.io/3kaiu/nexus-server:0.1.0
    container_name: api
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      # Allow local frontends / workers to call the API
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
      # Optional: API key for authentication
      # - API_KEY=change-me
      # Optional: cf-bypass service (uncomment if you enable it)
      # - CF_SERVICE_URL=http://cf-bypass:8000
    volumes:
      - ./data/nexus:/data
      - ./data/cache:/cache
      - ./data/logs:/logs

  bypass:
    build:
      context: ./bypass
    container_name: bypass
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - LOG_LEVEL=INFO
      # Optional API key for /fetch endpoints:
      # - CF_API_KEY=change-me
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data/cf-bypass:/data
