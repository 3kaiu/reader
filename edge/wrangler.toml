name = "nexus-edge"
main = "entry.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Custom hostname: under [env.production] / [env.staging], set routes[].pattern and zone_name to your
# API host and DNS zone (e.g. api.example.com + example.com). Wrangler does not expand env vars here.
# For deploy, run: node scripts/apply-wrangler-placeholders.mjs edge/wrangler.toml

[vars]
ENVIRONMENT = "development"
ENABLE_CACHE = "true"
NEXUS_LITE_URL = "YOUR_NEXUS_LITE_URL_HERE"
# Optional (production / custom domain): set via dashboard or env.production.vars
# CORS_EXTRA_ORIGINS = "https://nexus.pages.dev,https://nexus-reader.pages.dev"

[[kv_namespaces]]
binding = "CONTENT_CACHE_KV"
id = "YOUR_CONTENT_CACHE_KV_ID_HERE"

[env.production]
name = "nexus-edge-prod"
vars = { ENVIRONMENT = "production" }
# Keep the legacy Pages route until the new Nexus domain is provisioned.
routes = [
    { pattern = "api.nexus-reader.pages.dev/*", zone_name = "nexus-reader.pages.dev" }
]

[env.staging]
name = "nexus-edge-staging"
vars = { ENVIRONMENT = "staging" }
# Keep the legacy Pages route until the new Nexus staging domain is provisioned.
routes = [
    { pattern = "staging-api.nexus-reader.pages.dev/*", zone_name = "nexus-reader.pages.dev" }
]
