# Cloudflare Pages Configuration for Nexus Reader

[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "18"
NPM_VERSION = "9"

# Environment variables for build
[env.production]
NODE_ENV = "production"
VITE_API_BASE_URL = "https://api.nexus-reader.com"
VITE_CDN_BASE_URL = "https://cdn.nexus-reader.com"
VITE_APP_VERSION = "$CF_PAGES_COMMIT_SHA"
VITE_BUILD_TIME = "$CF_PAGES_BUILD_TIME"

[env.preview]
NODE_ENV = "staging"
VITE_API_BASE_URL = "https://staging-api.nexus-reader.com"
VITE_CDN_BASE_URL = "https://staging-cdn.nexus-reader.com"
VITE_APP_VERSION = "$CF_PAGES_COMMIT_SHA"
VITE_BUILD_TIME = "$CF_PAGES_BUILD_TIME"

# Headers configuration
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "https://nexus-reader.com"
Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
Access-Control-Allow-Headers = "Content-Type, Authorization"
Access-Control-Max-Age = "86400"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.woff2"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.json"
[headers.values]
Cache-Control = "public, max-age=86400"

# Redirects configuration
[[redirects]]
from = "/docs"
to = "https://nexus-reader.github.io/docs"
status = 301

[[redirects]]
from = "/api/*"
to = "https://api.nexus-reader.com/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Functions configuration (for Pages Functions)
[functions]
directory = "functions"
node_compat = true

# Custom domains
[custom_domains.production]
domain = "nexus-reader.com"
certificate_authority = "lets_encrypt"

[custom_domains.staging]
domain = "staging.nexus-reader.com"
certificate_authority = "lets_encrypt"