# Cloudflare Workers Configuration
# API Proxy + Progress Sync + Bookshelf Backup

name = "nexus-api-proxy"
main = "cloudflare-workers/api-proxy-worker.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# Development
workers_dev = true

# KV for reading progress
[[kv_namespaces]]
binding = "PROGRESS_KV"
id = "${KV_PROGRESS_ID}"

[vars]
ENVIRONMENT = "production"

# Progress Sync Worker
[env.progress]
name = "nexus-progress-sync"
main = "cloudflare-workers/progress-sync-worker.js"

[[env.progress.kv_namespaces]]
binding = "PROGRESS_KV"
id = "${KV_PROGRESS_ID}"

# Bookshelf Backup Worker (R2)
[env.backup]
name = "nexus-bookshelf-backup"
main = "cloudflare-workers/bookshelf-backup-worker.js"

[[env.backup.r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "nexus-backup"
