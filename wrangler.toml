# Cloudflare Workers Configuration
# Progress Sync Worker - 阅读进度跨设备同步

name = "nexus-progress-sync"
main = "cloudflare-workers/progress-sync-worker.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# 开发模式
workers_dev = true

# KV 命名空间 - 阅读进度存储
# 需要在 Cloudflare Dashboard 创建 KV 命名空间后填入 ID
# 或通过 GitHub Secrets 注入
[[kv_namespaces]]
binding = "PROGRESS_KV"
id = "${KV_PROGRESS_ID}"

[vars]
ENVIRONMENT = "production"
