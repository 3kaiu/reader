# Cloudflare Workers Configuration

# ============================================
# Progress Sync Worker - 阅读进度跨设备同步
# ============================================
name = "nexus-progress-sync"
main = "cloudflare-workers/progress-sync-worker.js"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[[kv_namespaces]]
binding = "PROGRESS_KV"
id = "${KV_PROGRESS_ID}"

[vars]
ENVIRONMENT = "production"

# ============================================
# GitHub Auth Worker - GitHub OAuth 认证
# ============================================
[env.auth]
name = "nexus-auth"
main = "cloudflare-workers/github-auth-worker.js"

[env.auth.vars]
# 这些值需要通过 GitHub Secrets 注入
# GITHUB_CLIENT_ID = "xxx"
# GITHUB_CLIENT_SECRET = "xxx"
# AUTH_SECRET = "随机字符串用于签名"
# ALLOWED_GITHUB_USERS = "你的GitHub用户名"
# FRONTEND_URL = "https://nexus-reader.pages.dev"
# WORKER_URL = "https://nexus-auth.xxx.workers.dev"
ENVIRONMENT = "production"
