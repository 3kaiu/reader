# Flyio / FNOS NAS: nexus-server from GHCR + auto-updates (Watchtower).
#
# One-time setup:
# 1. In GitHub: ensure Actions "Publish nexus-server (GHCR)" has run so the image exists.
# 2. Replace YOUR_GITHUB_USER below (or set COMPOSE_PROJECT_NAME / image via .env).
# 3. mkdir -p data sources && copy .nxs into sources/
# 4. If the package is private: create a PAT (read:packages) and set WATCHTOWER_REPO_USER / WATCHTOWER_REPO_PASS.
# 5. docker compose up -d
#
# Cloudflare Tunnel should point at the host:port you publish (e.g. 4310).

services:
  nexus-server:
    # Must match lowercase GitHub username/org used by workflow "Publish nexus-server (GHCR)".
    image: ghcr.io/${GITHUB_USER:-your-github-user-lowercase}/nexus-server:latest
    container_name: nexus-server
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-4310}:7860"
    environment:
      HOST: 0.0.0.0
      PORT: "7860"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./data:/app/data
      - ./sources:/app/sources
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: nexus-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-3600}"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_LABEL_ENABLE: "true"
      REPO_USER: ${WATCHTOWER_REPO_USER:-}
      REPO_PASS: ${WATCHTOWER_REPO_PASS:-}
