name = "nexus-sync-engine"
main = "sync-engine-worker.js"
compatibility_date = "2024-01-01"

# KV命名空间绑定
[[kv_namespaces]]
binding = "USER_DATA_KV"
id = "your-user-data-kv-id"
preview_id = "your-user-data-kv-preview-id"

[[kv_namespaces]]
binding = "SYNC_METADATA_KV"
id = "your-sync-metadata-kv-id"
preview_id = "your-sync-metadata-kv-preview-id"

[[kv_namespaces]]
binding = "NEXUS_KV"
id = "your-nexus-kv-id"
preview_id = "your-nexus-kv-preview-id"

# 环境变量
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "debug"

# 路由配置
[[env.production.routes]]
pattern = "sync.your-domain.com/*"
zone_name = "your-domain.com"

[[env.staging.routes]]
pattern = "sync-staging.your-domain.com/*"
zone_name = "your-domain.com"

# 资源限制
[limits]
cpu_ms = 50