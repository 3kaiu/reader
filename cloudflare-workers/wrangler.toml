name = "nexus-proxy"
main = "unified-worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ADMIN_USER_ID = "auto-admin"

[env.production]
routes = [
    { pattern = "api.novel-decoder.workers.dev/*", zone_name = "novel-decoder.workers.dev" }
]

[[kv_namespaces]]
binding = "DECODER_KV"
id = "decoder_kv_id"
preview_id = "decoder_kv_preview_id"

[[kv_namespaces]]
binding = "AI_CACHE_KV"
id = "ai_cache_kv_id"
preview_id = "ai_cache_kv_preview_id"

[[kv_namespaces]]
binding = "CONTENT_CACHE_KV"
id = "content_cache_kv_id"
preview_id = "content_cache_kv_preview_id"

[[kv_namespaces]]
binding = "PROGRESS_KV"
id = "progress_kv_id"
preview_id = "progress_kv_preview_id"