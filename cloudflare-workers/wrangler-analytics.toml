name = "nexus-analytics"
main = "analytics-worker.js"
compatibility_date = "2024-01-01"

# KV命名空间绑定
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "your-analytics-kv-id"
preview_id = "your-analytics-kv-preview-id"

# 环境变量
[env.production.vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"
CLOUDFLARE_SITE_TAG = "nexus-reader-prod"

[env.staging.vars]
ENVIRONMENT = "staging"
LOG_LEVEL = "debug"
CLOUDFLARE_SITE_TAG = "nexus-reader-staging"

# 路由配置
[[env.production.routes]]
pattern = "analytics.your-domain.com/*"
zone_name = "your-domain.com"

[[env.staging.routes]]
pattern = "analytics-staging.your-domain.com/*"
zone_name = "your-domain.com"

# 资源限制
[limits]
cpu_ms = 50

# 触发器配置
[[triggers.crons]]
cron = "0 */6 * * *"  # 每6小时运行一次清理任务