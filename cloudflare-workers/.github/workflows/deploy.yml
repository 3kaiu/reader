name: Deploy to Cloudflare (Free Tier Optimized)

on:
  push:
    branches: [main, master]
    paths:
      - "cloudflare-workers/**"
      - "nexus-reader/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  deployments: write

jobs:
  # ===== 部署 Cloudflare Pages (免费前端托管) =====
  deploy-pages:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'nexus-reader/') || github.event.inputs.environment != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: nexus-reader
        run: npm ci

      - name: Build for production
        working-directory: nexus-reader
        run: |
          npm run build
          # 注入Cloudflare Pages环境变量
          echo "VITE_ENVIRONMENT=production" >> .env.production
          echo "VITE_API_BASE=https://api.nexus-reader.pages.dev" >> .env.production
        env:
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: nexus-reader
          directory: nexus-reader/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ===== 部署 Cloudflare Workers (免费边缘计算) =====
  deploy-workers:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'cloudflare-workers/') || github.event.inputs.environment != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Install dependencies
        working-directory: cloudflare-workers
        run: npm ci

      - name: Create KV namespaces (if not exist)
        working-directory: cloudflare-workers
        run: |
          # 创建必要的KV命名空间（免费）
          wrangler kv:namespace create "USER_CACHE" --preview false || echo "KV namespace may already exist"
          wrangler kv:namespace create "CONTENT_CACHE" --preview false || echo "KV namespace may already exist"
          wrangler kv:namespace create "RECOMMENDATION" --preview false || echo "KV namespace may already exist"
          wrangler kv:namespace create "ANALYTICS" --preview false || echo "KV namespace may already exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update wrangler.toml with KV IDs
        working-directory: cloudflare-workers
        run: |
          # 自动获取并更新KV命名空间ID
          USER_CACHE_ID=$(wrangler kv:namespace list | jq -r '.[] | select(.title=="nexus-reader-edge-USER_CACHE") | .id')
          CONTENT_CACHE_ID=$(wrangler kv:namespace list | jq -r '.[] | select(.title=="nexus-reader-edge-CONTENT_CACHE") | .id')
          RECOMMENDATION_ID=$(wrangler kv:namespace list | jq -r '.[] | select(.title=="nexus-reader-edge-RECOMMENDATION") | .id')
          ANALYTICS_ID=$(wrangler kv:namespace list | jq -r '.[] | select(.title=="nexus-reader-edge-ANALYTICS") | .id')

          # 更新配置文件
          sed -i "s/user_cache_kv_id/$USER_CACHE_ID/g" wrangler.toml
          sed -i "s/content_cache_kv_id/$CONTENT_CACHE_ID/g" wrangler.toml
          sed -i "s/recommendation_kv_id/$RECOMMENDATION_ID/g" wrangler.toml
          sed -i "s/analytics_kv_id/$ANALYTICS_ID/g" wrangler.toml

      - name: Deploy Workers
        working-directory: cloudflare-workers
        run: |
          # 部署到生产环境
          wrangler deploy --env ${{ github.event.inputs.environment || 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ===== 性能测试和优化 =====
  performance-test:
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-workers]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse Performance Test
        run: |
          # 测试Cloudflare Pages性能
          lhci autorun \
            --config=./lighthouse-config.json \
            --upload.target=temporary-public-storage \
            || echo "Lighthouse test completed with warnings"

      - name: Test Workers API
        run: |
          # 测试Workers API响应时间
          API_URL="https://api.nexus-reader.pages.dev/health"

          # 简单的响应时间测试
          START_TIME=$(date +%s%3N)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $API_URL)
          END_TIME=$(date +%s%3N)
          RESPONSE_TIME=$((END_TIME - START_TIME))

          if [ "$HTTP_CODE" -eq 200 ] && [ "$RESPONSE_TIME" -lt 1000 ]; then
            echo "✅ Workers API test passed (${RESPONSE_TIME}ms)"
          else
            echo "⚠️ Workers API test: ${HTTP_CODE} status, ${RESPONSE_TIME}ms response"
          fi

  # ===== 部署摘要 =====
  summary:
    runs-on: ubuntu-latest
    needs: [deploy-pages, deploy-workers, performance-test]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Cloudflare Free Tier Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Pages部署状态
          if [ "${{ needs.deploy-pages.result }}" == "success" ]; then
            echo "✅ **Cloudflare Pages**: https://nexus-reader.pages.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Cloudflare Pages**: Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Workers部署状态
          if [ "${{ needs.deploy-workers.result }}" == "success" ]; then
            echo "✅ **Cloudflare Workers**: https://api.nexus-reader.pages.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Cloudflare Workers**: Deployment failed" >> $GITHUB_STEP_SUMMARY
          fi

          # 性能测试状态
          if [ "${{ needs.performance-test.result }}" == "success" ]; then
            echo "✅ **Performance Tests**: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Performance Tests**: Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💰 Free Tier Usage" >> $GITHUB_STEP_SUMMARY
          echo "- **Pages**: Unlimited static sites" >> $GITHUB_STEP_SUMMARY
          echo "- **Workers**: 100,000 requests/day free" >> $GITHUB_STEP_SUMMARY
          echo "- **KV**: 1GB storage free" >> $GITHUB_STEP_SUMMARY
          echo "- **Analytics**: Real-time analytics free" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Global CDN" >> $GITHUB_STEP_SUMMARY
          echo "Your app is now served from 200+ global edge locations!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🎉 Enjoy your free, fast, and global web app!**" >> $GITHUB_STEP_SUMMARY