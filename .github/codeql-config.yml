# CodeQL Configuration for NexusLite Advanced Security
#
# Comprehensive security analysis for multi-language project:
# - JavaScript/TypeScript (frontend)
# - Rust (backend services)
# - Python (AI/ML services)

version: 2

# Global settings
disable-default-queries: false

# Language-specific query configurations
queries:
  # Use standard security queries for now
  - uses: security-and-quality
  - uses: security-experimental

# Custom security queries (disabled due to query ID issues)
# - uses: ./codeql-queries/nexus-security.qls

# Paths to exclude from analysis
paths-ignore:
  # Dependencies
  - node_modules/**
  - target/**

  # Build outputs
  - dist/**
  - build/**
  - nexus-reader/dist/**

  # Generated code
  - "**/generated/**"
  - "**/auto-generated/**"

  # Test files
  - "**/*.test.js"
  - "**/*.test.ts"
  - "**/*.spec.js"
  - "**/*.spec.ts"
  - "**/__tests__/**"
  - "**/tests/**"

  # Third-party code
  - "**/vendor/**"
  - "**/third-party/**"
  - "**/external/**"

  # Configuration and docs
  - "**/*.config.js"
  - "**/*.config.ts"
  - "**/*.config.json"
  - "docs/**"
  - "README.md"
  - "CHANGELOG.md"

  # Cloudflare Workers
  - "cloudflare-workers/node_modules/**"

  # Complex configuration files that may cause parsing issues
  - "**/rsbuild.config.ts"
  - "**/vite.config.*.ts"
  - "**/vitest.config.ts"
  - "**/playwright.config.ts"
  - "**/webpack.config.js"
  - "**/rollup.config.js"

  # Scripts and tools
  - "scripts/**"
  - "**/scripts/**"

  # Lock files and package manager files
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/bun.lock"
  - "**/Cargo.lock"

  # IDE and editor files
  - "**/.vscode/**"
  - "**/.idea/**"
  - "**/*.swp"
  - "**/*.swo"

  # OS generated files
  - "**/.DS_Store"
  - "**/Thumbs.db"

  # CI/CD files
  - ".github/**"
  - "**/.github/**"
  - "**/Dockerfile*"
  - "**/docker-compose*.yml"

  # Documentation and examples
  - "**/*.md"
  - "**/docs/**"
  - "**/examples/**"
  - "**/samples/**"

# Custom query packs (create these directories if needed)
# codeql-queries/
#   javascript/
#   rust/
#   python/

# Result interpretation
# severity: warning  # Options: error, warning, note, none
# threshold: 0       # Minimum number of results to report