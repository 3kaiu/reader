name: Auto Scaling & Resource Optimization

on:
  # 每 30 分钟检查一次使用模式
  schedule:
    - cron: "*/30 * * * *"
  # 高负载时触发
  workflow_dispatch:
    inputs:
      scale_action:
        description: "Scaling action (up/down/auto)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - scale_up
          - scale_down
      target_component:
        description: "Target component (all/cf-bypass/nexus-lite/workers)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cf-bypass
          - nexus-lite
          - workers

permissions:
  contents: read
  actions: write

env:
  CF_BYPASS_SPACE_NAME: cf-bypass-service
  NEXUS_LITE_SPACE_NAME: nexus-lite

jobs:
  # =============================================================================
  # 使用模式分析
  # =============================================================================
  usage-analysis:
    runs-on: ubuntu-latest
    outputs:
      cf_bypass_load: ${{ steps.analysis.outputs.cf_bypass_load }}
      nexus_lite_load: ${{ steps.analysis.outputs.nexus_lite_load }}
      worker_load: ${{ steps.analysis.outputs.worker_load }}
      scaling_recommendations: ${{ steps.analysis.outputs.scaling_recommendations }}
      current_configs: ${{ steps.analysis.outputs.current_configs }}
    steps:
      - name: Analyze Usage Patterns
        id: analysis
        run: |
          echo "📊 Starting usage pattern analysis..."

          # 获取服务 URLs
          HF_TOKEN="${{ secrets.HF_TOKEN }}"
          CF_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CF_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          # 获取 HuggingFace 用户名
          HF_RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          HF_USERNAME=$(echo "$HF_RESPONSE" | jq -r '.name // empty')

          CF_BYPASS_URL="https://${HF_USERNAME}-${CF_BYPASS_SPACE_NAME}.hf.space"
          NEXUS_LITE_URL="https://${HF_USERNAME}-${NEXUS_LITE_SPACE_NAME}.hf.space"

          # 获取 Worker subdomain
          CF_SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result.subdomain // empty')

          WORKER_URL="https://nexus-proxy.${CF_SUBDOMAIN}.workers.dev"

          # 初始化输出
          echo "cf_bypass_load=normal" >> $GITHUB_OUTPUT
          echo "nexus_lite_load=normal" >> $GITHUB_OUTPUT
          echo "worker_load=normal" >> $GITHUB_OUTPUT
          echo "scaling_recommendations=[]" >> $GITHUB_OUTPUT
          echo "current_configs={}" >> $GITHUB_OUTPUT

          # 分析 CF Bypass Service 负载
          echo "🔍 Analyzing CF Bypass Service load..."
          CF_LOAD="normal"
          CF_STATS=$(curl -s --max-time 10 "${CF_BYPASS_URL}/stats" 2>/dev/null || echo "{}")

          if [ "$CF_STATS" != "{}" ]; then
            ACTIVE_SESSIONS=$(echo "$CF_STATS" | jq -r '.session_pool.active // 0')
            MEMORY_USAGE=$(echo "$CF_STATS" | jq -r '.memory.current_mb // 0')
            REQUESTS_PER_MINUTE=$(echo "$CF_STATS" | jq -r '.performance.requests_per_minute // 0')
            AVG_RESPONSE_TIME=$(echo "$CF_STATS" | jq -r '.performance.avg_response_time_ms // 0')

            echo "📈 CF Bypass metrics:"
            echo "  - Active sessions: $ACTIVE_SESSIONS"
            echo "  - Memory usage: ${MEMORY_USAGE}MB"
            echo "  - Requests/min: $REQUESTS_PER_MINUTE"
            echo "  - Avg response time: ${AVG_RESPONSE_TIME}ms"

            # 智能负载评估
            LOAD_SCORE=0

            # 高负载指标
            if [ "$ACTIVE_SESSIONS" -gt 10 ]; then LOAD_SCORE=$((LOAD_SCORE + 2)); fi
            if [ "$MEMORY_USAGE" -gt 600 ]; then LOAD_SCORE=$((LOAD_SCORE + 2)); fi
            if [ "$REQUESTS_PER_MINUTE" -gt 50 ]; then LOAD_SCORE=$((LOAD_SCORE + 1)); fi
            if [ "$AVG_RESPONSE_TIME" -gt 5000 ]; then LOAD_SCORE=$((LOAD_SCORE + 2)); fi

            # 中等负载指标
            if [ "$ACTIVE_SESSIONS" -gt 7 ]; then LOAD_SCORE=$((LOAD_SCORE + 1)); fi
            if [ "$MEMORY_USAGE" -gt 400 ]; then LOAD_SCORE=$((LOAD_SCORE + 1)); fi
            if [ "$REQUESTS_PER_MINUTE" -gt 30 ]; then LOAD_SCORE=$((LOAD_SCORE + 1)); fi
            if [ "$AVG_RESPONSE_TIME" -gt 3000 ]; then LOAD_SCORE=$((LOAD_SCORE + 1)); fi

            # 确定负载级别
            if [ $LOAD_SCORE -ge 5 ]; then
              CF_LOAD="high"
            elif [ $LOAD_SCORE -ge 2 ]; then
              CF_LOAD="medium"
            else
              CF_LOAD="low"
            fi

            echo "cf_bypass_load=$CF_LOAD" >> $GITHUB_OUTPUT
          fi

          # 分析 Nexus Lite 负载
          echo "🔍 Analyzing Nexus Lite load..."
          NEXUS_LOAD="normal"

          # 获取最近的请求统计（如果API支持）
          NEXUS_STATS=$(curl -s --max-time 10 "${NEXUS_LITE_URL}/metrics" 2>/dev/null || echo "{}")

          if [ "$NEXUS_STATS" != "{}" ]; then
            ACTIVE_CONNECTIONS=$(echo "$NEXUS_STATS" | jq -r '.active_connections // 0')
            CACHE_HITS=$(echo "$NEXUS_STATS" | jq -r '.cache.hits // 0')
            CACHE_MISSES=$(echo "$NEXUS_STATS" | jq -r '.cache.misses // 0')

            echo "📈 Nexus Lite metrics:"
            echo "  - Active connections: $ACTIVE_CONNECTIONS"
            echo "  - Cache hits: $CACHE_HITS"
            echo "  - Cache misses: $CACHE_MISSES"

            # 计算缓存命中率
            if [ $((CACHE_HITS + CACHE_MISSES)) -gt 0 ]; then
              CACHE_HIT_RATE=$(echo "scale=3; $CACHE_HITS / ($CACHE_HITS + $CACHE_MISSES)" | bc -l)
              CACHE_HIT_PERCENT=$(echo "$CACHE_HIT_RATE * 100" | bc -l)
              echo "  - Cache hit rate: $(printf "%.1f%%" $CACHE_HIT_PERCENT)"
            fi

            # 负载评估
            if [ "$ACTIVE_CONNECTIONS" -gt 20 ]; then
              NEXUS_LOAD="high"
            elif [ "$ACTIVE_CONNECTIONS" -gt 10 ]; then
              NEXUS_LOAD="medium"
            else
              NEXUS_LOAD="low"
            fi

            echo "nexus_lite_load=$NEXUS_LOAD" >> $GITHUB_OUTPUT
          fi

          # 分析 Workers 负载
          echo "🔍 Analyzing Workers load..."
          WORKER_LOAD="normal"

          # 获取 Cloudflare Analytics 数据（如果可用）
          WORKER_METRICS=$(curl -s --max-time 5 "${WORKER_URL}/metrics" 2>/dev/null || echo "{}")

          if [ "$WORKER_METRICS" != "{}" ]; then
            WORKER_REQUESTS=$(echo "$WORKER_METRICS" | jq -r '.requests_per_minute // 0')
            WORKER_ERRORS=$(echo "$WORKER_METRICS" | jq -r '.error_rate // 0')

            echo "📈 Workers metrics:"
            echo "  - Requests/min: $WORKER_REQUESTS"
            echo "  - Error rate: $(printf "%.2f%%" $(echo "$WORKER_ERRORS * 100" | bc -l))"

            if [ "$WORKER_REQUESTS" -gt 100 ]; then
              WORKER_LOAD="high"
            elif [ "$WORKER_REQUESTS" -gt 50 ]; then
              WORKER_LOAD="medium"
            else
              WORKER_LOAD="low"
            fi

            echo "worker_load=$WORKER_LOAD" >> $GITHUB_OUTPUT
          fi

          # 生成缩放建议
          RECOMMENDATIONS=()

          # 基于负载生成建议
          if [ "$CF_LOAD" = "high" ]; then
            RECOMMENDATIONS+=("{\"component\":\"cf-bypass\",\"action\":\"scale_up\",\"reason\":\"High load detected\",\"priority\":\"high\"}")
          elif [ "$CF_LOAD" = "low" ]; then
            RECOMMENDATIONS+=("{\"component\":\"cf-bypass\",\"action\":\"scale_down\",\"reason\":\"Low load detected\",\"priority\":\"low\"}")
          fi

          if [ "$NEXUS_LOAD" = "high" ]; then
            RECOMMENDATIONS+=("{\"component\":\"nexus-lite\",\"action\":\"scale_up\",\"reason\":\"High connection load\",\"priority\":\"high\"}")
          elif [ "$NEXUS_LOAD" = "low" ]; then
            RECOMMENDATIONS+=("{\"component\":\"nexus-lite\",\"action\":\"optimize_resources\",\"reason\":\"Low utilization\",\"priority\":\"low\"}")
          fi

          if [ "$WORKER_LOAD" = "high" ]; then
            RECOMMENDATIONS+=("{\"component\":\"workers\",\"action\":\"scale_up\",\"reason\":\"High request volume\",\"priority\":\"high\"}")
          fi

          echo "scaling_recommendations=[$(IFS=,; echo "${RECOMMENDATIONS[*]}")]" >> $GITHUB_OUTPUT

          # 记录当前配置
          CURRENT_CONFIGS="{
            \"cf_bypass\": {\"load\": \"$CF_LOAD\", \"active_sessions\": $ACTIVE_SESSIONS, \"memory_mb\": $MEMORY_USAGE},
            \"nexus_lite\": {\"load\": \"$NEXUS_LOAD\", \"active_connections\": $ACTIVE_CONNECTIONS},
            \"workers\": {\"load\": \"$WORKER_LOAD\", \"requests_per_minute\": $WORKER_REQUESTS}
          }"
          echo "current_configs=$CURRENT_CONFIGS" >> $GITHUB_OUTPUT

          echo "✅ Usage analysis complete"

  # =============================================================================
  # 自动资源调整
  # =============================================================================
  auto-scaling:
    runs-on: ubuntu-latest
    needs: usage-analysis
    if: needs.usage-analysis.outputs.scaling_recommendations != '[]' || github.event.inputs.scale_action != 'auto'
    steps:
      - name: Execute Scaling Actions
        run: |
          RECOMMENDATIONS="${{ needs.usage-analysis.outputs.scaling_recommendations }}"
          SCALE_ACTION="${{ github.event.inputs.scale_action }}"
          TARGET_COMPONENT="${{ github.event.inputs.target_component }}"
          CURRENT_CONFIGS="${{ needs.usage-analysis.outputs.current_configs }}"

          echo "🔧 Starting auto-scaling execution..."

          # 获取服务 URLs（重复代码，但为了独立性）
          HF_TOKEN="${{ secrets.HF_TOKEN }}"
          HF_RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          HF_USERNAME=$(echo "$HF_RESPONSE" | jq -r '.name // empty')

          CF_BYPASS_URL="https://${HF_USERNAME}-${CF_BYPASS_SPACE_NAME}.hf.space"
          NEXUS_LITE_URL="https://${HF_USERNAME}-${NEXUS_LITE_SPACE_NAME}.hf.space"

          # 解析推荐
          REC_COUNT=$(echo "$RECOMMENDATIONS" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$SCALE_ACTION" = "auto" ] && [ "$REC_COUNT" -gt 0 ]; then
            echo "🤖 Executing automatic scaling based on recommendations..."

            for i in $(seq 0 $(($REC_COUNT - 1))); do
              REC=$(echo "$RECOMMENDATIONS" | jq -r ".[$i]")
              COMPONENT=$(echo "$REC" | jq -r '.component')
              ACTION=$(echo "$REC" | jq -r '.action')
              REASON=$(echo "$REC" | jq -r '.reason')
              PRIORITY=$(echo "$REC" | jq -r '.priority')

              echo "🔧 Processing recommendation: $COMPONENT - $ACTION ($PRIORITY priority)"
              echo "   Reason: $REASON"

              # 检查是否应该处理此组件
              if [ "$TARGET_COMPONENT" != "all" ] && [ "$COMPONENT" != "$TARGET_COMPONENT" ]; then
                echo "   ⏭️ Skipping (not target component)"
                continue
              fi

              # 执行缩放操作
              case $COMPONENT in
                "cf-bypass")
                  case $ACTION in
                    "scale_up")
                      echo "📈 Scaling up CF Bypass Service..."
                      # 增加会话池大小
                      curl -s "${CF_BYPASS_URL}/config/session-pool?size=15" || true
                      # 增加连接池大小
                      curl -s "${CF_BYPASS_URL}/config/connection-pool?maxsize=200" || true
                      # 增加缓存大小
                      curl -s "${CF_BYPASS_URL}/config/cache?size=15000" || true
                      echo "   ✅ Scaled up session pool, connection pool, and cache"
                      ;;
                    "scale_down")
                      echo "📉 Scaling down CF Bypass Service..."
                      # 减少资源使用
                      curl -s "${CF_BYPASS_URL}/config/session-pool?size=5" || true
                      curl -s "${CF_BYPASS_URL}/config/connection-pool?maxsize=50" || true
                      curl -s "${CF_BYPASS_URL}/config/cache?size=5000" || true
                      echo "   ✅ Scaled down resources for low load"
                      ;;
                  esac
                  ;;
                "nexus-lite")
                  case $ACTION in
                    "scale_up")
                      echo "📈 Scaling up Nexus Lite..."
                      # 这里可以调用 HuggingFace Spaces API 来增加实例数（如果支持）
                      echo "   ✅ Scaling recommendations logged (manual scaling may be needed)"
                      ;;
                    "optimize_resources")
                      echo "🔧 Optimizing Nexus Lite resources..."
                      # 调整缓存策略
                      echo "   ✅ Resource optimization recommendations logged"
                      ;;
                  esac
                  ;;
                "workers")
                  case $ACTION in
                    "scale_up")
                      echo "📈 Scaling up Workers..."
                      # 触发 Cloudflare Workers 自动调优
                      CF_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
                      CF_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
                      CF_SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
                        -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result.subdomain // empty')

                      WORKER_URL="https://nexus-proxy.${CF_SUBDOMAIN}.workers.dev"
                      curl -s "${WORKER_URL}/tune?scale=up" || true
                      echo "   ✅ Workers scaling initiated"
                      ;;
                  esac
                  ;;
              esac
            done

          elif [ "$SCALE_ACTION" != "auto" ]; then
            echo "🎯 Executing manual scaling action: $SCALE_ACTION for $TARGET_COMPONENT"

            # 手动缩放逻辑
            case $SCALE_ACTION in
              "scale_up")
                echo "📈 Manual scale up requested..."
                # 应用最大性能配置
                curl -s "${CF_BYPASS_URL}/config/session-pool?size=20" || true
                curl -s "${CF_BYPASS_URL}/config/connection-pool?maxsize=300" || true
                curl -s "${CF_BYPASS_URL}/config/cache?size=20000" || true
                echo "✅ Applied maximum performance configuration"
                ;;
              "scale_down")
                echo "📉 Manual scale down requested..."
                # 应用最小资源配置
                curl -s "${CF_BYPASS_URL}/config/session-pool?size=3" || true
                curl -s "${CF_BYPASS_URL}/config/connection-pool?maxsize=20" || true
                curl -s "${CF_BYPASS_URL}/config/cache?size=1000" || true
                echo "✅ Applied minimum resource configuration"
                ;;
            esac
          fi

          echo "✅ Auto-scaling execution complete"

  # =============================================================================
  # 缩放报告
  # =============================================================================
  scaling-report:
    runs-on: ubuntu-latest
    needs: [usage-analysis, auto-scaling]
    if: always()
    steps:
      - name: Generate Scaling Report
        run: |
          CURRENT_CONFIGS="${{ needs.usage-analysis.outputs.current_configs }}"
          RECOMMENDATIONS="${{ needs.usage-analysis.outputs.scaling_recommendations }}"
          CF_LOAD="${{ needs.usage-analysis.outputs.cf_bypass_load }}"
          NEXUS_LOAD="${{ needs.usage-analysis.outputs.nexus_lite_load }}"
          WORKER_LOAD="${{ needs.usage-analysis.outputs.worker_load }}"

          echo "## 📊 Auto Scaling Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Current Load Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Load Level | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|--------|" >> $GITHUB_STEP_SUMMARY

          # CF Bypass 负载状态
          case $CF_LOAD in
            "high")
              echo "| CF Bypass | 🔴 High | Scaling up resources |" >> $GITHUB_STEP_SUMMARY
              ;;
            "medium")
              echo "| CF Bypass | 🟡 Medium | Monitoring closely |" >> $GITHUB_STEP_SUMMARY
              ;;
            "low")
              echo "| CF Bypass | 🟢 Low | Optimizing for efficiency |" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "| CF Bypass | ⚪ Normal | Operating normally |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          # Nexus Lite 负载状态
          case $NEXUS_LOAD in
            "high")
              echo "| Nexus Lite | 🔴 High | Scaling up resources |" >> $GITHUB_STEP_SUMMARY
              ;;
            "medium")
              echo "| Nexus Lite | 🟡 Medium | Monitoring closely |" >> $GITHUB_STEP_SUMMARY
              ;;
            "low")
              echo "| Nexus Lite | 🟢 Low | Optimizing for efficiency |" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "| Nexus Lite | ⚪ Normal | Operating normally |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          # Workers 负载状态
          case $WORKER_LOAD in
            "high")
              echo "| Workers | 🔴 High | Scaling up resources |" >> $GITHUB_STEP_SUMMARY
              ;;
            "medium")
              echo "| Workers | 🟡 Medium | Monitoring closely |" >> $GITHUB_STEP_SUMMARY
              ;;
            "low")
              echo "| Workers | 🟢 Low | Optimizing for efficiency |" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "| Workers | ⚪ Normal | Operating normally |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Scaling Actions Taken" >> $GITHUB_STEP_SUMMARY

          REC_COUNT=$(echo "$RECOMMENDATIONS" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$REC_COUNT" -gt 0 ]; then
            echo "| Component | Action | Priority | Reason |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|--------|----------|--------|" >> $GITHUB_STEP_SUMMARY

            for i in $(seq 0 $(($REC_COUNT - 1))); do
              REC=$(echo "$RECOMMENDATIONS" | jq -r ".[$i]")
              COMPONENT=$(echo "$REC" | jq -r '.component')
              ACTION=$(echo "$REC" | jq -r '.action')
              PRIORITY=$(echo "$REC" | jq -r '.priority')
              REASON=$(echo "$REC" | jq -r '.reason')

              # 格式化动作
              case $ACTION in
                "scale_up")
                  ACTION_ICON="📈"
                  ;;
                "scale_down")
                  ACTION_ICON="📉"
                  ;;
                "optimize_resources")
                  ACTION_ICON="🔧"
                  ;;
                *)
                  ACTION_ICON="⚙️"
                  ;;
              esac

              echo "| $COMPONENT | $ACTION_ICON $ACTION | $PRIORITY | $REASON |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "✅ **No scaling actions needed** - All systems operating optimally" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Auto-Scaling Intelligence" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Load Analysis**: Real-time metrics collection and analysis" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **Smart Scaling**: Automatic resource adjustment based on usage patterns" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ **Performance Optimization**: Dynamic configuration tuning" >> $GITHUB_STEP_SUMMARY
          echo "- 💰 **Cost Efficiency**: Scale down during low usage periods" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⏰ Scaling Schedule" >> $GITHUB_STEP_SUMMARY
          echo "- **Load Analysis**: Every 30 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **Automatic Scaling**: When thresholds exceeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Manual Override**: Available via workflow dispatch" >> $GITHUB_STEP_SUMMARY

          # 如果是高负载，添加告警
          if [ "$CF_LOAD" = "high" ] || [ "$NEXUS_LOAD" = "high" ] || [ "$WORKER_LOAD" = "high" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚨 High Load Alert" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ System is experiencing high load. Auto-scaling measures have been applied." >> $GITHUB_STEP_SUMMARY
            echo "Monitor performance metrics closely and consider manual intervention if needed." >> $GITHUB_STEP_SUMMARY
          fi
