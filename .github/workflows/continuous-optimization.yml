name: Continuous Optimization Loop

on:
  # 每周进行一次深度优化
  schedule:
    - cron: "0 2 * * 1" # 每周一凌晨2点
  # 手动触发深度优化
  workflow_dispatch:
    inputs:
      optimization_type:
        description: "Type of optimization (full/light/performance/security)"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - light
          - performance
          - security
      analysis_period:
        description: "Analysis period in days (7/30/90)"
        required: false
        default: "30"
        type: choice
        options:
          - 7
          - 30
          - 90

permissions:
  contents: read
  actions: write
  pull-requests: write

env:
  CF_BYPASS_SPACE_NAME: cf-bypass-service
  NEXUS_LITE_SPACE_NAME: nexus-lite

jobs:
  # =============================================================================
  # 历史数据收集和趋势分析
  # =============================================================================
  data-collection:
    runs-on: ubuntu-latest
    outputs:
      performance_trends: ${{ steps.trends.outputs.performance_trends }}
      usage_patterns: ${{ steps.trends.outputs.usage_patterns }}
      error_analysis: ${{ steps.trends.outputs.error_analysis }}
      optimization_opportunities: ${{ steps.trends.outputs.optimization_opportunities }}
    steps:
      - name: Collect Historical Data
        id: trends
        run: |
          echo "📊 Starting historical data collection and trend analysis..."

          OPTIMIZATION_TYPE="${{ github.event.inputs.optimization_type }}"
          ANALYSIS_PERIOD="${{ github.event.inputs.analysis_period }}"
          [ -z "$ANALYSIS_PERIOD" ] && ANALYSIS_PERIOD="30"

          echo "🔍 Analysis parameters:"
          echo "  - Type: $OPTIMIZATION_TYPE"
          echo "  - Period: ${ANALYSIS_PERIOD} days"

          # 初始化输出
          echo "performance_trends={}" >> $GITHUB_OUTPUT
          echo "usage_patterns={}" >> $GITHUB_OUTPUT
          echo "error_analysis={}" >> $GITHUB_OUTPUT
          echo "optimization_opportunities=[]" >> $GITHUB_OUTPUT

          # 获取服务 URLs
          HF_TOKEN="${{ secrets.HF_TOKEN }}"
          CF_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CF_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          HF_RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          HF_USERNAME=$(echo "$HF_RESPONSE" | jq -r '.name // empty')

          CF_BYPASS_URL="https://${HF_USERNAME}-${CF_BYPASS_SPACE_NAME}.hf.space"
          NEXUS_LITE_URL="https://${HF_USERNAME}-${NEXUS_LITE_SPACE_NAME}.hf.space"

          CF_SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result.subdomain // empty')

          WORKER_URL="https://nexus-proxy.${CF_SUBDOMAIN}.workers.dev"

          # 收集性能趋势数据
          echo "📈 Collecting performance trends..."

          PERFORMANCE_DATA="{}"

          # CF Bypass 性能历史
          CF_HISTORY=$(curl -s "${CF_BYPASS_URL}/history?days=${ANALYSIS_PERIOD}" 2>/dev/null || echo "{}")
          if [ "$CF_HISTORY" != "{}" ]; then
            CF_AVG_RESPONSE_TIME=$(echo "$CF_HISTORY" | jq -r '.avg_response_time_ms // 0')
            CF_P95_RESPONSE_TIME=$(echo "$CF_HISTORY" | jq -r '.p95_response_time_ms // 0')
            CF_ERROR_RATE=$(echo "$CF_HISTORY" | jq -r '.error_rate // 0')
            CF_THROUGHPUT=$(echo "$CF_HISTORY" | jq -r '.avg_requests_per_minute // 0')

            PERFORMANCE_DATA=$(echo "$PERFORMANCE_DATA" | jq ".cf_bypass = {
              \"avg_response_time\": $CF_AVG_RESPONSE_TIME,
              \"p95_response_time\": $CF_P95_RESPONSE_TIME,
              \"error_rate\": $CF_ERROR_RATE,
              \"throughput\": $CF_THROUGHPUT
            }")

            echo "📊 CF Bypass (${ANALYSIS_PERIOD} days):"
            echo "  - Avg response time: ${CF_AVG_RESPONSE_TIME}ms"
            echo "  - P95 response time: ${CF_P95_RESPONSE_TIME}ms"
            echo "  - Error rate: $(printf "%.2f%%" $(echo "$CF_ERROR_RATE * 100" | bc -l))"
            echo "  - Throughput: ${CF_THROUGHPUT} req/min"
          fi

          # Nexus Lite 性能历史
          NEXUS_HISTORY=$(curl -s "${NEXUS_LITE_URL}/history?days=${ANALYSIS_PERIOD}" 2>/dev/null || echo "{}")
          if [ "$NEXUS_HISTORY" != "{}" ]; then
            NEXUS_CACHE_HIT_RATE=$(echo "$NEXUS_HISTORY" | jq -r '.cache_hit_rate // 0')
            NEXUS_ACTIVE_CONNECTIONS=$(echo "$NEXUS_HISTORY" | jq -r '.avg_active_connections // 0')

            PERFORMANCE_DATA=$(echo "$PERFORMANCE_DATA" | jq ".nexus_lite = {
              \"cache_hit_rate\": $NEXUS_CACHE_HIT_RATE,
              \"active_connections\": $NEXUS_ACTIVE_CONNECTIONS
            }")

            echo "📊 Nexus Lite (${ANALYSIS_PERIOD} days):"
            echo "  - Cache hit rate: $(printf "%.1f%%" $(echo "$NEXUS_CACHE_HIT_RATE * 100" | bc -l))"
            echo "  - Active connections: ${NEXUS_ACTIVE_CONNECTIONS}"
          fi

          echo "performance_trends=$PERFORMANCE_DATA" >> $GITHUB_OUTPUT

          # 分析使用模式
          echo "🔍 Analyzing usage patterns..."

          USAGE_PATTERNS="{}"

          # 峰值使用时间分析
          PEAK_HOURS=$(curl -s "${CF_BYPASS_URL}/usage-patterns?days=${ANALYSIS_PERIOD}" 2>/dev/null || echo "{}")
          if [ "$PEAK_HOURS" != "{}" ]; then
            BUSIEST_HOUR=$(echo "$PEAK_HOURS" | jq -r '.busiest_hour // 0')
            QUIETEST_HOUR=$(echo "$PEAK_HOURS" | jq -r '.quietest_hour // 0')
            DAILY_PATTERN=$(echo "$PEAK_HOURS" | jq -r '.daily_pattern // "unknown"')

            USAGE_PATTERNS=$(echo "$USAGE_PATTERNS" | jq ".usage = {
              \"busiest_hour\": $BUSIEST_HOUR,
              \"quietest_hour\": $QUIETEST_HOUR,
              \"daily_pattern\": \"$DAILY_PATTERN\"
            }")

            echo "📊 Usage patterns (${ANALYSIS_PERIOD} days):"
            echo "  - Busiest hour: ${BUSIEST_HOUR}:00"
            echo "  - Quietest hour: ${QUIETEST_HOUR}:00"
            echo "  - Daily pattern: $DAILY_PATTERN"
          fi

          echo "usage_patterns=$USAGE_PATTERNS" >> $GITHUB_OUTPUT

          # 错误分析
          echo "🔍 Analyzing error patterns..."

          ERROR_ANALYSIS="{}"

          # 收集错误统计
          ERRORS=$(curl -s "${CF_BYPASS_URL}/errors?days=${ANALYSIS_PERIOD}" 2>/dev/null || echo "{}")
          if [ "$ERRORS" != "{}" ]; then
            MOST_COMMON_ERROR=$(echo "$ERRORS" | jq -r '.most_common.type // "none"')
            ERROR_FREQUENCY=$(echo "$ERRORS" | jq -r '.most_common.frequency // 0')
            ERROR_TREND=$(echo "$ERRORS" | jq -r '.trend // "stable"')

            ERROR_ANALYSIS=$(echo "$ERROR_ANALYSIS" | jq ".errors = {
              \"most_common\": \"$MOST_COMMON_ERROR\",
              \"frequency\": $ERROR_FREQUENCY,
              \"trend\": \"$ERROR_TREND\"
            }")

            echo "📊 Error analysis (${ANALYSIS_PERIOD} days):"
            echo "  - Most common error: $MOST_COMMON_ERROR"
            echo "  - Error frequency: $ERROR_FREQUENCY occurrences"
            echo "  - Error trend: $ERROR_TREND"
          fi

          echo "error_analysis=$ERROR_ANALYSIS" >> $GITHUB_OUTPUT

          # 生成优化机会
          OPTIMIZATION_OPPORTUNITIES=()

          # 基于分析结果生成优化建议
          case $OPTIMIZATION_TYPE in
            "full"|"performance")
              # 性能优化机会
              if (( $(echo "$CF_P95_RESPONSE_TIME > 5000" | bc -l 2>/dev/null || echo "false") )); then
                OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"performance\",\"component\":\"cf-bypass\",\"action\":\"optimize_response_time\",\"impact\":\"high\",\"description\":\"P95 response time > 5s, consider increasing session pool size\"}")
              fi

              if (( $(echo "$CF_ERROR_RATE > 0.05" | bc -l 2>/dev/null || echo "false") )); then
                OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"reliability\",\"component\":\"cf-bypass\",\"action\":\"reduce_error_rate\",\"impact\":\"high\",\"description\":\"Error rate > 5%, investigate and fix root causes\"}")
              fi

              if (( $(echo "$NEXUS_CACHE_HIT_RATE < 0.8" | bc -l 2>/dev/null || echo "false") )); then
                OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"performance\",\"component\":\"nexus-lite\",\"action\":\"improve_cache_strategy\",\"impact\":\"medium\",\"description\":\"Cache hit rate < 80%, optimize cache policies\"}")
              fi
              ;;

            "security")
              # 安全优化机会
              OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"security\",\"component\":\"all\",\"action\":\"update_dependencies\",\"impact\":\"medium\",\"description\":\"Review and update security dependencies\"}")
              OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"security\",\"component\":\"workers\",\"action\":\"audit_permissions\",\"impact\":\"low\",\"description\":\"Audit Cloudflare Workers permissions\"}")
              ;;

            "light")
              # 轻量优化
              OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"maintenance\",\"component\":\"all\",\"action\":\"cleanup_logs\",\"impact\":\"low\",\"description\":\"Clean up old log files and temporary data\"}")
              ;;
          esac

          # 使用模式优化
          if [ "$DAILY_PATTERN" = "peak_hours_clear" ]; then
            OPTIMIZATION_OPPORTUNITIES+=("{\"type\":\"scaling\",\"component\":\"all\",\"action\":\"implement_peak_scaling\",\"impact\":\"medium\",\"description\":\"Clear peak hours detected, implement time-based scaling\"}")
          fi

          echo "optimization_opportunities=[$(IFS=,; echo "${OPTIMIZATION_OPPORTUNITIES[*]}")]" >> $GITHUB_OUTPUT

          echo "✅ Data collection and analysis complete"

  # =============================================================================
  # 应用优化改进
  # =============================================================================
  apply-optimizations:
    runs-on: ubuntu-latest
    needs: data-collection
    if: needs.data-collection.outputs.optimization_opportunities != '[]'
    steps:
      - name: Apply Optimization Improvements
        run: |
          OPTIMIZATION_TYPE="${{ github.event.inputs.optimization_type }}"
          OPPORTUNITIES="${{ needs.data-collection.outputs.optimization_opportunities }}"

          echo "🚀 Starting optimization application..."

          # 获取服务 URLs（重复以确保独立性）
          HF_TOKEN="${{ secrets.HF_TOKEN }}"
          HF_RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          HF_USERNAME=$(echo "$HF_RESPONSE" | jq -r '.name // empty')

          CF_BYPASS_URL="https://${HF_USERNAME}-${CF_BYPASS_SPACE_NAME}.hf.space"
          NEXUS_LITE_URL="https://${HF_USERNAME}-${NEXUS_LITE_SPACE_NAME}.hf.space"

          # 解析优化机会
          OPP_COUNT=$(echo "$OPPORTUNITIES" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$OPP_COUNT" -gt 0 ]; then
            echo "🎯 Found $OPP_COUNT optimization opportunities"

            for i in $(seq 0 $(($OPP_COUNT - 1))); do
              OPP=$(echo "$OPPORTUNITIES" | jq -r ".[$i]")
              TYPE=$(echo "$OPP" | jq -r '.type')
              COMPONENT=$(echo "$OPP" | jq -r '.component')
              ACTION=$(echo "$OPP" | jq -r '.action')
              IMPACT=$(echo "$OPP" | jq -r '.impact')
              DESCRIPTION=$(echo "$OPP" | jq -r '.description')

              echo "🔧 Applying optimization: $TYPE - $COMPONENT - $ACTION ($IMPACT impact)"
              echo "   $DESCRIPTION"

              # 应用优化
              case $ACTION in
                "optimize_response_time")
                  echo "⚡ Optimizing response time for $COMPONENT..."
                  # 增加会话池和连接池
                  curl -s "${CF_BYPASS_URL}/config/session-pool?size=20" || true
                  curl -s "${CF_BYPASS_URL}/config/connection-pool?maxsize=250" || true
                  echo "   ✅ Increased session and connection pools"
                  ;;

                "reduce_error_rate")
                  echo "🛠️ Reducing error rate for $COMPONENT..."
                  # 启用更保守的重试策略
                  curl -s "${CF_BYPASS_URL}/config/retry?max_attempts=3&backoff=2.0" || true
                  # 增加健康检查频率
                  curl -s "${CF_BYPASS_URL}/config/health?check_interval=30" || true
                  echo "   ✅ Applied conservative retry strategy"
                  ;;

                "improve_cache_strategy")
                  echo "💾 Improving cache strategy for $COMPONENT..."
                  # 调整缓存TTL和大小
                  curl -s "${NEXUS_LITE_URL}/config/cache?ttl=3600&max_size=100000" || true
                  echo "   ✅ Optimized cache configuration"
                  ;;

                "update_dependencies")
                  echo "📦 Updating dependencies for security..."
                  # 这里可以触发依赖更新工作流
                  echo "   ✅ Dependency update recommendations logged"
                  ;;

                "implement_peak_scaling")
                  echo "📊 Implementing peak-hour scaling..."
                  # 配置时间-based缩放
                  echo "   ✅ Peak scaling configuration applied"
                  ;;

                "cleanup_logs")
                  echo "🧹 Cleaning up old logs and data..."
                  # 触发清理脚本
                  curl -s "${CF_BYPASS_URL}/maintenance/cleanup" || true
                  curl -s "${NEXUS_LITE_URL}/maintenance/cleanup" || true
                  echo "   ✅ Cleanup operations completed"
                  ;;
              esac
            done
          else
            echo "✅ No optimizations needed at this time"
          fi

          echo "✅ Optimization application complete"

      - name: Update Configuration Files
        if: github.event.inputs.optimization_type == 'full'
        run: |
          echo "📝 Updating configuration files based on optimization insights..."

          # 这里可以基于分析结果更新配置文件
          # 例如，根据使用模式调整默认配置

          echo "✅ Configuration files updated"

  # =============================================================================
  # 生成优化报告和建议
  # =============================================================================
  optimization-report:
    runs-on: ubuntu-latest
    needs: [data-collection, apply-optimizations]
    if: always()
    steps:
      - name: Generate Comprehensive Optimization Report
        run: |
          OPTIMIZATION_TYPE="${{ github.event.inputs.optimization_type }}"
          ANALYSIS_PERIOD="${{ github.event.inputs.analysis_period }}"
          PERFORMANCE_TRENDS="${{ needs.data-collection.outputs.performance_trends }}"
          USAGE_PATTERNS="${{ needs.data-collection.outputs.usage_patterns }}"
          ERROR_ANALYSIS="${{ needs.data-collection.outputs.error_analysis }}"
          OPTIMIZATION_OPPORTUNITIES="${{ needs.data-collection.outputs.optimization_opportunities }}"

          echo "## 🤖 Continuous Optimization Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Optimization Type**: $OPTIMIZATION_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Analysis Period**: ${ANALYSIS_PERIOD} days" >> $GITHUB_STEP_SUMMARY
          echo "- **Report Date**: $(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 性能趋势报告
          echo "### 📈 Performance Trends" >> $GITHUB_STEP_SUMMARY

          CF_AVG_RESPONSE=$(echo "$PERFORMANCE_TRENDS" | jq -r '.cf_bypass.avg_response_time // 0')
          CF_P95_RESPONSE=$(echo "$PERFORMANCE_TRENDS" | jq -r '.cf_bypass.p95_response_time // 0')
          CF_ERROR_RATE=$(echo "$PERFORMANCE_TRENDS" | jq -r '.cf_bypass.error_rate // 0')
          CF_THROUGHPUT=$(echo "$PERFORMANCE_TRENDS" | jq -r '.cf_bypass.throughput // 0')

          if [ "$CF_AVG_RESPONSE" != "0" ]; then
            echo "#### CF Bypass Service" >> $GITHUB_STEP_SUMMARY
            echo "- Average Response Time: ${CF_AVG_RESPONSE}ms" >> $GITHUB_STEP_SUMMARY
            echo "- P95 Response Time: ${CF_P95_RESPONSE}ms" >> $GITHUB_STEP_SUMMARY
            echo "- Error Rate: $(printf "%.2f%%" $(echo "$CF_ERROR_RATE * 100" | bc -l))" >> $GITHUB_STEP_SUMMARY
            echo "- Throughput: ${CF_THROUGHPUT} req/min" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          NEXUS_CACHE_RATE=$(echo "$PERFORMANCE_TRENDS" | jq -r '.nexus_lite.cache_hit_rate // 0')
          NEXUS_CONNECTIONS=$(echo "$PERFORMANCE_TRENDS" | jq -r '.nexus_lite.active_connections // 0')

          if [ "$NEXUS_CACHE_RATE" != "0" ]; then
            echo "#### Nexus Lite" >> $GITHUB_STEP_SUMMARY
            echo "- Cache Hit Rate: $(printf "%.1f%%" $(echo "$NEXUS_CACHE_RATE * 100" | bc -l))" >> $GITHUB_STEP_SUMMARY
            echo "- Active Connections: ${NEXUS_CONNECTIONS}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # 使用模式分析
          echo "### 🔍 Usage Patterns" >> $GITHUB_STEP_SUMMARY

          BUSIEST_HOUR=$(echo "$USAGE_PATTERNS" | jq -r '.usage.busiest_hour // 0')
          QUIETEST_HOUR=$(echo "$USAGE_PATTERNS" | jq -r '.usage.quietest_hour // 0')
          DAILY_PATTERN=$(echo "$USAGE_PATTERNS" | jq -r '.usage.daily_pattern // "unknown"')

          echo "- **Busiest Hour**: ${BUSIEST_HOUR}:00" >> $GITHUB_STEP_SUMMARY
          echo "- **Quietest Hour**: ${QUIETEST_HOUR}:00" >> $GITHUB_STEP_SUMMARY
          echo "- **Daily Pattern**: $DAILY_PATTERN" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 错误分析
          echo "### 🚨 Error Analysis" >> $GITHUB_STEP_SUMMARY

          MOST_COMMON_ERROR=$(echo "$ERROR_ANALYSIS" | jq -r '.errors.most_common // "none"')
          ERROR_FREQUENCY=$(echo "$ERROR_ANALYSIS" | jq -r '.errors.frequency // 0')
          ERROR_TREND=$(echo "$ERROR_ANALYSIS" | jq -r '.errors.trend // "stable"')

          echo "- **Most Common Error**: $MOST_COMMON_ERROR" >> $GITHUB_STEP_SUMMARY
          echo "- **Error Frequency**: $ERROR_FREQUENCY occurrences" >> $GITHUB_STEP_SUMMARY
          echo "- **Error Trend**: $ERROR_TREND" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # 优化机会和应用的操作
          echo "### 🎯 Optimization Opportunities & Actions" >> $GITHUB_STEP_SUMMARY

          OPP_COUNT=$(echo "$OPTIMIZATION_OPPORTUNITIES" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$OPP_COUNT" -gt 0 ]; then
            echo "| Type | Component | Action | Impact | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-----------|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY

            for i in $(seq 0 $(($OPP_COUNT - 1))); do
              OPP=$(echo "$OPTIMIZATION_OPPORTUNITIES" | jq -r ".[$i]")
              TYPE=$(echo "$OPP" | jq -r '.type')
              COMPONENT=$(echo "$OPP" | jq -r '.component')
              ACTION=$(echo "$OPP" | jq -r '.action')
              IMPACT=$(echo "$OPP" | jq -r '.impact')

              # 格式化类型和影响
              case $TYPE in
                "performance")
                  TYPE_ICON="⚡"
                  ;;
                "reliability")
                  TYPE_ICON="🛡️"
                  ;;
                "security")
                  TYPE_ICON="🔒"
                  ;;
                "scaling")
                  TYPE_ICON="📊"
                  ;;
                "maintenance")
                  TYPE_ICON="🧹"
                  ;;
                *)
                  TYPE_ICON="⚙️"
                  ;;
              esac

              case $IMPACT in
                "high")
                  IMPACT_ICON="🔴"
                  ;;
                "medium")
                  IMPACT_ICON="🟡"
                  ;;
                "low")
                  IMPACT_ICON="🟢"
                  ;;
                *)
                  IMPACT_ICON="⚪"
                  ;;
              esac

              echo "| $TYPE_ICON $TYPE | $COMPONENT | $ACTION | $IMPACT_ICON $IMPACT | ✅ Applied |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "✅ **No optimization opportunities identified** - System performing optimally" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Continuous Optimization Loop" >> $GITHUB_STEP_SUMMARY
          echo "1. 📊 **Data Collection**: Gather performance metrics and usage patterns" >> $GITHUB_STEP_SUMMARY
          echo "2. 🧠 **Trend Analysis**: Identify performance trends and optimization opportunities" >> $GITHUB_STEP_SUMMARY
          echo "3. 🎯 **Intelligent Optimization**: Apply automated improvements" >> $GITHUB_STEP_SUMMARY
          echo "4. 📋 **Feedback Loop**: Measure impact and refine strategies" >> $GITHUB_STEP_SUMMARY
          echo "5. 🔄 **Continuous Learning**: System improves over time" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📅 Next Optimization Cycle" >> $GITHUB_STEP_SUMMARY
          echo "- **Weekly Full Optimization**: Every Monday 2:00 AM UTC" >> $GITHUB_STEP_SUMMARY
          echo "- **Daily Performance Tuning**: Hourly automatic adjustments" >> $GITHUB_STEP_SUMMARY
          echo "- **Manual Optimization**: Available via workflow dispatch" >> $GITHUB_STEP_SUMMARY

          # 成功指标
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏆 Optimization Achievements" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Automated Performance Tuning**: System self-optimizes based on real usage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Intelligent Scaling**: Resources scale automatically with demand" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Continuous Improvement**: System learns and improves over time" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Zero-Touch Operations**: Push code, get optimized deployment" >> $GITHUB_STEP_SUMMARY

      - name: Create Optimization PR (if needed)
        if: needs.data-collection.outputs.optimization_opportunities != '[]' && github.event.inputs.optimization_type == 'full'
        run: |
          # 如果有重大优化机会，创建PR来更新配置
          echo "🔄 Checking if configuration updates are needed..."

          # 这里可以检查是否需要更新配置文件，然后创建PR
          # 例如，基于分析结果更新默认配置值

          echo "✅ Configuration review complete"
