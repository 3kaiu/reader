name: Cache Cleanup

on:
  # 每天凌晨 3 点清理
  schedule:
    - cron: '0 3 * * *'
  # 手动触发
  workflow_dispatch:
  # 构建完成后清理
  workflow_run:
    workflows: ["Build Docker Images for FnOS", "Frontend Deployment (CF Pages)"]
    types: [completed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            console.log('Fetching caches...');
            
            // 获取所有缓存
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner, repo, per_page: 100 }
            );
            
            console.log(`Found ${caches.length} caches`);
            
            // 按 key 前缀分组
            const cacheGroups = {};
            for (const cache of caches) {
              // 提取基础 key (去掉 hash 部分)
              let baseKey = cache.key;
              
              // buildkit-blob 缓存按 scope 分组
              if (cache.key.startsWith('buildkit-blob-')) {
                const scopeMatch = cache.ref?.match(/refs\/heads\/(\w+)/);
                baseKey = `buildkit-${scopeMatch ? scopeMatch[1] : 'default'}`;
              } else {
                baseKey = cache.key.replace(/-[a-f0-9]{40}$/, '').replace(/#\d+$/, '');
              }
              
              if (!cacheGroups[baseKey]) {
                cacheGroups[baseKey] = [];
              }
              cacheGroups[baseKey].push(cache);
            }
            
            let deletedCount = 0;
            let freedSize = 0;
            
            for (const [baseKey, groupCaches] of Object.entries(cacheGroups)) {
              // 按最后使用时间排序
              groupCaches.sort((a, b) => 
                new Date(b.last_accessed_at) - new Date(a.last_accessed_at)
              );
              
              // buildkit 缓存只保留最新 1 个，其他保留 1 个
              const keepCount = 1;
              const toDelete = groupCaches.slice(keepCount);
              
              for (const cache of toDelete) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id
                  });
                  deletedCount++;
                  freedSize += cache.size_in_bytes;
                  console.log(`Deleted: ${cache.key} (${(cache.size_in_bytes / 1024 / 1024).toFixed(2)} MB)`);
                } catch (error) {
                  console.log(`Failed to delete ${cache.key}: ${error.message}`);
                }
              }
            }
            
            // 删除超过 3 天未使用的缓存
            const threeDaysAgo = new Date();
            threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);
            
            for (const cache of caches) {
              const lastAccessed = new Date(cache.last_accessed_at);
              if (lastAccessed < threeDaysAgo) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner,
                    repo,
                    cache_id: cache.id
                  });
                  deletedCount++;
                  freedSize += cache.size_in_bytes;
                  console.log(`Deleted old cache: ${cache.key}`);
                } catch (error) {
                  // 可能已经被删除
                }
              }
            }
            
            console.log(`\n✅ Cleanup complete!`);
            console.log(`Deleted ${deletedCount} caches`);
            console.log(`Freed ${(freedSize / 1024 / 1024).toFixed(2)} MB`);
