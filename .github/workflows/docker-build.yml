name: Build and Push Docker Images

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build main reader image (Rust backend + Vue frontend)
  # ─────────────────────────────────────────────────────────────
  build-reader:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (reader)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/nexus-lite
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push reader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # Build cf-bypass image (Python Cloudflare bypass service)
  # ─────────────────────────────────────────────────────────────
  build-cf-bypass:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (cf-bypass)
        id: meta-cf
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/cf-bypass-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push cf-bypass image
        uses: docker/build-push-action@v5
        with:
          context: ./cf-bypass-service
          file: cf-bypass-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-cf.outputs.tags }}
          labels: ${{ steps.meta-cf.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
