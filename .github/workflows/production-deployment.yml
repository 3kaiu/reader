name: Frontend Deployment (CF Pages)

on:
  push:
    branches: [main]
    paths:
      - 'nexus-reader/**'
      - 'cloudflare-workers/**'
      - 'wrangler.toml'
      - '.github/workflows/production-deployment.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: cf-deployment
  cancel-in-progress: true

jobs:
  # 检测变更
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'nexus-reader/**'
            worker:
              - 'cloudflare-workers/**'
              - 'wrangler.toml'

  # 获取 Workers subdomain（前端和 worker 都需要）
  get-subdomain:
    runs-on: ubuntu-latest
    outputs:
      subdomain: ${{ steps.subdomain.outputs.subdomain }}
    steps:
      - name: Get Workers subdomain
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')
          
          if [ -z "$SUBDOMAIN" ]; then
            echo "❌ Failed to get workers subdomain"
            exit 1
          fi
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "✅ Workers subdomain: $SUBDOMAIN"

  # 部署 Workers（先于前端）
  deploy-worker:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain]
    if: needs.detect-changes.outputs.worker == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create KV namespace if not exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 通过 API 列出所有 KV namespaces
          KV_LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          # 查找已存在的 nexus-progress-sync-PROGRESS_KV
          KV_ID=$(echo "$KV_LIST" | jq -r '.result[] | select(.title | contains("nexus-progress")) | .id' | head -1)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"nexus-progress-sync-PROGRESS_KV"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')
            echo "Created KV namespace: $KV_ID"
          else
            echo "KV namespace already exists: $KV_ID"
          fi
          
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Deploy Progress Sync Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s/\${KV_PROGRESS_ID}/$KV_ID/g" wrangler.toml
          cat wrangler.toml  # Debug: show the file
          wrangler deploy
          echo "✅ Progress Sync Worker deployed"

      - name: Deploy Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          AUTH_WORKER_URL="https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev"
          
          # 如果没有设置 AUTH_SECRET，生成一个随机的
          if [ -z "$AUTH_SECRET" ]; then
            AUTH_SECRET=$(openssl rand -hex 32)
            echo "⚠️ AUTH_SECRET not set, using generated value (will change on each deploy)"
          fi
          
          wrangler deploy --env auth \
            --var GITHUB_CLIENT_ID:${{ secrets.OAUTH_GITHUB_CLIENT_ID }} \
            --var GITHUB_CLIENT_SECRET:${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }} \
            --var GITHUB_OWNER:${{ github.repository_owner }} \
            --var CF_CLIENT_ID:${{ secrets.CF_CLIENT_ID }} \
            --var CF_CLIENT_SECRET:${{ secrets.CF_CLIENT_SECRET }} \
            --var CF_OWNER_EMAIL:${{ secrets.CF_OWNER_EMAIL }} \
            --var AUTH_SECRET:${AUTH_SECRET} \
            --var FRONTEND_URL:https://nexus-reader.pages.dev \
            --var WORKER_URL:${AUTH_WORKER_URL}
          echo "✅ Auth Worker deployed at ${AUTH_WORKER_URL}"

  # 部署前端到 CF Pages
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            nexus-reader/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('nexus-reader/bun.lock') }}

      - name: Install & Build
        working-directory: nexus-reader
        env:
          VITE_PROGRESS_SYNC_URL: https://nexus-progress-sync.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_AUTH_WORKER_URL: https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
        run: |
          bun install
          bun run build

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy nexus-reader/dist --project-name nexus-reader --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup old deployments (keep latest 3)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.result[3:][].id')
          
          for DEPLOY_ID in $DEPLOYMENTS; do
            echo "Deleting old deployment: $DEPLOY_ID"
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json"
          done
          echo "✅ Cleanup completed"

  # 跳过部署
  skip:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend != 'true' && needs.detect-changes.outputs.worker != 'true' && github.event.inputs.force_deploy != 'true'
    steps:
      - run: echo "⏭️ No frontend/worker changes, skipping CF deployment"