name: Production Deployment (CF + HuggingFace)

on:
  push:
    branches: [main]
    paths:
      - 'nexus-reader/**'
      - 'nexus-lite/**'
      - 'cloudflare-workers/**'
      - 'cf-bypass-service/**'
      - 'wrangler.toml'
      - '.github/workflows/production-deployment.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  # HuggingFace Space 名称 (自动拼接用户名)
  CF_BYPASS_SPACE_NAME: cf-bypass-service
  NEXUS_LITE_SPACE_NAME: nexus-lite

jobs:
  # =============================================================================
  # 检测变更
  # =============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
      cf-bypass: ${{ steps.filter.outputs.cf-bypass }}
      nexus-lite: ${{ steps.filter.outputs.nexus-lite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'nexus-reader/**'
            worker:
              - 'cloudflare-workers/**'
              - 'wrangler.toml'
            cf-bypass:
              - 'cf-bypass-service/**'
            nexus-lite:
              - 'nexus-lite/**'

  # =============================================================================
  # 获取 HuggingFace 用户名
  # =============================================================================
  get-hf-username:
    runs-on: ubuntu-latest
    outputs:
      username: ${{ steps.whoami.outputs.username }}
      cf_bypass_space: ${{ steps.whoami.outputs.cf_bypass_space }}
      nexus_lite_space: ${{ steps.whoami.outputs.nexus_lite_space }}
      cf_bypass_url: ${{ steps.whoami.outputs.cf_bypass_url }}
      nexus_lite_url: ${{ steps.whoami.outputs.nexus_lite_url }}
    steps:
      - name: Get HuggingFace username
        id: whoami
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 获取 HuggingFace 用户名
          RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          USERNAME=$(echo "$RESPONSE" | jq -r '.name // empty')
          
          if [ -z "$USERNAME" ]; then
            echo "❌ Failed to get HuggingFace username"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "cf_bypass_space=${USERNAME}/${{ env.CF_BYPASS_SPACE_NAME }}" >> $GITHUB_OUTPUT
          echo "nexus_lite_space=${USERNAME}/${{ env.NEXUS_LITE_SPACE_NAME }}" >> $GITHUB_OUTPUT
          echo "cf_bypass_url=https://${USERNAME}-${{ env.CF_BYPASS_SPACE_NAME }}.hf.space" >> $GITHUB_OUTPUT
          echo "nexus_lite_url=https://${USERNAME}-${{ env.NEXUS_LITE_SPACE_NAME }}.hf.space" >> $GITHUB_OUTPUT
          
          echo "✅ HuggingFace username: $USERNAME"
          echo "   cf-bypass space: ${USERNAME}/${{ env.CF_BYPASS_SPACE_NAME }}"
          echo "   nexus-lite space: ${USERNAME}/${{ env.NEXUS_LITE_SPACE_NAME }}"

  # =============================================================================
  # 获取 Workers subdomain
  # =============================================================================
  get-subdomain:
    runs-on: ubuntu-latest
    outputs:
      subdomain: ${{ steps.subdomain.outputs.subdomain }}
    steps:
      - name: Get Workers subdomain
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')
          
          if [ -z "$SUBDOMAIN" ]; then
            echo "❌ Failed to get workers subdomain"
            exit 1
          fi
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "✅ Workers subdomain: $SUBDOMAIN"

  # =============================================================================
  # 部署 cf-bypass-service 到 HuggingFace Spaces
  # =============================================================================
  deploy-cf-bypass:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-hf-username]
    if: needs.detect-changes.outputs.cf-bypass == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create Space if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.cf_bypass_space }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import HfApi, create_repo, repo_exists
          
          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]
          
          if not repo_exists(space_id, repo_type="space", token=token):
              print(f"🔨 Creating HuggingFace Space: {space_id}")
              create_repo(
                  repo_id=space_id,
                  repo_type="space",
                  space_sdk="docker",
                  private=False,
                  token=token
              )
              print(f"✅ Space created")
          else:
              print(f"✅ Space already exists: {space_id}")
          EOF

      - name: Check if deployment needed
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.cf_bypass_space }}
        run: |
          # 计算本地文件的 hash (包含 README.md)
          LOCAL_HASH=$(find cf-bypass-service -type f \( -name "*.py" -o -name "*.json" -o -name "Dockerfile" -o -name "*.toml" -o -name "README.md" \) | sort | xargs cat | sha256sum | cut -d' ' -f1)
          echo "Local hash: $LOCAL_HASH"
          
          # 尝试获取远程的 hash (存储在 .deploy-hash 文件中)
          REMOTE_HASH=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/spaces/${HF_SPACE}/raw/main/.deploy-hash" 2>/dev/null || echo "")
          echo "Remote hash: $REMOTE_HASH"
          
          if [ "$LOCAL_HASH" = "$REMOTE_HASH" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ No changes detected, skipping deployment"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "hash=$LOCAL_HASH" >> $GITHUB_OUTPUT
            echo "📦 Changes detected, will deploy"
          fi

      - name: Push to HuggingFace Space
        if: steps.check.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.cf_bypass_space }}
          DEPLOY_HASH: ${{ steps.check.outputs.hash }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE} hf-space || {
            mkdir -p hf-space
            cd hf-space
            git init
            git remote add origin https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
            cd ..
          }
          
          rm -rf hf-space/* 2>/dev/null || true
          cp -r cf-bypass-service/* hf-space/
          
          # 写入部署 hash 用于下次比较
          echo "$DEPLOY_HASH" > hf-space/.deploy-hash
          
          cd hf-space
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push -u origin main || git push -u origin master
          
          echo "✅ Deployed to: ${{ needs.get-hf-username.outputs.cf_bypass_url }}"

  # =============================================================================
  # 部署 nexus-lite 到 HuggingFace Spaces
  # =============================================================================
  deploy-nexus-lite:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-hf-username]
    if: needs.detect-changes.outputs.nexus-lite == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create Space if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.nexus_lite_space }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import HfApi, create_repo, repo_exists
          
          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]
          
          if not repo_exists(space_id, repo_type="space", token=token):
              print(f"🔨 Creating HuggingFace Space: {space_id}")
              create_repo(
                  repo_id=space_id,
                  repo_type="space",
                  space_sdk="docker",
                  private=False,
                  token=token
              )
              print(f"✅ Space created")
          else:
              print(f"✅ Space already exists: {space_id}")
          EOF

      - name: Check if deployment needed
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.nexus_lite_space }}
        run: |
          # 计算本地文件的 hash (排除 target 目录，包含 README.md)
          LOCAL_HASH=$(find nexus-lite -type f \( -name "*.rs" -o -name "*.toml" -o -name "*.json" -o -name "*.nxs" -o -name "Dockerfile" -o -name "README.md" \) ! -path "*/target/*" | sort | xargs cat | sha256sum | cut -d' ' -f1)
          echo "Local hash: $LOCAL_HASH"
          
          REMOTE_HASH=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" \
            "https://huggingface.co/spaces/${HF_SPACE}/raw/main/.deploy-hash" 2>/dev/null || echo "")
          echo "Remote hash: $REMOTE_HASH"
          
          if [ "$LOCAL_HASH" = "$REMOTE_HASH" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ No changes detected, skipping deployment"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "hash=$LOCAL_HASH" >> $GITHUB_OUTPUT
            echo "📦 Changes detected, will deploy"
          fi

      - name: Push to HuggingFace Space
        if: steps.check.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.nexus_lite_space }}
          CF_BYPASS_URL: ${{ needs.get-hf-username.outputs.cf_bypass_url }}
          DEPLOY_HASH: ${{ steps.check.outputs.hash }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE} hf-nexus || {
            mkdir -p hf-nexus
            cd hf-nexus
            git init
            git remote add origin https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
            cd ..
          }
          
          rm -rf hf-nexus/* 2>/dev/null || true
          
          # 复制 nexus-lite 源码 (排除 target 和 cache)
          cp nexus-lite/Dockerfile hf-nexus/
          cp nexus-lite/README.md hf-nexus/
          cp nexus-lite/Cargo.toml nexus-lite/Cargo.lock hf-nexus/
          cp -r nexus-lite/nexus-core hf-nexus/
          cp -r nexus-lite/nexus-engine hf-nexus/
          cp -r nexus-lite/nexus-storage hf-nexus/
          cp -r nexus-lite/nexus-server hf-nexus/
          cp -r nexus-lite/sources hf-nexus/
          
          # 创建配置文件
          cat > hf-nexus/config.json << EOFCONFIG
          {
            "server": {
              "host": "0.0.0.0",
              "port": 7860,
              "enableCors": true,
              "allowedOrigins": []
            },
            "storage": {
              "sourcesDir": "./sources"
            },
            "cfBypass": {
              "serviceUrl": "${CF_BYPASS_URL}",
              "enabled": true,
              "timeoutSeconds": 60
            }
          }
          EOFCONFIG
          
          # 写入部署 hash
          echo "$DEPLOY_HASH" > hf-nexus/.deploy-hash
          
          cd hf-nexus
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push -u origin main || git push -u origin master
          
          echo "✅ Deployed to: ${{ needs.get-hf-username.outputs.nexus_lite_url }}"

  # =============================================================================
  # 部署 CF Workers
  # =============================================================================
  deploy-worker:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain, get-hf-username]
    if: needs.detect-changes.outputs.worker == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create KV namespace if not exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          KV_ID=$(echo "$KV_LIST" | jq -r '.result[] | select(.title | contains("nexus-progress")) | .id' | head -1)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"nexus-progress-sync-PROGRESS_KV"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')
          fi
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Create Content Cache KV namespace if not exists
        id: content_cache_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          KV_ID=$(echo "$KV_LIST" | jq -r '.result[] | select(.title | contains("nexus-content-cache")) | .id' | head -1)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating Content Cache KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"nexus-content-cache-CONTENT_CACHE_KV"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')
          fi
          echo "content_cache_kv_id=$KV_ID" >> $GITHUB_OUTPUT
          echo "✅ Content Cache KV namespace ID: $KV_ID"

      - name: Create Decoder KV namespace if not exists
        id: decoder_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          KV_ID=$(echo "$KV_LIST" | jq -r '.result[] | select(.title | contains("nexus-decoder")) | .id' | head -1)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating Decoder KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"nexus-decoder-DECODER_KV"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')
          fi
          echo "decoder_kv_id=$KV_ID" >> $GITHUB_OUTPUT
          echo "✅ Decoder KV namespace ID: $KV_ID"

      - name: Deploy Progress Sync Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s/\${KV_PROGRESS_ID}/$KV_ID/g" wrangler.toml
          wrangler deploy --var AUTH_SECRET:${{ secrets.AUTH_SECRET }}
          echo "✅ Progress Sync Worker deployed (with auth)"

      - name: Deploy Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          AUTH_WORKER_URL="https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev"
          
          if [ -z "$AUTH_SECRET" ]; then
            AUTH_SECRET=$(openssl rand -hex 32)
          fi
          
          wrangler deploy --env auth \
            --var GITHUB_CLIENT_ID:${{ secrets.OAUTH_GITHUB_CLIENT_ID }} \
            --var GITHUB_CLIENT_SECRET:${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }} \
            --var GITHUB_OWNER:${{ github.repository_owner }} \
            --var CF_CLIENT_ID:${{ secrets.CF_CLIENT_ID }} \
            --var CF_CLIENT_SECRET:${{ secrets.CF_CLIENT_SECRET }} \
            --var CF_OWNER_EMAIL:${{ secrets.CF_OWNER_EMAIL }} \
            --var AUTH_SECRET:${AUTH_SECRET} \
            --var FRONTEND_URL:https://nexus-reader.pages.dev \
            --var WORKER_URL:${AUTH_WORKER_URL}
          echo "✅ Auth Worker deployed"

      - name: Deploy Proxy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CONTENT_CACHE_KV_ID="${{ steps.content_cache_kv.outputs.content_cache_kv_id }}"
          sed -i "s/\${KV_CONTENT_CACHE_ID}/$CONTENT_CACHE_KV_ID/g" wrangler.toml
          wrangler deploy --env proxy \
            --var NEXUS_LITE_URL:${{ needs.get-hf-username.outputs.nexus_lite_url }} \
            --var CF_BYPASS_URL:${{ needs.get-hf-username.outputs.cf_bypass_url }} \
            --var AUTH_SECRET:${{ secrets.AUTH_SECRET }}
          echo "✅ Proxy Worker deployed (with KV cache + auth)"

      - name: Deploy Decoder Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DECODER_KV_ID="${{ steps.decoder_kv.outputs.decoder_kv_id }}"
          sed -i "s/\${KV_DECODER_ID}/$DECODER_KV_ID/g" wrangler.toml
          wrangler deploy --env decoder \
            --var AUTH_SECRET:${{ secrets.AUTH_SECRET }} \
            --var GROQ_API_KEY:${{ secrets.GROQ_API_KEY }} \
            --var HF_API_KEY:${{ secrets.HF_TOKEN }}
          echo "✅ Decoder Worker deployed (with AI + KV)"

      - name: Initialize Decoder KV Data (if empty)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DECODER_KV_ID="${{ steps.decoder_kv.outputs.decoder_kv_id }}"
          
          # 检查是否已有数据 (通过检查 global 词典)
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DECODER_KV_ID}/values/decoder:dict:global" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" 2>/dev/null || echo "")
          
          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ] || [ "$EXISTING" = "" ]; then
            echo "📦 Initializing decoder KV data..."
            
            # 上传公共词典
            if [ -f "cloudflare-workers/decoder-data/dictionaries/global.json" ]; then
              curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DECODER_KV_ID}/values/decoder:dict:global" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @cloudflare-workers/decoder-data/dictionaries/global.json
              echo "  ✅ Global dictionary uploaded"
            fi
            
            # 上传知识图谱 - 人物
            if [ -f "cloudflare-workers/decoder-data/knowledge/persons.json" ]; then
              curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DECODER_KV_ID}/values/decoder:knowledge:persons" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @cloudflare-workers/decoder-data/knowledge/persons.json
              echo "  ✅ Persons knowledge graph uploaded"
            fi
            
            # 上传知识图谱 - 公司
            if [ -f "cloudflare-workers/decoder-data/knowledge/companies.json" ]; then
              curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DECODER_KV_ID}/values/decoder:knowledge:companies" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @cloudflare-workers/decoder-data/knowledge/companies.json
              echo "  ✅ Companies knowledge graph uploaded"
            fi
            
            # 上传知识图谱 - 事件
            if [ -f "cloudflare-workers/decoder-data/knowledge/events.json" ]; then
              curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${DECODER_KV_ID}/values/decoder:knowledge:events" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data-binary @cloudflare-workers/decoder-data/knowledge/events.json
              echo "  ✅ Events knowledge graph uploaded"
            fi
            
            echo "✅ Decoder KV data initialized"
          else
            echo "✅ Decoder KV data already exists, skipping initialization"
          fi

  # =============================================================================
  # 部署前端到 CF Pages
  # =============================================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain, get-hf-username]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            nexus-reader/node_modules
          key: bun-${{ hashFiles('nexus-reader/bun.lock') }}

      - name: Install & Build
        working-directory: nexus-reader
        env:
          VITE_API_URL: https://nexus-proxy.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_PROGRESS_SYNC_URL: https://nexus-progress-sync.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_AUTH_WORKER_URL: https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_DECODER_URL: https://nexus-decoder.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
        run: |
          bun install
          bun run build

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy nexus-reader/dist --project-name nexus-reader --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup old deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[3:][].id')
          
          for DEPLOY_ID in $DEPLOYMENTS; do
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          done
          echo "✅ Old deployments cleaned up"

  # =============================================================================
  # 部署摘要
  # =============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-hf-username, deploy-cf-bypass, deploy-nexus-lite, deploy-worker, deploy-frontend]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Architecture" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "CF Pages (Frontend) → CF Worker (Proxy) → HuggingFace (nexus-lite) → HuggingFace (cf-bypass)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| CF Pages (Frontend) | ${{ needs.deploy-frontend.result || 'skipped' }} | https://nexus-reader.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| CF Workers | ${{ needs.deploy-worker.result || 'skipped' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| HF cf-bypass | ${{ needs.deploy-cf-bypass.result || 'skipped' }} | ${{ needs.get-hf-username.outputs.cf_bypass_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HF nexus-lite | ${{ needs.deploy-nexus-lite.result || 'skipped' }} | ${{ needs.get-hf-username.outputs.nexus_lite_url }} |" >> $GITHUB_STEP_SUMMARY
