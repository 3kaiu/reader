name: Production Deployment (CF + HuggingFace)

on:
  push:
    branches: [main]
    paths:
      - 'nexus-reader/**'
      - 'nexus-lite/**'
      - 'cloudflare-workers/**'
      - 'cf-bypass-service/**'
      - 'wrangler.toml'
      - '.github/workflows/production-deployment.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: write
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

env:
  CF_BYPASS_SPACE_NAME: cf-bypass-service
  NEXUS_LITE_SPACE_NAME: nexus-lite
  REGISTRY: ghcr.io

jobs:
  # =============================================================================
  # 检测变更
  # =============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
      cf-bypass: ${{ steps.filter.outputs.cf-bypass }}
      nexus-lite: ${{ steps.filter.outputs.nexus-lite }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'nexus-reader/**'
            worker:
              - 'cloudflare-workers/**'
              - 'wrangler.toml'
            cf-bypass:
              - 'cf-bypass-service/**'
            nexus-lite:
              - 'nexus-lite/**'

  # =============================================================================
  # 获取 HuggingFace 用户名
  # =============================================================================
  get-hf-username:
    runs-on: ubuntu-latest
    outputs:
      username: ${{ steps.whoami.outputs.username }}
      cf_bypass_space: ${{ steps.whoami.outputs.cf_bypass_space }}
      nexus_lite_space: ${{ steps.whoami.outputs.nexus_lite_space }}
      cf_bypass_url: ${{ steps.whoami.outputs.cf_bypass_url }}
      nexus_lite_url: ${{ steps.whoami.outputs.nexus_lite_url }}
    steps:
      - name: Get HuggingFace username
        id: whoami
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          USERNAME=$(echo "$RESPONSE" | jq -r '.name // empty')
          if [ -z "$USERNAME" ]; then
            echo "❌ Failed to get HuggingFace username"
            exit 1
          fi
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "cf_bypass_space=${USERNAME}/${{ env.CF_BYPASS_SPACE_NAME }}" >> $GITHUB_OUTPUT
          echo "nexus_lite_space=${USERNAME}/${{ env.NEXUS_LITE_SPACE_NAME }}" >> $GITHUB_OUTPUT
          echo "cf_bypass_url=https://${USERNAME}-${{ env.CF_BYPASS_SPACE_NAME }}.hf.space" >> $GITHUB_OUTPUT
          echo "nexus_lite_url=https://${USERNAME}-${{ env.NEXUS_LITE_SPACE_NAME }}.hf.space" >> $GITHUB_OUTPUT
          echo "✅ HuggingFace username: $USERNAME"

  # =============================================================================
  # 获取 Workers subdomain
  # =============================================================================
  get-subdomain:
    runs-on: ubuntu-latest
    outputs:
      subdomain: ${{ steps.subdomain.outputs.subdomain }}
    steps:
      - name: Get Workers subdomain
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')
          if [ -z "$SUBDOMAIN" ]; then
            echo "❌ Failed to get workers subdomain"
            exit 1
          fi
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "✅ Workers subdomain: $SUBDOMAIN"

  # =============================================================================
  # 构建并推送 cf-bypass-service 镜像到 GHCR
  # =============================================================================
  build-cf-bypass:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.cf-bypass == 'true' || github.event.inputs.force_deploy == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/cf-bypass-service
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./cf-bypass-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: reader/cf-bypass-service
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
        continue-on-error: true

  # =============================================================================
  # 构建并推送 nexus-lite 镜像到 GHCR
  # =============================================================================
  build-nexus-lite:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.nexus-lite == 'true' || github.event.inputs.force_deploy == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/nexus-lite
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./nexus-lite
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup old GHCR images
        uses: actions/delete-package-versions@v5
        with:
          package-name: reader/nexus-lite
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
        continue-on-error: true

  # =============================================================================
  # 部署 cf-bypass-service 到 HuggingFace (拉取 GHCR 镜像)
  # =============================================================================
  deploy-cf-bypass:
    runs-on: ubuntu-latest
    needs: [build-cf-bypass, get-hf-username]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create Space if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.cf_bypass_space }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import create_repo, repo_exists
          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]
          if not repo_exists(space_id, repo_type="space", token=token):
              print(f"🔨 Creating HuggingFace Space: {space_id}")
              create_repo(repo_id=space_id, repo_type="space", space_sdk="docker", private=False, token=token)
          else:
              print(f"✅ Space already exists: {space_id}")
          EOF

      - name: Push minimal Dockerfile to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.cf_bypass_space }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/cf-bypass-service:latest
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE} hf-space || {
            mkdir -p hf-space && cd hf-space && git init
            git remote add origin https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
            cd ..
          }
          
          rm -rf hf-space/* 2>/dev/null || true
          
          # 创建 README.md (HF Space 配置)
          cat > hf-space/README.md << 'EOFREADME'
          ---
          title: CF Bypass Service
          emoji: 🔓
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_file: Dockerfile
          pinned: false
          ---
          EOFREADME
          
          # 创建 Dockerfile，使用 ARG 传递认证信息
          IMAGE_LOWER=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          cat > hf-space/Dockerfile << EOFDOCKER
          FROM ${IMAGE_LOWER}
          EOFDOCKER
          
          cd hf-space
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push -u origin main || git push -u origin master
          echo "✅ Deployed to: ${{ needs.get-hf-username.outputs.cf_bypass_url }}"

  # =============================================================================
  # 部署 nexus-lite 到 HuggingFace (拉取 GHCR 镜像)
  # =============================================================================
  deploy-nexus-lite:
    runs-on: ubuntu-latest
    needs: [build-nexus-lite, get-hf-username]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create Space if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.nexus_lite_space }}
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import create_repo, repo_exists
          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]
          if not repo_exists(space_id, repo_type="space", token=token):
              print(f"🔨 Creating HuggingFace Space: {space_id}")
              create_repo(repo_id=space_id, repo_type="space", space_sdk="docker", private=False, token=token)
          else:
              print(f"✅ Space already exists: {space_id}")
          EOF

      - name: Push minimal Dockerfile to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ needs.get-hf-username.outputs.nexus_lite_space }}
          CF_BYPASS_URL: ${{ needs.get-hf-username.outputs.cf_bypass_url }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/nexus-lite:latest
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE} hf-nexus || {
            mkdir -p hf-nexus && cd hf-nexus && git init
            git remote add origin https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
            cd ..
          }
          
          rm -rf hf-nexus/* 2>/dev/null || true
          
          # 创建 README.md
          cat > hf-nexus/README.md << 'EOFREADME'
          ---
          title: Nexus Lite
          emoji: 📚
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_file: Dockerfile
          pinned: false
          ---
          EOFREADME
          
          # 创建 Dockerfile，拉取 GHCR 镜像并注入配置
          IMAGE_LOWER=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          cat > hf-nexus/Dockerfile << EOFDOCKER
          FROM ${IMAGE_LOWER}
          
          # 注入运行时配置
          RUN echo '{"server":{"host":"0.0.0.0","port":7860,"enableCors":true,"allowedOrigins":[]},"storage":{"sourcesDir":"./sources"},"cfBypass":{"serviceUrl":"${CF_BYPASS_URL}","enabled":true,"timeoutSeconds":60}}' > /app/config.json
          EOFDOCKER
          
          cd hf-nexus
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push -u origin main || git push -u origin master
          echo "✅ Deployed to: ${{ needs.get-hf-username.outputs.nexus_lite_url }}"

  # =============================================================================
  # 部署 CF Workers
  # =============================================================================
  deploy-worker:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain, get-hf-username]
    if: needs.detect-changes.outputs.worker == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create KV namespaces
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          create_kv() {
            local NAME=$1
            local VAR_NAME=$2
            KV_LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            KV_ID=$(echo "$KV_LIST" | jq -r ".result[] | select(.title | contains(\"$NAME\")) | .id" | head -1)
            if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
              CREATE_RESULT=$(curl -s -X POST \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "{\"title\":\"$NAME\"}")
              KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')
            fi
            echo "${VAR_NAME}=$KV_ID" >> $GITHUB_OUTPUT
          }
          create_kv "nexus-progress" "kv_id"
          create_kv "nexus-content-cache" "content_cache_kv_id"
          create_kv "nexus-decoder" "decoder_kv_id"

      - name: Deploy Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Update KV IDs in wrangler.toml
          sed -i "s/\${KV_PROGRESS_ID}/${{ steps.kv.outputs.kv_id }}/g" wrangler.toml
          sed -i "s/\${KV_CONTENT_CACHE_ID}/${{ steps.kv.outputs.content_cache_kv_id }}/g" wrangler.toml
          sed -i "s/\${KV_DECODER_ID}/${{ steps.kv.outputs.decoder_kv_id }}/g" wrangler.toml
          
          # Deploy Progress Sync Worker
          wrangler deploy --var AUTH_SECRET:${{ secrets.AUTH_SECRET }}
          
          # Deploy Auth Worker
          wrangler deploy --env auth \
            --var GITHUB_CLIENT_ID:${{ secrets.OAUTH_GITHUB_CLIENT_ID }} \
            --var GITHUB_CLIENT_SECRET:${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }} \
            --var GITHUB_OWNER:${{ github.repository_owner }} \
            --var CF_CLIENT_ID:${{ secrets.CF_CLIENT_ID }} \
            --var CF_CLIENT_SECRET:${{ secrets.CF_CLIENT_SECRET }} \
            --var CF_OWNER_EMAIL:${{ secrets.CF_OWNER_EMAIL }} \
            --var AUTH_SECRET:${{ secrets.AUTH_SECRET }} \
            --var FRONTEND_URL:https://nexus-reader.pages.dev \
            --var WORKER_URL:https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          
          # Deploy Proxy Worker
          wrangler deploy --env proxy \
            --var NEXUS_LITE_URL:${{ needs.get-hf-username.outputs.nexus_lite_url }} \
            --var CF_BYPASS_URL:${{ needs.get-hf-username.outputs.cf_bypass_url }} \
            --var AUTH_SECRET:${{ secrets.AUTH_SECRET }}
          
          # Deploy Decoder Worker
          wrangler deploy --env decoder \
            --var AUTH_SECRET:${{ secrets.AUTH_SECRET }} \
            --var GROQ_API_KEY:${{ secrets.GROQ_API_KEY }} \
            --var HF_API_KEY:${{ secrets.HF_TOKEN }}
          
          echo "✅ All Workers deployed"

  # =============================================================================
  # 部署前端到 CF Pages
  # =============================================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            nexus-reader/node_modules
          key: bun-${{ hashFiles('nexus-reader/bun.lock') }}

      - name: Verify subdomain
        run: |
          if [ -z "${{ needs.get-subdomain.outputs.subdomain }}" ]; then
            echo "❌ ERROR: Workers subdomain is empty!"
            exit 1
          fi
          echo "✅ Subdomain verified"

      - name: Install & Build
        working-directory: nexus-reader
        env:
          VITE_API_URL: https://nexus-proxy.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_PROGRESS_SYNC_URL: https://nexus-progress-sync.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_AUTH_WORKER_URL: https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_DECODER_URL: https://nexus-decoder.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
        run: |
          bun install
          bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy nexus-reader/dist --project-name nexus-reader --commit-dirty=true --commit-message="Deploy from GitHub Actions"

      - name: Cleanup old deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[3:][].id')
          for DEPLOY_ID in $DEPLOYMENTS; do
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          done
          echo "✅ Old deployments cleaned up"

  # =============================================================================
  # 部署摘要
  # =============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-hf-username, build-cf-bypass, build-nexus-lite, deploy-cf-bypass, deploy-nexus-lite, deploy-worker, deploy-frontend]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Architecture" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "GitHub Actions (Build) → GHCR (Images) → HuggingFace (Pull & Run)" >> $GITHUB_STEP_SUMMARY
          echo "CF Pages (Frontend) → CF Worker (Proxy) → HuggingFace (nexus-lite)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| cf-bypass-service | ${{ needs.build-cf-bypass.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| nexus-lite | ${{ needs.build-nexus-lite.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| CF Pages | ${{ needs.deploy-frontend.result || 'skipped' }} | https://nexus-reader.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| CF Workers | ${{ needs.deploy-worker.result || 'skipped' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| HF cf-bypass | ${{ needs.deploy-cf-bypass.result || 'skipped' }} | ${{ needs.get-hf-username.outputs.cf_bypass_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HF nexus-lite | ${{ needs.deploy-nexus-lite.result || 'skipped' }} | ${{ needs.get-hf-username.outputs.nexus_lite_url }} |" >> $GITHUB_STEP_SUMMARY
