name: Production Deployment (CF + HuggingFace)

on:
  push:
    branches: [main]
    paths:
      - 'nexus-reader/**'
      - 'cloudflare-workers/**'
      - 'cf-bypass-service/**'
      - 'wrangler.toml'
      - '.github/workflows/production-deployment.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no changes'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  # =============================================================================
  # 检测变更
  # =============================================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      worker: ${{ steps.filter.outputs.worker }}
      cf-bypass: ${{ steps.filter.outputs.cf-bypass }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'nexus-reader/**'
            worker:
              - 'cloudflare-workers/**'
              - 'wrangler.toml'
            cf-bypass:
              - 'cf-bypass-service/**'

  # =============================================================================
  # 获取 Workers subdomain
  # =============================================================================
  get-subdomain:
    runs-on: ubuntu-latest
    outputs:
      subdomain: ${{ steps.subdomain.outputs.subdomain }}
    steps:
      - name: Get Workers subdomain
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')
          
          if [ -z "$SUBDOMAIN" ]; then
            echo "❌ Failed to get workers subdomain"
            exit 1
          fi
          echo "subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT
          echo "✅ Workers subdomain: $SUBDOMAIN"

  # =============================================================================
  # 部署 CF Workers
  # =============================================================================
  deploy-worker:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain]
    if: needs.detect-changes.outputs.worker == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create KV namespace if not exists
        id: kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_LIST=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          
          KV_ID=$(echo "$KV_LIST" | jq -r '.result[] | select(.title | contains("nexus-progress")) | .id' | head -1)
          
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating KV namespace..."
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"title":"nexus-progress-sync-PROGRESS_KV"}')
            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')
          fi
          echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT

      - name: Deploy Progress Sync Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          sed -i "s/\${KV_PROGRESS_ID}/$KV_ID/g" wrangler.toml
          wrangler deploy
          echo "✅ Progress Sync Worker deployed"

      - name: Deploy Auth Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          AUTH_WORKER_URL="https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev"
          
          if [ -z "$AUTH_SECRET" ]; then
            AUTH_SECRET=$(openssl rand -hex 32)
          fi
          
          wrangler deploy --env auth \
            --var GITHUB_CLIENT_ID:${{ secrets.OAUTH_GITHUB_CLIENT_ID }} \
            --var GITHUB_CLIENT_SECRET:${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }} \
            --var GITHUB_OWNER:${{ github.repository_owner }} \
            --var CF_CLIENT_ID:${{ secrets.CF_CLIENT_ID }} \
            --var CF_CLIENT_SECRET:${{ secrets.CF_CLIENT_SECRET }} \
            --var CF_OWNER_EMAIL:${{ secrets.CF_OWNER_EMAIL }} \
            --var AUTH_SECRET:${AUTH_SECRET} \
            --var FRONTEND_URL:https://nexus-reader.pages.dev \
            --var WORKER_URL:${AUTH_WORKER_URL}
          echo "✅ Auth Worker deployed"

  # =============================================================================
  # 部署前端到 CF Pages
  # =============================================================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [detect-changes, get-subdomain]
    if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            nexus-reader/node_modules
          key: bun-${{ hashFiles('nexus-reader/bun.lock') }}

      - name: Install & Build
        working-directory: nexus-reader
        env:
          VITE_PROGRESS_SYNC_URL: https://nexus-progress-sync.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
          VITE_AUTH_WORKER_URL: https://nexus-auth.${{ needs.get-subdomain.outputs.subdomain }}.workers.dev
        run: |
          bun install
          bun run build

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy nexus-reader/dist --project-name nexus-reader --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup old deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DEPLOYMENTS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result[3:][].id')
          
          for DEPLOY_ID in $DEPLOYMENTS; do
            curl -s -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/nexus-reader/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          done
          echo "✅ Old deployments cleaned up"

  # =============================================================================
  # 部署 cf-bypass-service 到 HuggingFace Spaces
  # =============================================================================
  deploy-huggingface:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cf-bypass == 'true' || github.event.inputs.force_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create Space if not exists
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}  # 格式: username/space-name
        run: |
          python << 'EOF'
          import os
          from huggingface_hub import HfApi, create_repo, repo_exists
          
          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]
          
          api = HfApi(token=token)
          
          # 检查 Space 是否存在
          if not repo_exists(space_id, repo_type="space", token=token):
              print(f"🔨 Creating HuggingFace Space: {space_id}")
              create_repo(
                  repo_id=space_id,
                  repo_type="space",
                  space_sdk="docker",
                  private=False,
                  token=token
              )
              print(f"✅ Space created: https://huggingface.co/spaces/{space_id}")
          else:
              print(f"✅ Space already exists: {space_id}")
          EOF

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          # 配置 git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # 克隆 HuggingFace Space 仓库
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE} hf-space || {
            # 如果克隆失败（新建的空仓库），初始化一个
            mkdir -p hf-space
            cd hf-space
            git init
            git remote add origin https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}
            cd ..
          }
          
          # 复制 cf-bypass-service 文件到 HuggingFace Space
          rm -rf hf-space/* 2>/dev/null || true
          cp -r cf-bypass-service/* hf-space/
          
          # 提交并推送
          cd hf-space
          git add -A
          git diff --staged --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push -u origin main || git push -u origin master
          
          echo "✅ Deployed to HuggingFace Space: https://huggingface.co/spaces/${HF_SPACE}"

  # =============================================================================
  # 部署摘要
  # =============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-worker, deploy-frontend, deploy-huggingface]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CF Workers | ${{ needs.deploy-worker.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CF Pages (Frontend) | ${{ needs.deploy-frontend.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HuggingFace (cf-bypass) | ${{ needs.deploy-huggingface.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
