name: Build Docker Images for FnOS

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'nexus-lite/**'
      - 'cf-bypass-service/**'
      - 'Dockerfile.bun'
      - 'docker-compose.fnos.yml'
      - '.github/workflows/fnos-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nexus-lite/**'
      - 'cf-bypass-service/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # =============================================================================
  # 后端构建 - 只构建 Rust 二进制（前端由 CF Pages 提供）
  # =============================================================================
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      rust-cache-hit: ${{ steps.rust-cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        id: rust-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nexus-lite/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('nexus-lite/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92

      - name: Build Rust backend
        working-directory: nexus-lite
        run: |
          echo "Building Rust backend (API-only mode)..."
          cargo build --release --bin nexus-server
          
          SIZE=$(du -h target/release/nexus-server | cut -f1)
          echo "📦 Rust build completed - Binary size: $SIZE"

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-backend
          path: nexus-lite/target/release/nexus-server
          retention-days: 1

  # =============================================================================
  # Docker 镜像构建 - 纯后端镜像（前端由 CF Pages 提供）
  # =============================================================================
  build-docker:
    runs-on: ubuntu-latest
    needs: build-backend
    permissions:
      contents: read
      packages: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nexus-lite
            context: .
            dockerfile: ./Dockerfile.bun
            platforms: linux/amd64
          - name: cf-bypass-service
            context: ./cf-bypass-service
            dockerfile: ./cf-bypass-service/Dockerfile
            platforms: linux/amd64,linux/arm64
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend binary
        if: matrix.name == 'nexus-lite'
        uses: actions/download-artifact@v4
        with:
          name: rust-backend
          path: nexus-lite/target/release/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          sbom: false

  # =============================================================================
  # FnOS 部署包
  # =============================================================================
  create-fnos-package:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create FnOS deployment package
        run: |
          mkdir -p fnos-package
          
          cp docker-compose.fnos.yml fnos-package/docker-compose.yml
          cp fnos-config.env fnos-package/.env
          
          cat > fnos-package/start.sh << 'EOF'
          #!/bin/bash
          echo "🚀 Starting Nexus Reader on FnOS..."
          
          NEXUS_PORT=$(grep "^NEXUS_PORT=" .env 2>/dev/null | cut -d'=' -f2 || echo "8080")
          CF_BYPASS_PORT=$(grep "^CF_BYPASS_PORT=" .env 2>/dev/null | cut -d'=' -f2 || echo "8001")
          
          mkdir -p data/{nexus,cache,logs,cf-bypass,redis}
          
          docker compose up -d
          echo "✅ Nexus Reader started!"
          echo "📱 API: http://$(hostname -I | awk '{print $1}'):$NEXUS_PORT"
          echo "🌐 Frontend: https://nexus-reader.pages.dev (CF Pages)"
          EOF
          
          cat > fnos-package/stop.sh << 'EOF'
          #!/bin/bash
          docker compose down
          echo "✅ Stopped"
          EOF
          
          cat > fnos-package/update.sh << 'EOF'
          #!/bin/bash
          docker compose pull && docker compose up -d
          echo "✅ Updated"
          EOF
          
          chmod +x fnos-package/*.sh
          
          cat > fnos-package/README.md << 'EOF'
          # Nexus Reader FnOS 部署包
          
          ## 架构说明
          - **前端**: Cloudflare Pages (自动部署)
          - **后端**: Docker 容器 (本地运行)
          
          ## 快速部署
          ```bash
          tar -xzf nexus-reader-fnos-*.tar.gz
          ./start.sh
          ```
          
          ## 管理命令
          - 启动: `./start.sh`
          - 停止: `./stop.sh`
          - 更新: `./update.sh`
          EOF
          
          tar -czf nexus-reader-fnos-${{ steps.version.outputs.version }}.tar.gz -C fnos-package .

      - name: Upload FnOS package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-reader-fnos-package
          path: nexus-reader-fnos-*.tar.gz
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nexus-reader-fnos-*.tar.gz
          body: |
            ## Nexus Reader ${{ github.ref_name }}
            
            ### 架构
            - 前端: Cloudflare Pages (零成本)
            - 后端: Docker (FnOS/NAS)
            
            ### 部署
            ```bash
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/nexus-reader-fnos-${{ github.ref_name }}.tar.gz
            tar -xzf nexus-reader-fnos-${{ github.ref_name }}.tar.gz
            ./start.sh
            ```

  # =============================================================================
  # FnOS 兼容性测试
  # =============================================================================
  test-fnos:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test FnOS deployment
        timeout-minutes: 5
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-lite:latest
        run: |
          cat > docker-compose.test.yml << EOF
          services:
            nexus-lite:
              image: ${IMAGE}
              platform: linux/amd64
              ports:
                - "8080:8080"
              environment:
                - RUST_LOG=info
          EOF
          
          docker compose -f docker-compose.test.yml pull
          docker compose -f docker-compose.test.yml up -d
          
          for i in {1..6}; do
            if curl -sf http://localhost:8080/api/health; then
              echo "✅ Test passed"
              docker compose -f docker-compose.test.yml down
              exit 0
            fi
            echo "Waiting... ($i/6)"
            sleep 10
          done
          
          docker compose -f docker-compose.test.yml logs
          docker compose -f docker-compose.test.yml down
          exit 1
