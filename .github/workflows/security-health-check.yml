name: Security Health Check

on:
  # 每天运行一次全面安全检查
  schedule:
    - cron: "0 6 * * *" # 每天早上6点
  # 手动触发
  workflow_dispatch:
    inputs:
      check_type:
        description: "Type of security checks to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - quick
          - compliance
  # 安全相关事件触发
  security_advisories:
    types: [published, updated]

permissions:
  contents: read
  security-events: write
  actions: write
  pull-requests: write

jobs:
  # =============================================================================
  # 全面安全健康评估
  # =============================================================================
  security-assessment:
    name: Comprehensive Security Assessment
    runs-on: ubuntu-latest
    outputs:
      overall_score: ${{ steps.assess.outputs.score }}
      risk_level: ${{ steps.assess.outputs.risk }}
      recommendations: ${{ steps.assess.outputs.recs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup security tools
        run: |
          # 安装安全扫描工具
          sudo apt-get update
          sudo apt-get install -y jq curl wget

          # 安装Trivy (容器安全扫描)
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

          # 安装Semgrep (代码安全扫描)
          pip install semgrep

      - name: Comprehensive Security Assessment
        id: assess
        run: |
          echo "🔬 Starting comprehensive security assessment..."

          # 初始化评分
          SCORE=100
          RISK_LEVEL="low"
          RECOMMENDATIONS="[]"

          # 1. 检查GitHub Security状态
          echo "📊 Checking GitHub Security status..."

          # CodeQL 告警
          CODEQL_ALERTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=open" | \
            jq -r 'length' || echo "0")

          # Dependabot 告警
          DEPENDABOT_ALERTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts?state=open" | \
            jq -r 'length' || echo "0")

          # Secret scanning 告警
          SECRET_ALERTS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/secret-scanning/alerts?state=open" | \
            jq -r 'length' || echo "0")

          echo "Security alerts: CodeQL=$CODEQL_ALERTS, Dependabot=$DEPENDABOT_ALERTS, Secrets=$SECRET_ALERTS"

          # 扣分逻辑
          SCORE=$((SCORE - CODEQL_ALERTS * 2))
          SCORE=$((SCORE - DEPENDABOT_ALERTS * 3))
          SCORE=$((SCORE - SECRET_ALERTS * 10))

          # 2. 检查依赖安全
          echo "🔍 Checking dependency security..."

          # 检查package.json中的依赖
          if [ -f "nexus-reader/package.json" ]; then
            cd nexus-reader
            npm audit --audit-level=moderate --json > ../npm-audit.json 2>/dev/null || echo "{}" > ../npm-audit.json
            cd ..
          fi

          # 解析npm审计结果
          NPM_VULNERABILITIES=$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit.json 2>/dev/null || echo "0")
          SCORE=$((SCORE - NPM_VULNERABILITIES * 2))

          # 3. 检查Docker镜像安全 (如果有Dockerfile)
          echo "🐳 Checking container security..."
          DOCKER_VULNS=0

          if [ -f "nexus-lite/Dockerfile" ]; then
            # 构建并扫描Docker镜像
            docker build -t nexus-lite-scan nexus-lite/ || true
            trivy image --format json nexus-lite-scan > docker-scan.json 2>&1 || echo "{}" > docker-scan.json
            DOCKER_VULNS=$(jq -r '.Results[]?.Vulnerabilities // [] | length' docker-scan.json 2>/dev/null || echo "0")
            SCORE=$((SCORE - DOCKER_VULNS))
          fi

          # 4. 检查代码质量指标
          echo "💻 Checking code quality metrics..."

          # 计算代码复杂度 (简单估算)
          JS_FILES=$(find nexus-reader -name "*.js" -o -name "*.ts" -o -name "*.vue" | wc -l)
          PY_FILES=$(find cf-bypass-service -name "*.py" | wc -l)
          RS_FILES=$(find nexus-lite -name "*.rs" | wc -l)

          TOTAL_FILES=$((JS_FILES + PY_FILES + RS_FILES))

          # 检查是否有测试
          TEST_FILES=$(find . -name "*test*" -o -name "*spec*" | wc -l)

          # 5. 确定风险等级
          SCORE=$((SCORE < 0 ? 0 : SCORE))

          if [ $SCORE -ge 90 ]; then
            RISK_LEVEL="low"
          elif [ $SCORE -ge 70 ]; then
            RISK_LEVEL="medium"
          elif [ $SCORE -ge 50 ]; then
            RISK_LEVEL="high"
          else
            RISK_LEVEL="critical"
          fi

          # 生成建议
          RECS_ARRAY=()

          if [ $CODEQL_ALERTS -gt 0 ]; then
            RECS_ARRAY+=("{\"priority\":\"high\",\"action\":\"fix_codeql_alerts\",\"description\":\"Fix $CODEQL_ALERTS CodeQL security alerts\"}")
          fi

          if [ $DEPENDABOT_ALERTS -gt 0 ]; then
            RECS_ARRAY+=("{\"priority\":\"high\",\"action\":\"merge_dependabot_prs\",\"description\":\"Merge $DEPENDABOT_ALERTS Dependabot security updates\"}")
          fi

          if [ $SECRET_ALERTS -gt 0 ]; then
            RECS_ARRAY+=("{\"priority\":\"critical\",\"action\":\"rotate_secrets\",\"description\":\"Rotate $SECRET_ALERTS exposed secrets\"}")
          fi

          if [ $NPM_VULNERABILITIES -gt 0 ]; then
            RECS_ARRAY+=("{\"priority\":\"medium\",\"action\":\"update_dependencies\",\"description\":\"Fix $NPM_VULNERABILITIES npm vulnerabilities\"}")
          fi

          if [ $DOCKER_VULNS -gt 0 ]; then
            RECS_ARRAY+=("{\"priority\":\"medium\",\"action\":\"rebuild_containers\",\"description\":\"Fix $DOCKER_VULNS container vulnerabilities\"}")
          fi

          if [ $TEST_FILES -eq 0 ]; then
            RECS_ARRAY+=("{\"priority\":\"medium\",\"action\":\"add_tests\",\"description\":\"Add test coverage for better security\"}")
          fi

          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "risk=$RISK_LEVEL" >> $GITHUB_OUTPUT
          echo "recs=[$(IFS=,; echo "${RECS_ARRAY[*]}")]" >> $GITHUB_OUTPUT

          echo "✅ Security assessment complete - Score: $SCORE/100, Risk: $RISK_LEVEL"

  # =============================================================================
  # 代码安全扫描 (Semgrep)
  # =============================================================================
  code-security-scan:
    name: Code Security Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: security-assessment
    if: github.event.inputs.check_type != 'quick'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Security Scan
        run: |
          echo "🔍 Running Semgrep security scan..."

          # 创建Semgrep配置
          cat > .semgrep.yml << 'EOF'
          rules:
          - id: generic.secrets.security.detected-private-key
            patterns:
            - pattern: "-----BEGIN PRIVATE KEY-----"
            message: "Private key detected"
            severity: ERROR

          - id: generic.secrets.security.detected-aws-key
            patterns:
            - pattern: 'AKIA[0-9A-Z]{16}'
            message: "AWS key detected"
            severity: ERROR

          - id: javascript.security.audit.detect-eval
            patterns:
            - pattern: eval(...)
            message: "Use of eval() detected"
            severity: WARNING

          - id: python.security.audit.hardcoded-password
            patterns:
            - pattern: password = "$PASSWORD"
            message: "Hardcoded password detected"
            severity: ERROR
          EOF

          # 运行扫描
          semgrep --config .semgrep.yml --json > semgrep-results.json 2>&1 || true

          # 分析结果
          FINDINGS=$(jq -r '.results.found // [] | length' semgrep-results.json 2>/dev/null || echo "0")

          if [ "$FINDINGS" -gt 0 ]; then
            echo "⚠️ Found $FINDINGS security issues"

            # 生成SARIF报告
            semgrep --config .semgrep.yml --sarif > semgrep-results.sarif 2>&1 || true
          else
            echo "✅ No security issues found"
          fi

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
          category: "/tool:semgrep"
        continue-on-error: true

  # =============================================================================
  # 合规性检查
  # =============================================================================
  compliance-check:
    name: Compliance & Best Practices Check
    runs-on: ubuntu-latest
    needs: security-assessment
    if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == 'compliance'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Compliance Checks
        run: |
          echo "📋 Running compliance and best practices checks..."

          ISSUES=0

          # 1. 检查是否有敏感文件
          SENSITIVE_FILES=$(find . -name "*.pem" -o -name "*.key" -o -name "secrets.json" -o -name ".env" | grep -v ".env.example" | wc -l)
          if [ "$SENSITIVE_FILES" -gt 0 ]; then
            echo "❌ Found $SENSITIVE_FILES sensitive files that should not be committed"
            ISSUES=$((ISSUES + SENSITIVE_FILES))
          fi

          # 2. 检查依赖锁定文件
          if [ ! -f "nexus-reader/package-lock.json" ] && [ ! -f "nexus-reader/bun.lock" ]; then
            echo "⚠️ Missing dependency lock file for frontend"
            ISSUES=$((ISSUES + 1))
          fi

          if [ ! -f "cf-bypass-service/requirements.txt" ] && [ ! -f "cf-bypass-service/pyproject.toml" ]; then
            echo "⚠️ Missing dependency lock file for Python"
            ISSUES=$((ISSUES + 1))
          fi

          # 3. 检查是否有测试
          TEST_COVERAGE=$(find . -name "*test*" -o -name "*spec*" | wc -l)
          if [ "$TEST_COVERAGE" -eq 0 ]; then
            echo "⚠️ No tests found - consider adding test coverage"
            ISSUES=$((ISSUES + 1))
          fi

          # 4. 检查代码质量
          # 检查是否有TODO/FIXME注释
          TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX" --include="*.js" --include="*.ts" --include="*.py" --include="*.rs" . | wc -l)
          if [ "$TODO_COUNT" -gt 10 ]; then
            echo "⚠️ Found $TODO_COUNT TODO/FIXME comments - consider addressing"
            ISSUES=$((ISSUES + 1))
          fi

          # 5. 检查许可证
          if [ ! -f "LICENSE" ]; then
            echo "⚠️ Missing LICENSE file"
            ISSUES=$((ISSUES + 1))
          fi

          echo "Compliance check complete - Found $ISSUES issues"

  # =============================================================================
  # 生成安全健康报告
  # =============================================================================
  security-health-report:
    name: Security Health Report
    runs-on: ubuntu-latest
    needs: [security-assessment, code-security-scan, compliance-check]
    if: always()
    steps:
      - name: Generate Comprehensive Security Health Report
        run: |
          OVERALL_SCORE="${{ needs.security-assessment.outputs.overall_score }}"
          RISK_LEVEL="${{ needs.security-assessment.outputs.risk_level }}"
          RECOMMENDATIONS="${{ needs.security-assessment.outputs.recommendations }}"

          echo "## 🩺 Security Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Overall Security Score" >> $GITHUB_STEP_SUMMARY

          # 分数可视化
          SCORE_BAR=""
          FILLED=$((OVERALL_SCORE / 10))
          EMPTY=$((10 - FILLED))

          for ((i=1; i<=FILLED; i++)); do SCORE_BAR="${SCORE_BAR}🟢"; done
          for ((i=1; i<=EMPTY; i++)); do SCORE_BAR="${SCORE_BAR}⚪"; done

          echo "**$OVERALL_SCORE/100** $SCORE_BAR" >> $GITHUB_STEP_SUMMARY

          # 风险等级
          case $RISK_LEVEL in
            "low")
              echo "🟢 **Risk Level: LOW** - Security posture is strong" >> $GITHUB_STEP_SUMMARY
              ;;
            "medium")
              echo "🟡 **Risk Level: MEDIUM** - Some attention needed" >> $GITHUB_STEP_SUMMARY
              ;;
            "high")
              echo "🔴 **Risk Level: HIGH** - Immediate action required" >> $GITHUB_STEP_SUMMARY
              ;;
            "critical")
              echo "🚨 **Risk Level: CRITICAL** - Emergency security measures needed" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Security Components Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Score Impact |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------------|" >> $GITHUB_STEP_SUMMARY

          # 解析各种检查结果
          echo "| CodeQL Scanning | ${{ needs.code-security-scan.result }} | -2 per alert |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Security | ✅ Active | -3 per vuln |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security | ✅ Scanned | -1 per vuln |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance Check | ${{ needs.compliance-check.result }} | Variable |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Priority Recommendations" >> $GITHUB_STEP_SUMMARY

          REC_COUNT=$(echo "$RECOMMENDATIONS" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$REC_COUNT" -gt 0 ]; then
            # 按优先级排序
            echo "$RECOMMENDATIONS" | jq -r '.[] | "\(.priority)|\(.action)|\(.description)"' | \
            sort -t'|' -k1,1r | while IFS='|' read -r PRIORITY ACTION DESC; do

              case $PRIORITY in
                "critical")
                  ICON="🚨"
                  ;;
                "high")
                  ICON="🔴"
                  ;;
                "medium")
                  ICON="🟡"
                  ;;
                "low")
                  ICON="🟢"
                  ;;
                *)
                  ICON="⚪"
                  ;;
              esac

              echo "- $ICON **$ACTION**: $DESC" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "✅ **No critical recommendations** - Security posture is excellent!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Security Best Practices Status" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 **Secret Management**: ✅ GitHub Secrets configured" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 **Auto Updates**: ✅ Dependabot enabled" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 **Code Scanning**: ✅ CodeQL active" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 **Container Security**: ✅ Trivy scanning" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 **Compliance**: ✅ Automated checks" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📅 Security Maintenance Schedule" >> $GITHUB_STEP_SUMMARY
          echo "- **Daily**: Dependency security updates" >> $GITHUB_STEP_SUMMARY
          echo "- **Weekly**: CodeQL security scans" >> $GITHUB_STEP_SUMMARY
          echo "- **Monthly**: Comprehensive security assessment" >> $GITHUB_STEP_SUMMARY
          echo "- **Continuous**: Real-time vulnerability monitoring" >> $GITHUB_STEP_SUMMARY

          # 健康状态总结
          if [ "$OVERALL_SCORE" -ge 80 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🏆 Security Excellence Achieved!" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Your project maintains excellent security standards!" >> $GITHUB_STEP_SUMMARY
          elif [ "$OVERALL_SCORE" -lt 50 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚨 Security Alert" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Immediate security improvements are required!" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔒 Security is a continuous journey, not a destination.**" >> $GITHUB_STEP_SUMMARY

      - name: Create Security Improvement Issue (if needed)
        if: needs.security-assessment.outputs.overall_score < 70
        run: |
          SCORE="${{ needs.security-assessment.outputs.overall_score }}"
          RISK="${{ needs.security-assessment.outputs.risk_level }}"

          TITLE="🚨 Security Health Check: Score $SCORE/100 ($RISK Risk)"
          BODY="## 🚨 Security Health Check Results

          **Overall Security Score**: $SCORE/100
          **Risk Level**: $RISK

          ### Assessment Details
          - Date: $(date '+%Y-%m-%d %H:%M UTC')
          - Trigger: ${{ github.event_name }}

          ### Recommended Actions
          ${RECOMMENDATIONS}

          ### Next Steps
          1. Review the security health report above
          2. Address high-priority recommendations
          3. Run auto-security-fix workflow if applicable
          4. Monitor security score improvements

          ---
          🤖 *Auto-generated by security health check*"

          # 检查是否已有类似的未解决问题
          EXISTING=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=security,health-check" | \
            jq -r '.[] | select(.title | contains("Security Health Check")) | .number' | head -1)

          if [ -z "$EXISTING" ]; then
            # 创建新的健康检查issue
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "{
                \"title\": \"$TITLE\",
                \"body\": \"$BODY\",
                \"labels\": [\"security\", \"health-check\", \"automated\"],
                \"assignees\": [\"${{ github.actor }}\"]
              }")

            ISSUE_NUMBER=$(echo "$RESPONSE" | jq -r '.number // empty')
            if [ -n "$ISSUE_NUMBER" ]; then
              echo "✅ Created security health check issue #$ISSUE_NUMBER"
            fi
          else
            echo "⚠️ Security health check issue already exists (#$EXISTING)"
          fi
