# Optional: upload cf-bypass-service/ to a HuggingFace Space (Docker SDK).
# Does not deploy Pages/Worker; use deploy-personal.yml for edge. Requires HF_TOKEN.
name: Deploy cf-bypass to HuggingFace Space

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cf-bypass-hf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload-space:
    name: Upload to HuggingFace Space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install huggingface_hub

      - name: Validate HF token
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "HF_TOKEN secret is not set"
            exit 1
          fi

      - name: Deploy CF bypass Space
        id: deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import shutil
          from huggingface_hub import HfApi, create_repo, repo_exists

          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          username = api.whoami()["name"]
          space_short_name = "cf-bypass-service"
          space_repo = f"{username}/{space_short_name}"
          space_url = f"https://huggingface.co/spaces/{space_repo}"
          api_url = f"https://{space_repo.replace('/', '-')}.hf.space"

          if not repo_exists(space_repo, repo_type="space", token=token):
              create_repo(space_repo, repo_type="space", space_sdk="docker", token=token)

          if os.path.exists("hf-upload"):
              shutil.rmtree("hf-upload")
          shutil.copytree("cf-bypass-service", "hf-upload", dirs_exist_ok=True)

          readme = """---
          title: CF Bypass Service
          emoji: unlock
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_file: Dockerfile
          pinned: false
          ---"""

          with open("hf-upload/README.md", "w") as f:
              f.write(readme)

          api.upload_folder("hf-upload", space_repo, repo_type="space")
          print("Uploaded cf-bypass-service to", space_url)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"space_url={space_url}\n")
              out.write(f"api_url={api_url}\n")
          EOF

      - name: Summary
        run: |
          echo "### cf-bypass HuggingFace Space" >> "$GITHUB_STEP_SUMMARY"
          echo "- Space: ${{ steps.deploy.outputs.space_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API (after build): ${{ steps.deploy.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
