name: Setup Cloudflare Resources

on:
  workflow_dispatch:
    inputs:
      create_databases:
        description: 'Create D1 databases'
        required: true
        default: true
        type: boolean
      create_kv:
        description: 'Create KV namespaces'
        required: true
        default: true
        type: boolean
      create_r2:
        description: 'Create R2 buckets'
        required: true
        default: true
        type: boolean

concurrency:
  group: setup-cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-cloudflare:
    name: Setup Cloudflare Resources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Validate Cloudflare Credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN secret is not configured"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID secret is not configured"
            exit 1
          fi
          echo "✅ Cloudflare credentials are configured"

      - name: Create D1 databases
        if: ${{ inputs.create_databases }}
        run: |
          set -euo pipefail

          ensure_d1_database() {
            local database_name="$1"
            local env_name="$2"

            wrangler d1 create "$database_name" >/dev/null 2>&1 || true

            local database_id
            database_id="$(wrangler d1 list --json | jq -r --arg name "$database_name" '.[] | select(.name==$name) | .uuid' | head -n 1)"

            if [ -z "$database_id" ] || [ "$database_id" = "null" ]; then
              echo "❌ Failed to resolve D1 database ID for $database_name"
              exit 1
            fi

            echo "$env_name=$database_id" >> "$GITHUB_ENV"
            echo "✅ $database_name -> $database_id"
          }

          echo "Creating D1 databases..."

          ensure_d1_database nexus_analytics ANALYTICS_DB_ID
          ensure_d1_database nexus_user_prefs USER_PREFS_DB_ID
          ensure_d1_database nexus_analytics_prod PROD_ANALYTICS_DB_ID
          ensure_d1_database nexus_user_prefs_prod PROD_USER_PREFS_DB_ID

      - name: Create KV namespaces
        if: ${{ inputs.create_kv }}
        run: |
          set -euo pipefail

          ensure_kv_namespace() {
            local namespace_title="$1"
            local env_name="$2"

            wrangler kv:namespace create "$namespace_title" >/dev/null 2>&1 || true

            local namespace_id
            namespace_id="$(wrangler kv:namespace list --json | jq -r --arg title "$namespace_title" '.[] | select(.title==$title) | .id' | head -n 1)"

            if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
              echo "❌ Failed to resolve KV namespace ID for $namespace_title"
              exit 1
            fi

            echo "$env_name=$namespace_id" >> "$GITHUB_ENV"
            echo "✅ $namespace_title -> $namespace_id"
          }

          echo "Creating KV namespaces..."

          ensure_kv_namespace PROGRESS_KV PROGRESS_KV_ID
          ensure_kv_namespace CONTENT_CACHE_KV CONTENT_CACHE_KV_ID
          ensure_kv_namespace DECODER_KV DECODER_KV_ID
          ensure_kv_namespace AI_CACHE_KV AI_CACHE_KV_ID

      - name: Create R2 buckets
        if: ${{ inputs.create_r2 }}
        run: |
          set -euo pipefail

          echo "Creating R2 buckets..."

          wrangler r2 bucket create nexus-user-content || true
          wrangler r2 bucket create nexus-backup || true

      - name: Create Analytics dataset
        run: |
          echo "Creating Analytics Engine dataset..."
          wrangler analytics-engine create nexus_usage_analytics || true

      - name: Output resource IDs
        run: |
          echo "=== Cloudflare Resource IDs ==="
          echo "D1 Databases:"
          echo "  Analytics DB ID: ${{ env.ANALYTICS_DB_ID }}"
          echo "  User Preferences DB ID: ${{ env.USER_PREFS_DB_ID }}"
          echo "  Production Analytics DB ID: ${{ env.PROD_ANALYTICS_DB_ID }}"
          echo "  Production User Preferences DB ID: ${{ env.PROD_USER_PREFS_DB_ID }}"
          echo ""
          echo "KV Namespaces:"
          echo "  Progress KV ID: ${{ env.PROGRESS_KV_ID }}"
          echo "  Content Cache KV ID: ${{ env.CONTENT_CACHE_KV_ID }}"
          echo "  Decoder KV ID: ${{ env.DECODER_KV_ID }}"
          echo "  AI Cache KV ID: ${{ env.AI_CACHE_KV_ID }}"

      - name: Publish Secret Sync Commands
        run: |
          echo "## Cloudflare Resource Secret Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the following commands locally or in an admin shell to sync repository secrets:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for secret_name in \
            ANALYTICS_DB_ID \
            USER_PREFS_DB_ID \
            PROD_ANALYTICS_DB_ID \
            PROD_USER_PREFS_DB_ID \
            PROGRESS_KV_ID \
            CONTENT_CACHE_KV_ID \
            DECODER_KV_ID \
            AI_CACHE_KV_ID
          do
            secret_value="$(printenv "$secret_name")"
            if [ -n "$secret_value" ]; then
              case "$secret_name" in
                ANALYTICS_DB_ID) target_secret="CF_ANALYTICS_DB_ID" ;;
                USER_PREFS_DB_ID) target_secret="CF_USER_PREFS_DB_ID" ;;
                PROD_ANALYTICS_DB_ID) target_secret="CF_PROD_ANALYTICS_DB_ID" ;;
                PROD_USER_PREFS_DB_ID) target_secret="CF_PROD_USER_PREFS_DB_ID" ;;
                PROGRESS_KV_ID) target_secret="CF_PROGRESS_KV_ID" ;;
                CONTENT_CACHE_KV_ID) target_secret="CF_CONTENT_CACHE_KV_ID" ;;
                DECODER_KV_ID) target_secret="CF_DECODER_KV_ID" ;;
                AI_CACHE_KV_ID) target_secret="CF_AI_CACHE_KV_ID" ;;
              esac
              echo "- \`gh secret set $target_secret --body \"$secret_value\"\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Generate setup summary
        run: |
          echo "## Setup Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Required repository secrets:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`CLOUDFLARE_API_TOKEN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`CLOUDFLARE_ACCOUNT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`HF_TOKEN\` (optional — only for manual HuggingFace Space upload workflows)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`VITE_API_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`VITE_NEXUS_LITE_DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`VITE_NEXUS_LITE_API_KEY\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`DOCKER_USERNAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`DOCKER_PASSWORD\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated resource IDs are listed above and can be synced with the provided \`gh secret set\` commands." >> "$GITHUB_STEP_SUMMARY"
