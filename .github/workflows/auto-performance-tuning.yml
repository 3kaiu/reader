name: Auto Performance Tuning

on:
  # 每小时运行一次性能监控和调优
  schedule:
    - cron: "0 * * * *"
  # 手动触发
  workflow_dispatch:
    inputs:
      force_optimization:
        description: "Force full optimization regardless of current performance"
        required: false
        default: "false"
        type: boolean
      target_component:
        description: "Target component to optimize (all/cf-bypass/nexus-lite/workers)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - cf-bypass
          - nexus-lite
          - workers
  # 部署完成后触发
  workflow_run:
    workflows: ["Production Deployment (CF + HuggingFace)"]
    types: [completed]

permissions:
  contents: read
  actions: write

env:
  CF_BYPASS_SPACE_NAME: cf-bypass-service
  NEXUS_LITE_SPACE_NAME: nexus-lite

jobs:
  # =============================================================================
  # 获取服务 URLs
  # =============================================================================
  get-service-urls:
    runs-on: ubuntu-latest
    outputs:
      cf_bypass_url: ${{ steps.urls.outputs.cf_bypass_url }}
      nexus_lite_url: ${{ steps.urls.outputs.nexus_lite_url }}
      worker_subdomain: ${{ steps.urls.outputs.worker_subdomain }}
    steps:
      - name: Get HuggingFace URLs
        id: urls
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 获取 HuggingFace 用户名
          RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          USERNAME=$(echo "$RESPONSE" | jq -r '.name // empty')

          if [ -z "$USERNAME" ]; then
            echo "❌ Failed to get HuggingFace username"
            exit 1
          fi

          echo "cf_bypass_url=https://${USERNAME}-${CF_BYPASS_SPACE_NAME}.hf.space" >> $GITHUB_OUTPUT
          echo "nexus_lite_url=https://${USERNAME}-${NEXUS_LITE_SPACE_NAME}.hf.space" >> $GITHUB_OUTPUT

      - name: Get Worker Subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.subdomain // empty')

          if [ -z "$SUBDOMAIN" ]; then
            echo "❌ Failed to get workers subdomain"
            exit 1
          fi

          echo "worker_subdomain=$SUBDOMAIN" >> $GITHUB_OUTPUT

  # =============================================================================
  # 性能监控和数据收集
  # =============================================================================
  performance-monitoring:
    runs-on: ubuntu-latest
    needs: get-service-urls
    outputs:
      cf_bypass_health: ${{ steps.monitor.outputs.cf_bypass_health }}
      nexus_lite_health: ${{ steps.monitor.outputs.nexus_lite_health }}
      cf_bypass_metrics: ${{ steps.monitor.outputs.cf_bypass_metrics }}
      optimization_needed: ${{ steps.monitor.outputs.optimization_needed }}
    steps:
      - name: Monitor System Performance
        id: monitor
        run: |
          CF_BYPASS_URL="${{ needs.get-service-urls.outputs.cf_bypass_url }}"
          NEXUS_LITE_URL="${{ needs.get-service-urls.outputs.nexus_lite_url }}"

          echo "📊 Starting performance monitoring..."

          # 初始化输出
          echo "cf_bypass_health=unknown" >> $GITHUB_OUTPUT
          echo "nexus_lite_health=unknown" >> $GITHUB_OUTPUT
          echo "cf_bypass_metrics={}" >> $GITHUB_OUTPUT
          echo "optimization_needed=false" >> $GITHUB_OUTPUT

          # 检查 CF Bypass Service
          echo "🔍 Checking CF Bypass Service..."
          CF_HEALTH=$(curl -s --max-time 10 "${CF_BYPASS_URL}/health" 2>/dev/null || echo "error")
          if [ "$CF_HEALTH" != "error" ]; then
            STATUS=$(echo "$CF_HEALTH" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
            echo "cf_bypass_health=$STATUS" >> $GITHUB_OUTPUT

            if [ "$STATUS" = "healthy" ]; then
              echo "✅ CF Bypass Service: healthy"

              # 获取详细统计
              STATS=$(curl -s --max-time 10 "${CF_BYPASS_URL}/stats" 2>/dev/null || echo "{}")
              echo "cf_bypass_metrics=$STATS" >> $GITHUB_OUTPUT

              # 分析性能指标
              SESSION_HIT_RATE=$(echo "$STATS" | jq -r '.session_pool.hit_rate // 0' 2>/dev/null || echo "0")
              MEMORY_USAGE=$(echo "$STATS" | jq -r '.memory.current_mb // 0' 2>/dev/null || echo "0")
              CONNECTION_REUSE=$(echo "$STATS" | jq -r '.connection_pool.reuse_rate // 0' 2>/dev/null || echo "0")

              echo "📈 Current metrics:"
              echo "  - Session hit rate: $(printf "%.1f%%" $(echo "$SESSION_HIT_RATE * 100" | bc -l 2>/dev/null || echo "0"))"
              echo "  - Memory usage: ${MEMORY_USAGE}MB"
              echo "  - Connection reuse: $(printf "%.1f%%" $(echo "$CONNECTION_REUSE * 100" | bc -l 2>/dev/null || echo "0"))"

              # 判断是否需要优化
              OPTIMIZE=false

              # 会话池命中率低于 75%
              if (( $(echo "$SESSION_HIT_RATE < 0.75" | bc -l 2>/dev/null || echo "false") )); then
                OPTIMIZE=true
                echo "⚠️ Session pool hit rate too low"
              fi

              # 内存使用超过 600MB
              if [ "$MEMORY_USAGE" -gt 600 ]; then
                OPTIMIZE=true
                echo "⚠️ Memory usage too high"
              fi

              # 连接复用率低于 40%
              if (( $(echo "$CONNECTION_REUSE < 0.4" | bc -l 2>/dev/null || echo "false") )); then
                OPTIMIZE=true
                echo "⚠️ Connection reuse rate too low"
              fi

              if [ "$OPTIMIZE" = true ] || [ "${{ github.event.inputs.force_optimization }}" = "true" ]; then
                echo "optimization_needed=true" >> $GITHUB_OUTPUT
                echo "🔧 Optimization needed!"
              else
                echo "✅ Performance within acceptable ranges"
              fi
            else
              echo "❌ CF Bypass Service: $STATUS"
            fi
          else
            echo "❌ CF Bypass Service: unreachable"
          fi

          # 检查 Nexus Lite
          echo "🔍 Checking Nexus Lite..."
          NEXUS_HEALTH=$(curl -s --max-time 10 "${NEXUS_LITE_URL}/health" 2>/dev/null || echo "error")
          if [ "$NEXUS_HEALTH" != "error" ]; then
            STATUS=$(echo "$NEXUS_HEALTH" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
            echo "nexus_lite_health=$STATUS" >> $GITHUB_OUTPUT

            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Nexus Lite: healthy"
            else
              echo "❌ Nexus Lite: $STATUS"
            fi
          else
            echo "❌ Nexus Lite: unreachable"
          fi

  # =============================================================================
  # 自动性能优化
  # =============================================================================
  auto-optimization:
    runs-on: ubuntu-latest
    needs: [get-service-urls, performance-monitoring]
    if: needs.performance-monitoring.outputs.optimization_needed == 'true' || github.event.inputs.force_optimization == 'true'
    steps:
      - name: Auto-Optimize CF Bypass Service
        if: needs.performance-monitoring.outputs.cf_bypass_health == 'healthy' && (github.event.inputs.target_component == 'all' || github.event.inputs.target_component == 'cf-bypass')
        run: |
          CF_BYPASS_URL="${{ needs.get-service-urls.outputs.cf_bypass_url }}"
          METRICS="${{ needs.performance-monitoring.outputs.cf_bypass_metrics }}"

          echo "🚀 Starting CF Bypass auto-optimization..."

          # 解析当前指标
          SESSION_HIT_RATE=$(echo "$METRICS" | jq -r '.session_pool.hit_rate // 0' 2>/dev/null || echo "0")
          MEMORY_USAGE=$(echo "$METRICS" | jq -r '.memory.current_mb // 0' 2>/dev/null || echo "0")
          CONNECTION_REUSE=$(echo "$METRICS" | jq -r '.connection_pool.reuse_rate // 0' 2>/dev/null || echo "0")

          echo "📊 Current performance:"
          echo "  - Session hit rate: $(printf "%.1f%%" $(echo "$SESSION_HIT_RATE * 100" | bc -l))"
          echo "  - Memory usage: ${MEMORY_USAGE}MB"
          echo "  - Connection reuse: $(printf "%.1f%%" $(echo "$CONNECTION_REUSE * 100" | bc -l))"

          # 智能优化逻辑

          # 1. 会话池优化
          if (( $(echo "$SESSION_HIT_RATE < 0.8" | bc -l) )); then
            echo "🔧 Optimizing session pool..."
            # 增加会话池大小
            curl -s "${CF_BYPASS_URL}/config/session-pool?size=12" || true
            echo "✅ Increased session pool size to 12"
          fi

          # 2. 内存优化
          if [ "$MEMORY_USAGE" -gt 500 ]; then
            echo "🔧 Optimizing memory usage..."
            # 减少缓存大小
            CACHE_SIZE=$((CACHE_SIZE_LIMIT > 5000 ? 5000 : CACHE_SIZE_LIMIT))
            curl -s "${CF_BYPASS_URL}/config/cache?size=${CACHE_SIZE}" || true
            # 启用更激进的清理
            curl -s "${CF_BYPASS_URL}/config/memory?aggressive_cleanup=true" || true
            echo "✅ Optimized memory management"
          fi

          # 3. 连接池优化
          if (( $(echo "$CONNECTION_REUSE < 0.5" | bc -l) )); then
            echo "🔧 Optimizing connection pool..."
            # 增加连接池大小
            curl -s "${CF_BYPASS_URL}/config/connection-pool?maxsize=150" || true
            echo "✅ Increased connection pool to 150"
          fi

          # 预热常用域名
          echo "🔥 Warming up common domains..."
          COMMON_DOMAINS=("69shuba.cx" "hetushu.com" "sudugu.com")
          for DOMAIN in "${COMMON_DOMAINS[@]}"; do
            curl -s "${CF_BYPASS_URL}/warmup?domain=${DOMAIN}" || true
          done

          echo "✅ Auto-optimization complete!"

      - name: Auto-Optimize Workers
        if: github.event.inputs.target_component == 'all' || github.event.inputs.target_component == 'workers'
        run: |
          SUBDOMAIN="${{ needs.get-service-urls.outputs.worker_subdomain }}"

          echo "🚀 Starting Workers auto-optimization..."

          # 检查 Workers 性能
          WORKER_URL="https://nexus-proxy.${SUBDOMAIN}.workers.dev"
          HEALTH=$(curl -s --max-time 5 "${WORKER_URL}/health" 2>/dev/null || echo "error")

          if [ "$HEALTH" != "error" ]; then
            echo "✅ Workers are healthy"

            # 触发自动调优
            TUNE_RESULT=$(curl -s "${WORKER_URL}/tune" 2>/dev/null || echo "error")
            if [ "$TUNE_RESULT" != "error" ]; then
              echo "✅ Workers auto-tuning triggered"
            fi

            # 触发自愈检查
            HEAL_RESULT=$(curl -s "${WORKER_URL}/heal" 2>/dev/null || echo "error")
            if [ "$HEAL_RESULT" != "error" ]; then
              echo "✅ Workers self-healing checked"
            fi
          else
            echo "❌ Workers unreachable - skipping optimization"
          fi

  # =============================================================================
  # 优化结果报告
  # =============================================================================
  optimization-report:
    runs-on: ubuntu-latest
    needs: [performance-monitoring, auto-optimization]
    if: always()
    steps:
      - name: Generate Optimization Report
        run: |
          echo "## 🤖 Auto Performance Tuning Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 System Status" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Optimization |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|--------------|" >> $GITHUB_STEP_SUMMARY

          CF_HEALTH="${{ needs.performance-monitoring.outputs.cf_bypass_health }}"
          NEXUS_HEALTH="${{ needs.performance-monitoring.outputs.nexus_lite_health }}"
          OPTIMIZATION_NEEDED="${{ needs.performance-monitoring.outputs.optimization_needed }}"

          if [ "$CF_HEALTH" = "healthy" ]; then
            if [ "$OPTIMIZATION_NEEDED" = "true" ]; then
              echo "| CF Bypass | ✅ Healthy | 🔧 Optimized |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| CF Bypass | ✅ Healthy | ✅ Optimal |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| CF Bypass | ❌ $CF_HEALTH | ❌ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$NEXUS_HEALTH" = "healthy" ]; then
            echo "| Nexus Lite | ✅ Healthy | ✅ Monitoring |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Nexus Lite | ❌ $NEXUS_HEALTH | ❌ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Optimization Actions Taken" >> $GITHUB_STEP_SUMMARY

          if [ "$OPTIMIZATION_NEEDED" = "true" ] || [ "${{ github.event.inputs.force_optimization }}" = "true" ]; then
            echo "- 🔧 **Session Pool**: Auto-adjusted size based on hit rate" >> $GITHUB_STEP_SUMMARY
            echo "- 🔧 **Memory Management**: Optimized cache and cleanup settings" >> $GITHUB_STEP_SUMMARY
            echo "- 🔧 **Connection Pool**: Scaled based on reuse patterns" >> $GITHUB_STEP_SUMMARY
            echo "- 🔥 **Domain Warming**: Pre-warmed common domains" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 **Workers Tuning**: Triggered auto-tuning and self-healing" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ✅ **All systems optimal** - No optimization needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Continuous Monitoring" >> $GITHUB_STEP_SUMMARY
          echo "System automatically:" >> $GITHUB_STEP_SUMMARY
          echo "- Monitors performance every hour" >> $GITHUB_STEP_SUMMARY
          echo "- Triggers optimization when needed" >> $GITHUB_STEP_SUMMARY
          echo "- Adjusts configurations dynamically" >> $GITHUB_STEP_SUMMARY
          echo "- Maintains optimal performance levels" >> $GITHUB_STEP_SUMMARY

          # 通知优化完成
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**⏰ Scheduled optimization completed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**🎯 Manual optimization completed**" >> $GITHUB_STEP_SUMMARY
          fi
