name: 🔒 Security Scan & Audit

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/bun.lock"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scan
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  # ===== 代码安全扫描 =====
  codeql-scan:
    name: 🔍 CodeQL Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_visibility == 'public'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, typescript, python, rust
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ===== 依赖安全审计 =====
  dependency-audit:
    name: 📦 Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Rust audit tool
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        id: rust-audit
        working-directory: nexus-lite
        run: |
          set +e
          cargo audit --format json > ../rust-audit-results.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup frontend toolchain
        uses: ./.github/actions/nexus-reader-quality
        with:
          bun-version: latest

      - name: Audit frontend dependencies
        id: frontend-audit
        working-directory: nexus-reader
        run: |
          set +e
          bun audit --json > ../bun-audit-results.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-results
          path: |
            rust-audit-results.json
            bun-audit-results.json
          retention-days: 30

      - name: Enforce audit results
        run: |
          if [ "${{ steps.rust-audit.outputs.status }}" != "0" ]; then
            echo "❌ cargo audit reported vulnerabilities"
            exit 1
          fi
          if [ "${{ steps.frontend-audit.outputs.status }}" != "0" ]; then
            echo "❌ bun audit reported vulnerabilities"
            exit 1
          fi

  # ===== 自定义安全检查 =====
  custom-security-check:
    name: 🛡️ Custom Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "18"

      - name: Run custom security checks
        run: |
          set -euo pipefail
          touch potential-secrets.txt insecure-urls.txt

          # Check for hard-coded secrets in non-test source files
          echo "🔍 Checking for potential secrets..."
          set +e
          rg -n -P \
            --glob '!**/dist/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/target/**' \
            --glob '!**/.git/**' \
            --glob '!**/src/tests/**' \
            --glob '!**/tests/**' \
            --glob '!**/__tests__/**' \
            --glob '!**/*.test.*' \
            --glob '!**/*.spec.*' \
            --glob '!**/.env.example' \
            --glob '!**/wrangler.toml' \
            '(?i)(api[_-]?key|auth[_-]?secret|client[_-]?secret|access[_-]?token|password)\s*[:=]\s*["\x27][^"\x27$][^"\x27]{6,}["\x27]' \
            . > potential-secrets.txt
          secret_scan_status=$?
          set -e

          if [ "$secret_scan_status" -eq 0 ]; then
            echo "⚠️ Potential exposed secrets found"
            cat potential-secrets.txt
          elif [ "$secret_scan_status" -eq 1 ]; then
            echo "✅ No obvious exposed secrets found"
          else
            echo "❌ Secret scan failed to execute (rg exit $secret_scan_status)"
            exit "$secret_scan_status"
          fi

          # Check for hard-coded non-local insecure production URLs
          echo ""
          echo "🔒 Checking for insecure URLs..."
          set +e
          rg -n -P \
            --glob '!**/dist/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/target/**' \
            --glob '!**/.git/**' \
            --glob '!**/src/tests/**' \
            --glob '!**/tests/**' \
            --glob '!**/__tests__/**' \
            --glob '!**/*.test.*' \
            --glob '!**/*.spec.*' \
            --glob '!lighthouse-config.json' \
            --glob '!**/lighthouserc.js' \
            --glob '!**/playwright.config.*' \
            --glob '!**/docker-compose*.yml' \
            '(?i)(url|origin|endpoint|base_?url|baseURL|target)\s*[:=].*http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|example\.com)' \
            . > insecure-urls.txt
          insecure_url_scan_status=$?
          set -e

          if [ "$insecure_url_scan_status" -eq 0 ]; then
            echo "⚠️ Found HTTP URLs in production code"
            cat insecure-urls.txt
          elif [ "$insecure_url_scan_status" -eq 1 ]; then
            echo "✅ No insecure URLs found"
          else
            echo "❌ Insecure URL scan failed to execute (rg exit $insecure_url_scan_status)"
            exit "$insecure_url_scan_status"
          fi

          if [ -s potential-secrets.txt ] || [ -s insecure-urls.txt ]; then
            echo "❌ Custom security checks found issues"
            exit 1
          fi

      - name: Upload security check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: custom-security-checks
          path: |
            potential-secrets.txt
            insecure-urls.txt
          retention-days: 30

  # ===== 安全报告 =====
  security-report:
    name: 📋 Security Report
    runs-on: ubuntu-latest
    needs: [codeql-scan, dependency-audit, custom-security-check]
    if: always()

    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL Scan**: ${{ needs.codeql-scan.result == 'success' && '✅ Passed' || needs.codeql-scan.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Audit**: ${{ needs.dependency-audit.result == 'success' && '✅ Passed' || needs.dependency-audit.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Security Checks**: ${{ needs.custom-security-check.result == 'success' && '✅ Passed' || needs.custom-security-check.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔍 Automated Security Features:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Dependabot**: Monitors dependency updates weekly" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **CodeQL**: Scans for code vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Dependency Audit**: Checks for vulnerable packages" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Secret Detection**: Prevents credential exposure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🛡️ Security Best Practices:" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Never commit secrets or API keys" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Keep dependencies updated regularly" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Review security alerts promptly" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Use HTTPS for all production URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**📊 Full reports available in workflow artifacts**" >> $GITHUB_STEP_SUMMARY
