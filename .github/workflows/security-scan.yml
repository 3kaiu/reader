# PR: dependency audit + custom rg checks only (faster). CodeQL runs on schedule + workflow_dispatch
# (and weekly schedule skips CodeQL for private repos — same as before).
name: 🔒 Nexus Security Scan & Audit

on:
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ===== 代码安全扫描（不在 PR 上运行，见文件头说明） =====
  codeql-scan:
    name: 🔍 CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' && (github.event_name != 'schedule' || github.repository_visibility == 'public')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, python, rust
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ===== 依赖安全审计 =====
  dependency-audit:
    name: 📦 Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache (api)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        id: cargo-audit-tool
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-v1

      - name: Install cargo-audit
        if: steps.cargo-audit-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        id: rust-audit
        working-directory: api
        run: |
          set +e
          cargo audit --format json > ../rust-audit-results.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Setup Nexus Web toolchain
        uses: ./.github/actions/web-quality
        with:
          bun-version: latest

      - name: Audit frontend dependencies
        id: frontend-audit
        working-directory: web
        run: |
          set +e
          bun audit --json > ../bun-audit-results.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Cache workers node_modules
        uses: actions/cache@v4
        id: workers-modules
        with:
          path: edge/node_modules
          key: ${{ runner.os }}-workers-npm-${{ hashFiles('edge/package.json') }}

      - name: Setup workers dependencies
        working-directory: edge
        run: npm install

      - name: Audit workers dependencies
        id: workers-audit
        working-directory: edge
        run: |
          set +e
          npm audit --json > ../npm-audit-results.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload audit results
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-results
          path: |
            rust-audit-results.json
            bun-audit-results.json
            npm-audit-results.json
          retention-days: 30

      - name: Summarize audit severities
        id: audit-summary
        run: |
          node <<'NODE'
          const fs = require('fs')

          function parseJson(path) {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'))
            } catch {
              return null
            }
          }

          function normalizeSeverity(raw) {
            if (!raw) return 'unknown'
            const s = String(raw).toLowerCase()
            if (s.includes('critical')) return 'critical'
            if (s.includes('high')) return 'high'
            if (s.includes('moderate') || s.includes('medium')) return 'moderate'
            if (s.includes('low')) return 'low'
            return 'unknown'
          }

          function bump(counter, severity) {
            counter[severity] = (counter[severity] || 0) + 1
          }

          function scoreToSeverity(score) {
            const n = Number(score)
            if (!Number.isFinite(n)) return 'unknown'
            if (n >= 9.0) return 'critical'
            if (n >= 7.0) return 'high'
            if (n >= 4.0) return 'moderate'
            if (n > 0) return 'low'
            return 'unknown'
          }

          const totals = { critical: 0, high: 0, moderate: 0, low: 0, unknown: 0 }

          const rust = parseJson('rust-audit-results.json')
          const rustList = rust?.vulnerabilities?.list
          if (Array.isArray(rustList)) {
            for (const item of rustList) {
              const advisory = item?.advisory || {}
              const sev =
                advisory.severity ||
                advisory.cvss?.severity ||
                scoreToSeverity(advisory.cvss?.score)
              bump(totals, normalizeSeverity(sev))
            }
          }

          const bun = parseJson('bun-audit-results.json')
          const bunVulns = bun?.vulnerabilities
          if (bunVulns && typeof bunVulns === 'object') {
            for (const vuln of Object.values(bunVulns)) {
              bump(totals, normalizeSeverity(vuln?.severity))
            }
          } else if (Array.isArray(bun?.advisories)) {
            for (const adv of bun.advisories) {
              bump(totals, normalizeSeverity(adv?.severity))
            }
          }

          const npm = parseJson('npm-audit-results.json')
          const npmVulns = npm?.vulnerabilities
          if (npmVulns && typeof npmVulns === 'object') {
            for (const vuln of Object.values(npmVulns)) {
              const severity = vuln?.severity
              const nodes = Array.isArray(vuln?.nodes) ? vuln.nodes.length : 1
              for (let i = 0; i < Math.max(nodes, 1); i++) {
                bump(totals, normalizeSeverity(severity))
              }
            }
          }

          const total =
            totals.critical + totals.high + totals.moderate + totals.low + totals.unknown
          const highCritical = totals.critical + totals.high

          const outputPath = process.env.GITHUB_OUTPUT
          const summaryPath = process.env.GITHUB_STEP_SUMMARY
          fs.appendFileSync(outputPath, `audit_total=${total}\n`)
          fs.appendFileSync(outputPath, `audit_high_critical=${highCritical}\n`)
          fs.appendFileSync(outputPath, `audit_counts=${JSON.stringify(totals)}\n`)

          fs.appendFileSync(summaryPath, '### Dependency Audit Severity Summary\n')
          fs.appendFileSync(
            summaryPath,
            `- Critical: ${totals.critical}, High: ${totals.high}, Moderate: ${totals.moderate}, Low: ${totals.low}, Unknown: ${totals.unknown}\n`
          )
          fs.appendFileSync(
            summaryPath,
            `- Gate policy: block on High/Critical; Moderate/Low are warnings.\n`
          )
          NODE

      - name: Enforce audit results
        run: |
          if [ ! -s rust-audit-results.json ]; then
            echo "❌ rust-audit-results.json is missing or empty"
            exit 1
          fi
          if [ ! -s bun-audit-results.json ]; then
            echo "❌ bun-audit-results.json is missing or empty"
            exit 1
          fi
          if [ ! -s npm-audit-results.json ]; then
            echo "❌ npm-audit-results.json is missing or empty"
            exit 1
          fi

          if [ "${{ steps.rust-audit.outputs.status }}" != "0" ]; then
            echo "ℹ️ cargo audit exited non-zero (likely vulnerabilities present); using severity gate for final decision"
          fi
          if [ "${{ steps.frontend-audit.outputs.status }}" != "0" ]; then
            echo "ℹ️ bun audit exited non-zero (likely vulnerabilities present); using severity gate for final decision"
          fi
          if [ "${{ steps.workers-audit.outputs.status }}" != "0" ]; then
            echo "ℹ️ npm audit exited non-zero (likely vulnerabilities present); using severity gate for final decision"
          fi

          if [ "${{ steps.audit-summary.outputs.audit_high_critical }}" != "0" ]; then
            echo "❌ High/Critical dependency vulnerabilities detected"
            exit 1
          fi

          if [ "${{ steps.audit-summary.outputs.audit_total }}" != "0" ]; then
            echo "⚠️ Moderate/Low dependency vulnerabilities detected; not blocking this workflow"
          else
            echo "✅ No dependency vulnerabilities detected"
          fi

  # ===== 自定义安全检查 =====
  custom-security-check:
    name: 🛡️ Custom Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run custom security checks
        run: |
          set -euo pipefail
          touch potential-secrets.txt insecure-urls.txt

          # Check for hard-coded secrets in non-test source files
          echo "🔍 Checking for potential secrets..."
          set +e
          rg -n -P \
            --glob '!**/dist/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/target/**' \
            --glob '!**/.git/**' \
            --glob '!**/src/tests/**' \
            --glob '!**/tests/**' \
            --glob '!**/__tests__/**' \
            --glob '!**/*.test.*' \
            --glob '!**/*.spec.*' \
            --glob '!**/.env.example' \
            --glob '!**/wrangler.toml' \
            '(?i)(api[_-]?key|auth[_-]?secret|client[_-]?secret|access[_-]?token|password)\s*[:=]\s*["\x27][^"\x27$][^"\x27]{6,}["\x27]' \
            . > potential-secrets.txt
          secret_scan_status=$?
          set -e

          if [ "$secret_scan_status" -eq 0 ]; then
            echo "⚠️ Potential exposed secrets found"
            cat potential-secrets.txt
          elif [ "$secret_scan_status" -eq 1 ]; then
            echo "✅ No obvious exposed secrets found"
          else
            echo "❌ Secret scan failed to execute (rg exit $secret_scan_status)"
            exit "$secret_scan_status"
          fi

          # Check for hard-coded non-local insecure production URLs
          echo ""
          echo "🔒 Checking for insecure URLs..."
          set +e
          rg -n -P \
            --glob '!**/dist/**' \
            --glob '!**/node_modules/**' \
            --glob '!**/target/**' \
            --glob '!**/.git/**' \
            --glob '!**/src/tests/**' \
            --glob '!**/tests/**' \
            --glob '!**/__tests__/**' \
            --glob '!**/*.test.*' \
            --glob '!**/*.spec.*' \
            --glob '!**/playwright.config.*' \
            --glob '!**/docker-compose*.yml' \
            '(?i)(url|origin|endpoint|base_?url|baseURL|target)\s*[:=].*http://(?!localhost|127\.0\.0\.1|0\.0\.0\.0|example\.com)' \
            . > insecure-urls.txt
          insecure_url_scan_status=$?
          set -e

          if [ "$insecure_url_scan_status" -eq 0 ]; then
            echo "⚠️ Found HTTP URLs in production code"
            cat insecure-urls.txt
          elif [ "$insecure_url_scan_status" -eq 1 ]; then
            echo "✅ No insecure URLs found"
          else
            echo "❌ Insecure URL scan failed to execute (rg exit $insecure_url_scan_status)"
            exit "$insecure_url_scan_status"
          fi

          if [ -s potential-secrets.txt ] || [ -s insecure-urls.txt ]; then
            echo "❌ Custom security checks found issues"
            exit 1
          fi

      - name: Upload security check results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: custom-security-checks
          path: |
            potential-secrets.txt
            insecure-urls.txt
          retention-days: 30

  # ===== 安全报告 =====
  security-report:
    name: 📋 Security Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [codeql-scan, dependency-audit, custom-security-check]
    if: always()

    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **CodeQL Scan**: ${{ needs.codeql-scan.result == 'success' && '✅ Passed' || needs.codeql-scan.result == 'failure' && '❌ Failed' || '⏭️ Skipped (PR runs audit + custom checks only; CodeQL on schedule/manual)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Audit**: ${{ needs.dependency-audit.result == 'success' && '✅ Passed' || needs.dependency-audit.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Security Checks**: ${{ needs.custom-security-check.result == 'success' && '✅ Passed' || needs.custom-security-check.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔍 Automated Security Features:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Dependabot**: Monitors dependency updates weekly" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **CodeQL**: Scans for code vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Dependency Audit**: Checks for vulnerable packages" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Secret Detection**: Prevents credential exposure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🛡️ Security Best Practices:" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Never commit secrets or API keys" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Keep dependencies updated regularly" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Review security alerts promptly" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Use HTTPS for all production URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**📊 Full reports available in workflow artifacts**" >> $GITHUB_STEP_SUMMARY
