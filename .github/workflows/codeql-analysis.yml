name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 2 * * 1'  # Weekly on Monday at 2:30 AM UTC

jobs:
  analyze-typescript:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Install dependencies
      working-directory: ./nexus-reader
      run: bun install --frozen-lockfile

    - name: Build TypeScript project
      working-directory: ./nexus-reader
      run: bun run build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    - name: Install Python dependencies
      working-directory: ./cf-bypass-service
      run: |
        uv sync --frozen

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp
        queries: security-extended,security-and-quality

    - name: Build Rust project
      working-directory: ./nexus-lite
      run: |
        cargo build --release

    - name: Run Clippy security analysis
      working-directory: ./nexus-lite
      run: |
        cargo clippy --all-targets --all-features -- -D warnings -D clippy::security

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:cpp"

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [analyze-typescript, analyze-python, analyze-rust]
    if: always()
    permissions:
      contents: read
      security-events: read
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate Security Summary
      run: |
        echo "# Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "- TypeScript Analysis: ${{ needs.analyze-typescript.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Python Analysis: ${{ needs.analyze-python.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Rust Analysis: ${{ needs.analyze-rust.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Security Features Enabled" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Automated dependency scanning" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Multi-language security analysis" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Extended security queries" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Weekly scheduled scans" >> $GITHUB_STEP_SUMMARY