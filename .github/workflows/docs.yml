name: Generate Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'nexus-reader/src/**'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: nexus-reader
        run: bun install --frozen-lockfile

      - name: Generate TypeDoc
        working-directory: nexus-reader
        run: |
          mkdir -p ../docs/api
          bunx typedoc src --out ../docs/api --theme default --readme none || true

      - name: Build documentation site
        run: |
          # 创建文档首页
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Nexus Reader Docs</title>
              <style>
                  body { font-family: system-ui; max-width: 800px; margin: 50px auto; padding: 20px; }
                  h1 { color: #667eea; }
                  a { color: #667eea; }
                  .links { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
                  .link { padding: 15px 25px; background: #f5f5f5; border-radius: 8px; text-decoration: none; }
                  .link:hover { background: #e5e5e5; }
              </style>
          </head>
          <body>
              <h1>📚 Nexus Reader Documentation</h1>
              <p>现代化个人云阅读平台</p>
              <div class="links">
                  <a href="api/index.html" class="link">📋 API 文档</a>
                  <a href="https://github.com/${{ github.repository }}" class="link">🔗 GitHub</a>
                  <a href="https://nexus-reader.pages.dev" class="link">🌐 在线演示</a>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
