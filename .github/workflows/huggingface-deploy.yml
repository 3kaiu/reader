name: 🚀 Deploy to HuggingFace Spaces

on:
  push:
    branches: [main]
    paths:
      - 'nexus-lite/**'
      - '.github/workflows/huggingface-deploy.yml'
  workflow_dispatch:
    inputs:
      space_name:
        description: 'HuggingFace Space name'
        required: false
        default: 'nexus-lite'
        type: string
      force_rebuild:
        description: 'Force rebuild even if no changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-nexus-lite:
    name: 🚀 Deploy Nexus-Lite to HF Spaces
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.force_rebuild == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Validate HF Token
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "❌ HF_TOKEN secret is not configured"
            echo "📖 Please add HF_TOKEN to GitHub repository secrets"
            echo "🔗 Get token from: https://huggingface.co/settings/tokens"
            exit 1
          fi
          echo "✅ HF_TOKEN is configured"

      - name: Deploy to HuggingFace Spaces
        run: |
          python << 'EOF'
          import os
          import shutil
          import time
          from huggingface_hub import HfApi, create_repo, repo_exists

          token = os.environ["HF_TOKEN"]
          space_short_name = "${{ github.event.inputs.space_name || vars.HF_SPACE_NEXUS_LITE || 'nexus-lite' }}"

          # 初始化API并获取用户信息
          api = HfApi(token=token)
          user_info = api.whoami()
          username = user_info["name"]

          # 构建完整的repo ID
          space_name = f"{username}/{space_short_name}"

          print(f"🚀 Deploying Nexus-Lite to HuggingFace Space: {space_name}")
          print(f"👤 Username: {username}")
          print(f"📦 Space: {space_short_name}")

          # 检查并创建Space
          try:
              # 尝试获取space信息来检查是否存在
              space_info = api.space_info(space_name, token=token)
              print(f"✅ Space {space_name} already exists")
              print(f"   Status: {space_info.status}")
              print(f"   SDK: {space_info.sdk}")
          except Exception as e:
              if "404" in str(e) or "Not Found" in str(e):
                  print(f"📝 Creating new HuggingFace Space: {space_name}")
                  try:
                      create_repo(
                          space_name,  # 使用完整的 repo_id 格式
                          repo_type="space",
                          space_sdk="docker",
                          token=token,
                          private=False
                      )
                      print("✅ Space created successfully")
                      print("⏳ Waiting for space initialization...")
                      time.sleep(15)  # 等待空间初始化
                  except Exception as create_error:
                      if "409" in str(create_error):
                          print(f"ℹ️ Space {space_name} already exists (created via web interface)")
                          print("✅ Proceeding with deployment...")
                      else:
                          print(f"❌ Failed to create space: {create_error}")
                          print("💡 Possible causes:")
                          print("   - Invalid HF_TOKEN")
                          print("   - Insufficient permissions")
                          print("   - Rate limiting")
                          raise create_error
              else:
                  print(f"❌ Unexpected error checking space: {e}")
                  raise e

          # 准备上传目录
          source_dir = "nexus-lite"
          upload_dir = "hf-deploy"

          if os.path.exists(upload_dir):
              shutil.rmtree(upload_dir)

          print(f"📁 Copying {source_dir} to {upload_dir}")
          shutil.copytree(source_dir, upload_dir, dirs_exist_ok=True)

          # 确保README.md存在
          readme_path = os.path.join(upload_dir, "README.md")
          if not os.path.exists(readme_path):
              print("📝 Creating README.md for HuggingFace Space")
              readme_content = """---
          title: Nexus-Lite
          emoji: 📖
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_file: Dockerfile
          pinned: false
          ---

          # Nexus-Lite

          A lightweight, plugin-based book source aggregation engine for Chinese web novels.

          ## Features

          - 🚀 High-performance Rust backend
          - 📚 Multi-source book aggregation
          - 🔍 Intelligent search
          - 🌐 RESTful API
          - 🐳 Docker deployment

          ## API Endpoints

          - `GET /health` - Health check
          - `GET /sources` - List available sources
          - `GET /search` - Search books
          - `GET /book/{id}` - Get book details
          """
              with open(readme_path, "w", encoding="utf-8") as f:
                  f.write(readme_content)

          # 上传到HuggingFace Spaces
          print("📤 Uploading files to HuggingFace Spaces...")
          max_retries = 3
          for attempt in range(max_retries):
              try:
                  api.upload_folder(
                      folder_path=upload_dir,
                      repo_id=space_name,
                      repo_type="space",
                      commit_message=f"Deploy Nexus-Lite from {os.environ.get('GITHUB_SHA', 'unknown')[:8]}"
                  )
                  print("✅ Successfully uploaded to HuggingFace Spaces")
                  break
              except Exception as e:
                  if attempt < max_retries - 1:
                      print(f"⚠️ Upload attempt {attempt + 1} failed: {e}")
                      print(f"⏳ Retrying in 10 seconds... ({attempt + 2}/{max_retries})")
                      time.sleep(10)
                  else:
                      print(f"❌ Upload failed after {max_retries} attempts: {e}")
                      print("💡 Possible causes:")
                      print("   - Space not fully initialized")
                      print("   - Network issues")
                      print("   - Token permissions")
                      raise e

          # 构建访问URL
          space_url = f"https://huggingface.co/spaces/{space_name}"
          api_url = f"https://{space_name.replace('/', '-')}.hf.space"

          print(f"🌐 Space URL: {space_url}")
          print(f"🚀 API URL: {api_url}")
          print(f"🔍 Build Status: {space_url}/build")
          print(f"📊 Space Info: {space_url}/info")

          # 设置 GitHub 环境变量供后续步骤使用
          print(f"::set-output name=space_url::{space_url}")
          print(f"::set-output name=api_url::{api_url}")
          print(f"::set-output name=username::{username}")
          print(f"::set-output name=space_name::{space_short_name}")

          # 设置环境变量供后续 workflow 步骤使用
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f"STEP_SUMMARY_SPACE_URL={space_url}\n")
              env_file.write(f"STEP_SUMMARY_API_URL={api_url}\n")

          # 清理临时文件
          shutil.rmtree(upload_dir)
          print("🧹 Cleaned up temporary files")
          EOF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Post-deployment notification
        if: success()
        run: |
          echo "## 🚀 HuggingFace Spaces Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployed Services:" >> $GITHUB_STEP_SUMMARY
          echo "- **Nexus-Lite**: 高性能 Rust 后端 API 服务" >> $GITHUB_STEP_SUMMARY
          echo "- **技术栈**: Docker + Rust + Axum + Tokio" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access URLs:" >> $GITHUB_STEP_SUMMARY
          echo "- **Space 主页**: \`$STEP_SUMMARY_SPACE_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API 端点**: \`$STEP_SUMMARY_API_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛠️ API Endpoints:" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /health\` - 服务健康检查" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /sources\` - 获取可用书源" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /search?q=关键词\` - 搜索书籍" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /book/{id}\` - 获取书籍详情" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Info:" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. **测试 API**: 访问上面的 API 端点验证服务" >> $GITHUB_STEP_SUMMARY
          echo "2. **查看日志**: 在 Space 页面查看构建和运行日志" >> $GITHUB_STEP_SUMMARY
          echo "3. **监控状态**: 检查 Space 的运行状态和资源使用" >> $GITHUB_STEP_SUMMARY

  # ===== 自动同步设置指南 =====
  setup-autosync:
    name: 📋 HuggingFace Auto-Sync Setup Guide
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Auto-Sync Setup Instructions
        run: |
          echo "## 🔄 HuggingFace Spaces 自动同步设置指南" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 方法1: 直接连接 GitHub (推荐)" >> $GITHUB_STEP_SUMMARY
          echo "1. 访问你的 HuggingFace Space: https://huggingface.co/spaces/\${USERNAME}/\${SPACE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "2. 点击 **Settings** 标签页" >> $GITHUB_STEP_SUMMARY
          echo "3. 找到 **GitHub** 部分" >> $GITHUB_STEP_SUMMARY
          echo "4. 连接到此仓库: \`3kaiu/reader\`" >> $GITHUB_STEP_SUMMARY
          echo "5. 设置分支: \`main\` 和路径: \`nexus-lite/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 方法2: Webhook 触发" >> $GITHUB_STEP_SUMMARY
          echo "保持当前 workflow，每次推送 \`nexus-lite/\` 路径时自动部署" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 所需 Secrets:" >> $GITHUB_STEP_SUMMARY
          echo "- \`HF_TOKEN\`: HuggingFace API Token" >> $GITHUB_STEP_SUMMARY
          echo "- \`HF_USERNAME\`: 你的 HuggingFace 用户名 (可选)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 环境变量 (可选):" >> $GITHUB_STEP_SUMMARY
          echo "- \`HF_SPACE_NEXUS_LITE\`: 自定义 Space 名称" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**设置完成后，每次推送代码都会自动更新 HuggingFace Space！** 🎉" >> $GITHUB_STEP_SUMMARY