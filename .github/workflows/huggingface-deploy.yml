# Optional: push the Nexus API workspace to a HuggingFace Docker Space. Default backend path: GHCR + NAS.
name: Deploy Nexus API to HuggingFace Space

on:
  workflow_dispatch:
    inputs:
      space_name:
        description: 'HuggingFace Space name for Nexus API (under your account)'
        required: false
        default: 'nexus-lite'
        type: string

concurrency:
  group: huggingface-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Upload Space
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install huggingface_hub

      - name: Require HF_TOKEN
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "Add repository secret HF_TOKEN (https://huggingface.co/settings/tokens)"
            exit 1
          fi

      - name: Create Space if needed and upload
        id: upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ github.event.inputs.space_name || vars.HF_SPACE_NEXUS_LITE || 'nexus-lite' }}
        run: |
          python << 'EOF'
          import os, shutil, time
          from huggingface_hub import HfApi, create_repo, repo_exists

          token = os.environ['HF_TOKEN']
          space_short = os.environ.get('HF_SPACE_NAME', 'nexus-lite').strip() or 'nexus-lite'
          api = HfApi(token=token)
          user = api.whoami()['name']
          repo_id = f'{user}/{space_short}'

          if not repo_exists(repo_id, repo_type='space', token=token):
              create_repo(repo_id, repo_type='space', space_sdk='docker', token=token)
              time.sleep(8)

          upload = 'hf-deploy'
          if os.path.isdir(upload):
              shutil.rmtree(upload)
          shutil.copytree('nexus-lite', upload, dirs_exist_ok=True)

          readme = os.path.join(upload, 'README.md')
          if not os.path.isfile(readme):
              with open(readme, 'w', encoding='utf-8') as f:
                  f.write('''---
          title: Nexus API
          emoji: book
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_file: Dockerfile
          pinned: false
          ---

          # Nexus API

          Rust backend for Nexus. See repo for API docs.
          ''')

          sha = os.environ.get('GITHUB_SHA', '')[:8]
          for attempt in range(3):
              try:
                  api.upload_folder(
                      upload,
                      repo_id,
                      repo_type='space',
                      commit_message=f'Deploy Nexus API {sha or "manual"}',
                  )
                  break
              except Exception as e:
                  if attempt == 2:
                      raise
                  print(f'upload retry {attempt + 2}/3: {e}')
                  time.sleep(10)

          shutil.rmtree(upload)
          space_url = f'https://huggingface.co/spaces/{repo_id}'
          api_url = f'https://{repo_id.replace("/", "-")}.hf.space'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as o:
              o.write(f'space_url={space_url}\n')
              o.write(f'api_url={api_url}\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as e:
              e.write(f'HF_SPACE_URL={space_url}\n')
              e.write(f'HF_API_URL={api_url}\n')
          print(space_url, api_url)
          EOF

      - name: Summary
        if: success()
        run: |
          echo "## HuggingFace Space" >> "$GITHUB_STEP_SUMMARY"
          echo "- Space: ${{ steps.upload.outputs.space_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API (after build): ${{ steps.upload.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Optional: in Space **Settings**, connect GitHub to this repo and path \`nexus-lite/\` for auto-sync." >> "$GITHUB_STEP_SUMMARY"
