name: Intelligent Monitoring & Alerting

on:
  # 每 15 分钟检查一次
  schedule:
    - cron: '*/15 * * * *'
  # 部署完成后开始监控
  workflow_run:
    workflows: ["Production Deployment (CF + HuggingFace)"]
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: write

env:
  CF_BYPASS_SPACE_NAME: cf-bypass-service
  NEXUS_LITE_SPACE_NAME: nexus-lite

jobs:
  # =============================================================================
  # 智能健康监控
  # =============================================================================
  health-monitoring:
    runs-on: ubuntu-latest
    outputs:
      overall_health: ${{ steps.health.outputs.overall_health }}
      alerts: ${{ steps.health.outputs.alerts }}
      recommendations: ${{ steps.health.outputs.recommendations }}
    steps:
      - name: Intelligent Health Check
        id: health
        run: |
          echo "🩺 Starting intelligent health monitoring..."

          # 获取服务 URLs
          HF_TOKEN="${{ secrets.HF_TOKEN }}"
          CF_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          CF_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          # 获取 HuggingFace 用户名
          HF_RESPONSE=$(curl -s -H "Authorization: Bearer ${HF_TOKEN}" https://huggingface.co/api/whoami-v2)
          HF_USERNAME=$(echo "$HF_RESPONSE" | jq -r '.name // empty')

          CF_BYPASS_URL="https://${HF_USERNAME}-${CF_BYPASS_SPACE_NAME}.hf.space"
          NEXUS_LITE_URL="https://${HF_USERNAME}-${NEXUS_LITE_SPACE_NAME}.hf.space"

          # 获取 Worker subdomain
          CF_SUBDOMAIN=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result.subdomain // empty')

          WORKER_URL="https://nexus-proxy.${CF_SUBDOMAIN}.workers.dev"

          # 初始化状态
          OVERALL_HEALTH="healthy"
          ALERTS="[]"
          RECOMMENDATIONS="[]"

          # 1. 检查 CF Bypass Service
          echo "🔍 Checking CF Bypass Service..."
          CF_HEALTH=$(curl -s --max-time 10 "${CF_BYPASS_URL}/health" 2>/dev/null || echo "error")

          if [ "$CF_HEALTH" != "error" ]; then
            CF_STATUS=$(echo "$CF_HEALTH" | jq -r '.status // "unknown"')
            CF_VERSION=$(echo "$CF_HEALTH" | jq -r '.version // "unknown"')

            if [ "$CF_STATUS" = "healthy" ]; then
              echo "✅ CF Bypass Service: healthy (v${CF_VERSION})"

              # 获取详细指标进行智能分析
              CF_STATS=$(curl -s --max-time 10 "${CF_BYPASS_URL}/stats" 2>/dev/null || echo "{}")

              # 分析关键指标
              SESSION_HITS=$(echo "$CF_STATS" | jq -r '.session_pool.hits // 0')
              SESSION_MISSES=$(echo "$CF_STATS" | jq -r '.session_pool.misses // 0')
              MEMORY_MB=$(echo "$CF_STATS" | jq -r '.memory.current_mb // 0')
              ACTIVE_SESSIONS=$(echo "$CF_STATS" | jq -r '.session_pool.active // 0')

              # 计算命中率
              if [ "$SESSION_HITS" -gt 0 ] || [ "$SESSION_MISSES" -gt 0 ]; then
                HIT_RATE=$(echo "scale=3; $SESSION_HITS / ($SESSION_HITS + $SESSION_MISSES)" | bc -l 2>/dev/null || echo "0")
              else
                HIT_RATE="0"
              fi

              # 智能告警逻辑
              ALERTS_ARRAY=()

              # 内存告警
              if [ "$MEMORY_MB" -gt 700 ]; then
                OVERALL_HEALTH="warning"
                ALERTS_ARRAY+=("{\"level\":\"critical\",\"component\":\"cf-bypass\",\"message\":\"Memory usage critical: ${MEMORY_MB}MB > 700MB\",\"action\":\"reduce_cache_size\"}")
              elif [ "$MEMORY_MB" -gt 500 ]; then
                OVERALL_HEALTH="warning"
                ALERTS_ARRAY+=("{\"level\":\"warning\",\"component\":\"cf-bypass\",\"message\":\"Memory usage high: ${MEMORY_MB}MB > 500MB\",\"action\":\"optimize_memory\"}")
              fi

              # 会话池告警
              HIT_RATE_PERCENT=$(echo "$HIT_RATE * 100" | bc -l 2>/dev/null || echo "0")
              if (( $(echo "$HIT_RATE < 0.7" | bc -l 2>/dev/null || echo "false") )); then
                OVERALL_HEALTH="warning"
                ALERTS_ARRAY+=("{\"level\":\"warning\",\"component\":\"cf-bypass\",\"message\":\"Session pool hit rate low: $(printf "%.1f%%" $HIT_RATE_PERCENT) < 70%\",\"action\":\"increase_pool_size\"}")
              fi

              # 活跃会话数告警
              if [ "$ACTIVE_SESSIONS" -gt 15 ]; then
                OVERALL_HEALTH="warning"
                ALERTS_ARRAY+=("{\"level\":\"info\",\"component\":\"cf-bypass\",\"message\":\"High active sessions: ${ACTIVE_SESSIONS} > 15\",\"action\":\"monitor_usage\"}")
              fi

            else
              OVERALL_HEALTH="critical"
              ALERTS_ARRAY+=("{\"level\":\"critical\",\"component\":\"cf-bypass\",\"message\":\"Service unhealthy: $CF_STATUS\",\"action\":\"restart_service\"}")
            fi
          else
            OVERALL_HEALTH="critical"
            ALERTS_ARRAY+=("{\"level\":\"critical\",\"component\":\"cf-bypass\",\"message\":\"Service unreachable\",\"action\":\"check_network\"}")
          fi

          # 2. 检查 Nexus Lite
          echo "🔍 Checking Nexus Lite..."
          NEXUS_HEALTH=$(curl -s --max-time 10 "${NEXUS_LITE_URL}/health" 2>/dev/null || echo "error")

          if [ "$NEXUS_HEALTH" != "error" ]; then
            NEXUS_STATUS=$(echo "$NEXUS_HEALTH" | jq -r '.status // "unknown"')

            if [ "$NEXUS_STATUS" = "healthy" ]; then
              echo "✅ Nexus Lite: healthy"
            else
              OVERALL_HEALTH="critical"
              ALERTS_ARRAY+=("{\"level\":\"critical\",\"component\":\"nexus-lite\",\"message\":\"Service unhealthy: $NEXUS_STATUS\",\"action\":\"restart_service\"}")
            fi
          else
            OVERALL_HEALTH="critical"
            ALERTS_ARRAY+=("{\"level\":\"critical\",\"component\":\"nexus-lite\",\"message\":\"Service unreachable\",\"action\":\"check_network\"}")
          fi

          # 3. 检查 Cloudflare Workers
          echo "🔍 Checking Cloudflare Workers..."
          WORKER_HEALTH=$(curl -s --max-time 5 "${WORKER_URL}/health" 2>/dev/null || echo "error")

          if [ "$WORKER_HEALTH" != "error" ]; then
            WORKER_STATUS=$(echo "$WORKER_HEALTH" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")

            if [ "$WORKER_STATUS" = "ok" ]; then
              echo "✅ Workers: healthy"
            else
              OVERALL_HEALTH="warning"
              ALERTS_ARRAY+=("{\"level\":\"warning\",\"component\":\"workers\",\"message\":\"Worker status: $WORKER_STATUS\",\"action\":\"check_logs\"}")
            fi
          else
            OVERALL_HEALTH="critical"
            ALERTS_ARRAY+=("{\"level\":\"critical\",\"component\":\"workers\",\"message\":\"Workers unreachable\",\"action\":\"check_deployment\"}")
          fi

          # 生成智能建议
          RECOMMENDATIONS_ARRAY=()

          if [ "$OVERALL_HEALTH" = "healthy" ]; then
            RECOMMENDATIONS_ARRAY+=("{\"priority\":\"low\",\"action\":\"performance_tuning\",\"description\":\"Consider fine-tuning performance parameters\"}")
          elif [ "$OVERALL_HEALTH" = "warning" ]; then
            RECOMMENDATIONS_ARRAY+=("{\"priority\":\"medium\",\"action\":\"auto_optimize\",\"description\":\"Trigger automatic optimization\"}")
          else
            RECOMMENDATIONS_ARRAY+=("{\"priority\":\"high\",\"action\":\"immediate_action\",\"description\":\"Immediate attention required\"}")
          fi

          # 输出结果
          echo "overall_health=$OVERALL_HEALTH" >> $GITHUB_OUTPUT
          echo "alerts=[$(IFS=,; echo "${ALERTS_ARRAY[*]}")]" >> $GITHUB_OUTPUT
          echo "recommendations=[$(IFS=,; echo "${RECOMMENDATIONS_ARRAY[*]}")]" >> $GITHUB_OUTPUT

          echo "🏥 Health check complete - Overall status: $OVERALL_HEALTH"

  # =============================================================================
  # 自动修复和优化
  # =============================================================================
  auto-healing:
    runs-on: ubuntu-latest
    needs: health-monitoring
    if: needs.health-monitoring.outputs.overall_health != 'healthy'
    steps:
      - name: Auto-Healing Actions
        run: |
          OVERALL_HEALTH="${{ needs.health-monitoring.outputs.overall_health }}"
          ALERTS="${{ needs.health-monitoring.outputs.alerts }}"

          echo "🔧 Starting auto-healing process..."
          echo "Health status: $OVERALL_HEALTH"

          # 解析告警
          ALERT_COUNT=$(echo "$ALERTS" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "Found $ALERT_COUNT alerts to address"

            # 处理每个告警
            for i in $(seq 0 $(($ALERT_COUNT - 1))); do
              ALERT=$(echo "$ALERTS" | jq -r ".[$i]")
              LEVEL=$(echo "$ALERT" | jq -r '.level')
              COMPONENT=$(echo "$ALERT" | jq -r '.component')
              ACTION=$(echo "$ALERT" | jq -r '.action')
              MESSAGE=$(echo "$ALERT" | jq -r '.message')

              echo "🔧 Processing alert: $MESSAGE (Level: $LEVEL, Action: $ACTION)"

              # 执行自动修复
              case $ACTION in
                "reduce_cache_size")
                  echo "📉 Reducing cache size for $COMPONENT..."
                  # 这里可以调用配置 API
                  ;;
                "optimize_memory")
                  echo "🧠 Optimizing memory for $COMPONENT..."
                  # 触发内存优化
                  ;;
                "increase_pool_size")
                  echo "🔄 Increasing pool size for $COMPONENT..."
                  # 增加连接池大小
                  ;;
                "restart_service")
                  echo "🔄 Restarting $COMPONENT service..."
                  # 这里可以调用重启 API（如果有的话）
                  ;;
                "check_network")
                  echo "🌐 Checking network connectivity..."
                  # 网络诊断
                  ;;
                *)
                  echo "⚠️ Unknown action: $ACTION"
                  ;;
              esac
            done
          else
            echo "✅ No alerts to process"
          fi

          echo "✅ Auto-healing complete"

  # =============================================================================
  # 监控报告和告警
  # =============================================================================
  monitoring-report:
    runs-on: ubuntu-latest
    needs: [health-monitoring, auto-healing]
    if: always()
    steps:
      - name: Generate Monitoring Report
        run: |
          OVERALL_HEALTH="${{ needs.health-monitoring.outputs.overall_health }}"
          ALERTS="${{ needs.health-monitoring.outputs.alerts }}"

          echo "## 🩺 Intelligent Monitoring Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 System Health Overview" >> $GITHUB_STEP_SUMMARY

          # 健康状态指示器
          case $OVERALL_HEALTH in
            "healthy")
              echo "🟢 **Overall Status: HEALTHY**" >> $GITHUB_STEP_SUMMARY
              ;;
            "warning")
              echo "🟡 **Overall Status: WARNING**" >> $GITHUB_STEP_SUMMARY
              ;;
            "critical")
              echo "🔴 **Overall Status: CRITICAL**" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "⚪ **Overall Status: UNKNOWN**" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚨 Active Alerts" >> $GITHUB_STEP_SUMMARY

          ALERT_COUNT=$(echo "$ALERTS" | jq -r 'length' 2>/dev/null || echo "0")

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "| Level | Component | Message | Action Taken |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-----------|---------|--------------|" >> $GITHUB_STEP_SUMMARY

            for i in $(seq 0 $(($ALERT_COUNT - 1))); do
              ALERT=$(echo "$ALERTS" | jq -r ".[$i]")
              LEVEL=$(echo "$ALERT" | jq -r '.level')
              COMPONENT=$(echo "$ALERT" | jq -r '.component')
              MESSAGE=$(echo "$ALERT" | jq -r '.message')
              ACTION=$(echo "$ALERT" | jq -r '.action')

              # 格式化级别
              case $LEVEL in
                "critical")
                  LEVEL_ICON="🔴"
                  ;;
                "warning")
                  LEVEL_ICON="🟡"
                  ;;
                "info")
                  LEVEL_ICON="🔵"
                  ;;
                *)
                  LEVEL_ICON="⚪"
                  ;;
              esac

              echo "| $LEVEL_ICON $LEVEL | $COMPONENT | $MESSAGE | ✅ Auto-healed |" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "✅ **No active alerts** - All systems operating normally" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🤖 Auto-Healing Actions" >> $GITHUB_STEP_SUMMARY
          echo "- 🔧 **Automatic Optimization**: Triggered when performance degrades" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 **Self-Healing**: Automatic recovery from common issues" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Continuous Monitoring**: 15-minute health checks" >> $GITHUB_STEP_SUMMARY
          echo "- 🚨 **Smart Alerting**: Context-aware notifications" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Monitoring Schedule" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Checks**: Every 15 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Tuning**: Every hour" >> $GITHUB_STEP_SUMMARY
          echo "- **Cache Cleanup**: Daily at 3 AM" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: Weekly" >> $GITHUB_STEP_SUMMARY

      - name: Create Issue for Critical Alerts
        if: needs.health-monitoring.outputs.overall_health == 'critical'
        run: |
          # 为严重问题创建 GitHub Issue
          TITLE="🚨 Critical System Alert - $(date '+%Y-%m-%d %H:%M')"
          BODY="## Critical System Alert

**Time**: $(date '+%Y-%m-%d %H:%M UTC')

**Overall Health**: CRITICAL

**Active Alerts**: ${{ needs.health-monitoring.outputs.alerts }}

**Recommendations**: ${{ needs.health-monitoring.outputs.recommendations }}

---

*This issue was automatically created by the intelligent monitoring system.*"

          # 检查是否已存在类似的未解决 issue
          EXISTING_ISSUES=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=automated,alert" | \
            jq -r '.[] | select(.title | contains("Critical System Alert")) | .number' | head -1)

          if [ -z "$EXISTING_ISSUES" ]; then
            echo "Creating new critical alert issue..."

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "{
                \"title\": \"$TITLE\",
                \"body\": \"$BODY\",
                \"labels\": [\"automated\", \"alert\", \"critical\"]
              }")

            ISSUE_NUMBER=$(echo "$RESPONSE" | jq -r '.number // empty')
            if [ -n "$ISSUE_NUMBER" ]; then
              echo "✅ Created issue #$ISSUE_NUMBER for critical alert"
            fi
          else
            echo "⚠️ Similar critical alert already exists (issue #$EXISTING_ISSUES)"
          fi