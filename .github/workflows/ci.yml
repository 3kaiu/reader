name: Nexus CI

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      contracts: ${{ steps.filter.outputs.contracts }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      edge: ${{ steps.filter.outputs.edge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
              - '.github/actions/**'
            contracts:
              - 'contracts/**'
              - 'scripts/validate-contracts.mjs'
              - 'scripts/generate-http-route-constants.mjs'
            web:
              - 'web/**'
              - 'contracts/**'
              - 'scripts/validate-contracts.mjs'
            api:
              - 'api/**'
              - 'contracts/**'
              - 'scripts/validate-contracts.mjs'
            edge:
              - 'edge/**'
              - 'contracts/**'
              - 'scripts/validate-contracts.mjs'

  workflow-quality:
    name: Workflow Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1

  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.contracts == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate route contracts
        run: node scripts/validate-contracts.mjs

  frontend-quality:
    name: Nexus Web Type Check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Nexus Web type check
        uses: ./.github/actions/web-quality
        with:
          bun-version: ${{ env.BUN_VERSION }}
          run-type-check: "true"
          run-tests: "true"

  backend-quality:
    name: Nexus API Cargo Check + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run cargo check
        uses: ./.github/actions/api-quality
        with:
          run-check: "true"
          run-tests: "true"

  workers-quality:
    name: Nexus Edge Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.edge == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Nexus Edge type check
        uses: ./.github/actions/edge-quality
