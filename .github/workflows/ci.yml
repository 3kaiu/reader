name: Nexus CI

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1"

jobs:
  workflow-quality:
    name: Workflow Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1

  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify generated route constants match contract
        run: node scripts/generate-http-route-constants.mjs --check

      - name: Validate route contracts
        run: node scripts/validate-contracts.mjs

  frontend-quality:
    name: Nexus Web Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Nexus Web type check
        uses: ./.github/actions/web-quality
        with:
          bun-version: ${{ env.BUN_VERSION }}
          run-type-check: "true"

  backend-quality:
    name: Nexus API Cargo Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run cargo check
        uses: ./.github/actions/api-quality
        with:
          run-check: "true"

  workers-quality:
    name: Nexus Edge Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Nexus Edge type check
        uses: ./.github/actions/edge-quality
        with:
          bun-version: ${{ env.BUN_VERSION }}
