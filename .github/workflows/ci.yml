name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1"

jobs:
  workflow-quality:
    name: Workflow Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1

  validate-contracts:
    name: Validate Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate route contracts
        run: node scripts/validate-contracts.mjs

      - name: Run repository hygiene checks
        run: node scripts/repo-hygiene-check.mjs

      - name: Guard CF bypass runtime boundaries
        run: node scripts/cf-bypass-runtime-guard.mjs

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run frontend lint and type check
        uses: ./.github/actions/nexus-reader-quality
        with:
          bun-version: ${{ env.BUN_VERSION }}
          run-lint: "true"
          run-type-check: "true"

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run cargo check
        uses: ./.github/actions/nexus-lite-quality
        with:
          run-fmt: "true"
          run-check: "true"
          run-clippy: "true"

  workers-quality:
    name: Workers Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Cloudflare Workers type check
        uses: ./.github/actions/cloudflare-workers-quality
        with:
          bun-version: ${{ env.BUN_VERSION }}

  backend-tests:
    name: Backend Cargo Test
    runs-on: ubuntu-latest
    needs:
      - backend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run cargo test
        uses: ./.github/actions/nexus-lite-quality
        with:
          run-tests: "true"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs:
      - frontend-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run frontend tests
        uses: ./.github/actions/nexus-reader-quality
        with:
          bun-version: ${{ env.BUN_VERSION }}
          run-tests: "true"
