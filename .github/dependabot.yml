version: 2
updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/nexus-lite"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python dependencies (uv/pip)
  - package-ecosystem: "pip"
    directory: "/cf-bypass-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Frontend dependencies (bun/npm)
  - package-ecosystem: "npm"
    directory: "/nexus-reader"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
