name: Nexus Edge Quality
description: Install dependencies required for the edge workspace and run its type check.

inputs:
  bun-version:
    description: Bun version to install for the Nexus Web toolchain.
    required: false
    default: "1"
  working-directory:
    description: Path to the edge workspace.
    required: false
    default: edge

runs:
  using: composite
  steps:
    - name: Install Nexus Web toolchain
      uses: ./.github/actions/web-quality
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Workers node_modules
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-workers-nm-${{ hashFiles(format('{0}/package.json', inputs.working-directory)) }}

    - name: Install edge dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm install

    - name: Run Nexus Edge type check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run type-check
