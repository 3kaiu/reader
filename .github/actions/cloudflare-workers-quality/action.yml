name: Cloudflare Workers Quality
description: Install dependencies required for cloudflare-workers and run its type check.

inputs:
  bun-version:
    description: Bun version to install for the nexus-reader workspace.
    required: false
    default: "1"
  working-directory:
    description: Path to the cloudflare-workers workspace.
    required: false
    default: cloudflare-workers

runs:
  using: composite
  steps:
    - name: Install frontend toolchain
      uses: ./.github/actions/nexus-reader-quality
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Workers node_modules
      uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-workers-nm-${{ hashFiles(format('{0}/package.json', inputs.working-directory)) }}

    - name: Install Cloudflare Workers dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm install

    - name: Run Cloudflare Workers type check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm run type-check
