[project]
name = "bypass-service"
version = "0.1.0"
description = "CF bypass service — handles anti-bot Cloudflare challenges for Nexus Reader content fetching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudscraper>=1.2.70,<2",
    "curl-cffi>=0.7.0,<1",
    "fastapi>=0.104.0,<1",
    "playwright>=1.40.0,<2",
    "pydantic>=2.5.0,<3",
    "uvicorn>=0.24.0,<1",
    # Security pins for transitive dependencies (Dependabot)
    "requests>=2.32.0,<3",
    "urllib3>=2.7.0,<3",
    "idna>=3.7,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.0.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.21.0",
]
