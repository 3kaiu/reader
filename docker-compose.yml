# Nexus Reader — Docker deployment (NAS / any Docker host)
#
# Core images (nexus-server, frontend) are pulled from GHCR.
# Python sidecars (bypass, ai-inference) are built locally — fast, no compilation.
#
# One-time:
#   1. Replace YOUR_GITHUB_USER below with your GitHub username (lowercase)
#   2. mkdir -p data sources && copy your .nxs sources into sources/
#   3. If the GHCR package is private: docker login ghcr.io
#   4. docker compose up -d
#
# Access: http://<nas-ip>:8080

services:
  nexus-server:
    image: ghcr.io/${GITHUB_USER:-your-github-user-lowercase}/nexus-server:latest
    container_name: nexus-server
    restart: unless-stopped
    expose:
      - 7860
    environment:
      HOST: 0.0.0.0
      PORT: "7860"
      RUST_LOG: ${RUST_LOG:-info}
      # Bypass service URL (container name resolves via Docker network)
      CF_SERVICE_URL: http://bypass:8000
      # API authentication key (leave empty to disable auth)
      API_KEY: ${API_KEY:-}
      # CORS allowed origins (comma-separated, e.g. "http://localhost:5173")
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./sources:/app/sources

  bypass:
    build: ./bypass
    container_name: nexus-bypass
    restart: unless-stopped
    expose:
      - 8000
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BYPASS_MAX_CONCURRENCY: "20"
      BYPASS_MAX_PER_DOMAIN: "3"
      CF_API_KEY: ${CF_API_KEY:-}

  ai-inference:
    build: ./ai-inference
    container_name: nexus-ai-inference
    restart: unless-stopped
    profiles:
      - ai
    expose:
      - 8001
    environment:
      AI_ENGINE: ${AI_ENGINE:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}

  frontend:
    image: ghcr.io/${GITHUB_USER:-your-github-user-lowercase}/nexus-frontend:latest
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8080}:8080"
    depends_on:
      - nexus-server