# ============================================================
# Reader 在线阅读 - NAS 独立部署版
# ============================================================
# 💡 完全无需克隆代码，直接拉取预构建镜像运行
#
# 📦 使用方法:
#   1. 将此文件保存到 NAS 的任意目录
#   2. 执行: docker compose up -d
#   3. 访问: http://your-nas-ip:4396
#
# 🔄 更新方式 (二选一):
#   A) 自动更新: Watchtower 每 6 小时检查一次，有新版本自动更新
#   B) 手动更新: docker compose pull && docker compose up -d
#
# ============================================================

services:
  # ─────────────────────────────────────────────────────────
  # 主服务: NexusLite (Rust 后端 + Vue3 前端)
  # ─────────────────────────────────────────────────────────
  nexus-lite:
    image: ghcr.io/3kaiu/nexus-lite:latest
    container_name: nexus-lite
    restart: unless-stopped
    # 强制以 Root 运行以解决 NAS 挂载卷权限问题
    user: "0:0"
    labels:
      - "com.centurylinklabs.watchtower.scope=reader"
    ports:
      - "4396:8080"
    volumes:
      # 📁 持久化数据 (书架、阅读进度、分组) - 必须保留
      - ./data:/app/data
      # 📁 自定义书源 (可选，镜像已内置默认书源)
      - ./sources:/app/sources
      # 📁 章节缓存 (可选，删除后可重建)
      - ./cache:/app/cache
      # 📁 发现页数据 (与 cf-bypass 共享)
      - ./data/qidian:/app/data/qidian
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=info
      - CF_SERVICE_URL=http://cf-bypass:8000
      # 代理设置 (已自动连接到 proxy-service)
      - CF_PROXY=http://proxy-service:7890
      - DISCOVERY_DATA_DIR=/app/data/qidian
    depends_on:
      cf-bypass:
        condition: service_healthy
      proxy-service:
        condition: service_started
    networks:
      - reader-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────────────────
  # 辅助服务: CF Bypass (Cloudflare/反爬虫绕过)
  # ─────────────────────────────────────────────────────────
  cf-bypass:
    image: ghcr.io/3kaiu/cf-bypass-service:latest
    container_name: cf-bypass
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./data/qidian:/app/data/qidian
    labels:
      - "com.centurylinklabs.watchtower.scope=reader"
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
      - ENABLE_STEALTH=true
      - REQUEST_TIMEOUT=30
      # 全局代理 (已自动连接到 proxy-service)
      - GLOBAL_PROXY=http://proxy-service:7890
    depends_on:
      proxy-service:
        condition: service_started
    networks:
      - reader-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────────────────
  # 自动更新: Watchtower (可选，但强烈推荐)
  # ─────────────────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    privileged: true
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Asia/Shanghai
      # 🧹 自动清理旧镜像
      - WATCHTOWER_CLEANUP=true
      # ⏰ 检查间隔 (秒): 21600 = 6小时
      - WATCHTOWER_POLL_INTERVAL=21600
      # 📋 只监控指定容器
      - WATCHTOWER_SCOPE=reader
      # 🐳 适配新版 Docker API
      - DOCKER_API_VERSION=1.44
    labels:
      - "com.centurylinklabs.watchtower.scope=reader"
    networks:
      - reader-network

  # ─────────────────────────────────────────────────────────
  # 代理服务: Proxy Service (mihomo / clash)
  # ─────────────────────────────────────────────────────────
  proxy-service:
    image: metacubex/mihomo
    container_name: reader-proxy
    restart: unless-stopped
    command: >
      -config /etc/mihomo/config.yaml
    ports:
      - "7890:7890" # HTTP Proxy
      - "7891:7891" # SOCKS5 Proxy
      - "9090:9090" # External Controller
    volumes:
      - ./proxy/config.yaml:/etc/mihomo/config.yaml
    networks:
      - reader-network

networks:
  reader-network:
    driver: bridge
