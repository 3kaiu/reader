[project]
name = "ai-inference"
version = "0.1.0"
description = "AI inference service for Nexus Reader — alias decoding, chapter scanning, context analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.5.0",
    "httpx>=0.28.0",
    "ollama>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
]
