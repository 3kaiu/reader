# Stable rustfmt configuration
max_width = 100
fn_call_width = 80
struct_lit_width = 18
struct_variant_width = 35
array_width = 60
chain_width = 60
attr_fn_like_width = 70
hard_tabs = false
tab_spaces = 4
use_field_init_shorthand = true
use_try_shorthand = true
force_explicit_abi = true
reorder_imports = true
merge_derives = true
newline_style = "Unix"
match_block_trailing_comma = true
