[workspace]
resolver = "2"
members = [
    "nexus-core",
    "nexus-engine",
    "nexus-storage",
    "nexus-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["3kaiu"]
license = "MIT"
description = "A lightweight, plugin-based book source aggregation engine for Chinese web novels"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = "z"
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
