[workspace]
resolver = "2"
members = [
    "nexus-core",
    "nexus-engine",
    "nexus-storage",
    "nexus-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["3kaiu"]
license = "MIT"
description = "Rust backend workspace for Nexus"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async trait
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
dashmap = "6"
parking_lot = "0.12"

# URL handling
url = "2"
http = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
debug = true
