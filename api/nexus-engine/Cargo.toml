[package]
name = "nexus-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Book source execution engine for Nexus"

[dependencies]
nexus-core = { path = "../nexus-core", features = ["discovery"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "cookies"
] }

# HTML Parsing
scraper = "0.25"
readability-rust = "0.1"
ego-tree = "0.10"

# Regex
regex = "1"

# JSONPath
serde_json_path = "0.7"

# Encoding (for URL handling)
url.workspace = true
urlencoding = "2"
encoding_rs = "0.8"
http.workspace = true

# Utilities
parking_lot.workspace = true
dashmap.workspace = true
lru = "0.13"
rand = "0.10"
aho-corasick = "1.1"

# JavaScript Engine (rquickjs - embedded QuickJS)
rquickjs = { version = "0.6", features = ["loader", "parallel", "classes", "properties"] }

# Content Cleaning
ttf-parser = "0.25"           # Font parsing for font decryption
strsim = "0.11"               # String similarity for deduplication
unicode-normalization = "0.1" # Unicode normalization
primp = "1.3.1"

# Cloudflare bypass is handled by the external `bypass/` service in this repo.

[features]
default = []
discovery = ["nexus-core/discovery"]
use-rquickjs = [] # Enable rquickjs-based JS sandbox (experimental)

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
