[package]
name = "nexus-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Book source execution engine for Nexus"

[dependencies]
nexus-core = { path = "../nexus-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "cookies"
] }

# HTML Parsing
scraper = "0.25"
readability-rust = "0.1"
lol_html = "1.1"
kuchiki = "0.8"
ego-tree = "0.6"

# JSON Path
jsonpath-rust = "1.0"

# Regex
regex = "1"

# Encoding (for URL handling)
url = "2"
urlencoding = "2"
encoding_rs = "0.8"
http = "1"

# Utilities
parking_lot = "0.12"
dashmap = "6"
lru = "0.17"
futures-util = "0.3.32"
rand = "0.9"
aho-corasick = "1.1"
rayon = "1.10"
memmap2 = "0.9"
wasm-bindgen = "0.2"

# Content Cleaning
ttf-parser = "0.25"           # Font parsing for font decryption
strsim = "0.11"               # String similarity for deduplication
unicode-normalization = "0.1" # Unicode normalization

# Cloudflare bypass is handled by the external `bypass/` service in this repo.

[features]
default = []

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
