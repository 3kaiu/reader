[package]
name = "nexus-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP API server for Nexus"

[[bin]]
name = "nexus-server"
path = "src/main.rs"

[dependencies]
nexus-core = { path = "../nexus-core" }
nexus-engine = { path = "../nexus-engine", features = ["discovery"] }
nexus-storage = { path = "../nexus-storage" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap.workspace = true

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-br", "compression-gzip"] }

# Futures
futures = "0.3"
tokio-stream = "0.1"

# URL parsing
url.workspace = true

# Rate limiting
tower_governor = { version = "0.8", features = ["axum"] }

# HTTP client (for URL import)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Encoding detection (for URL import content decoding)
encoding_rs = "0.8"

# HTTP types (for extracting client IP)
http.workspace = true

[features]
default = ["discovery"]
discovery = ["nexus-core/discovery"]
